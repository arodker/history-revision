var rv=false,hn=false,cur={};
function pk(a){return a[Math.floor(Math.random()*a.length)];}

function gen(){
  rv=false;hn=false;
  var g=pk(Object.keys(D)),r=pk(D[g].r),p=pk(P);
  cur={g:g,r:r,p:p};
  document.getElementById('tg').textContent=g;
  document.getElementById('tr').textContent=r;
  document.getElementById('tp').textContent=p;
  document.getElementById('hw').classList.remove('open');
  document.getElementById('hws').innerHTML='';
  document.getElementById('sw').classList.remove('open');
  document.getElementById('sl').innerHTML='';
  var rb=document.getElementById('rb');rb.textContent='Reveal facts';rb.classList.remove('done');
  var hb=document.getElementById('hb');hb.textContent='Hint';hb.classList.remove('shown');
}

function doHint(){
  if(hn)return;hn=true;
  var stats=((D[cur.g]||{}).s||{})[cur.r]&&((D[cur.g]||{}).s||{})[cur.r][cur.p]||[];
  document.getElementById('hws').innerHTML=stats.map(function(s){return '<span class="hword">'+s[0]+'</span>';}).join('');
  document.getElementById('hw').classList.add('open');
  var hb=document.getElementById('hb');hb.textContent='Hints shown';hb.classList.add('shown');
}

function doReveal(){
  if(rv)return;rv=true;
  var stats=((D[cur.g]||{}).s||{})[cur.r]&&((D[cur.g]||{}).s||{})[cur.r][cur.p]||[];
  var sl=document.getElementById('sl');
  sl.innerHTML=stats.map(function(s,i){return '<div class="stat" id="s'+i+'"><span class="sn">'+(i+1)+'</span><span class="st">'+s[1]+'</span></div>';}).join('');
  document.getElementById('sw').classList.add('open');
  stats.forEach(function(_,i){setTimeout(function(){var e=document.getElementById('s'+i);if(e)e.classList.add('show');},i*90);});
  var rb=document.getElementById('rb');rb.textContent='Revealed \u2713';rb.classList.add('done');
}

window.addEventListener('DOMContentLoaded',gen);
</script>
