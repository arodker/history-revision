<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
<meta name="theme-color" content="#f8f7f4">
<title>Mr Rodker's Revision Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%A5%A3%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}html{font-size:clamp(17px,.9vw + 8px,24px)}

:root{
  --bg:#f8f7f4;--text:#1a1a18;--muted:#6b6b68;--border:#e8e7e2;
  --gcse:#0F6E56;--gcse-bg:#E1F5EE;--gcse-mid:#1D9E75;
  --hist-stamp:#E8821E;
  --aa:#1B4B8A;--aa-bg:#EEF3FB;--aa-mid:#4A7EC7;
  --lab:#9B2335;--lab-bg:#FBEEF0;--lab-mid:#C94A5A;
  --geo:#2E8B57;--geo-bg:#EAF0FB;
  --rs:#2A6BC8;--rs-bg:#F3EEF9;
}

body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:52rem;margin:0 auto;padding:2rem 1.25rem 4rem}

h1{font-size:1.45rem;font-weight:700;margin-bottom:.2rem}
.subtitle{font-size:.8rem;color:var(--muted);margin-bottom:2.3rem}

.subject-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1rem;
}
@media (max-width:640px){
  .subject-grid{grid-template-columns:1fr}
}

.subject-box{
  background:var(--surface,#fff);border:1.5px solid var(--border);border-radius:16px;
  padding:1.3rem 1.1rem 1.1rem;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  animation:up .3s ease backwards;cursor:pointer;
}
.subject-box:nth-child(1){animation-delay:.05s}
.subject-box:nth-child(2){animation-delay:.1s}
.subject-box:nth-child(3){animation-delay:.15s}

.stamp-circle{
  width:58px;height:58px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:1.55rem;
  border:3px solid var(--sc,var(--border));position:relative;color:var(--sc,var(--muted));
  margin-bottom:.6rem;background:none;cursor:pointer;
  transition:transform .15s;
  font-family:inherit;padding:0;
}
.stamp-circle::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--sc,var(--border));opacity:.35}
.stamp-circle.soon{opacity:.45}
.stamp-circle:hover{transform:scale(1.06)}
.stamp-circle:focus-visible{outline:3px solid var(--text);outline-offset:3px}

.subj-name2{font-size:1.02rem;font-weight:700;margin-bottom:.1rem}
.subj-tag{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.4rem;display:flex;align-items:center;gap:.25rem}
.subj-tag::after{content:'▾';font-size:.6rem;opacity:.6;transition:transform .2s}
.subject-box.expanded .subj-tag::after{transform:rotate(180deg)}

.ticket-list{
  display:flex;flex-direction:column;gap:.55rem;width:100%;
  max-height:0;opacity:0;overflow:hidden;
  transition:max-height .3s ease,opacity .25s ease,margin-top .3s ease;
}
.subject-box.expanded .ticket-list,
.subject-box:hover .ticket-list,
.subject-box:focus-within .ticket-list{
  max-height:260px;opacity:1;margin-top:.3rem;
}
.ticket{
  position:relative;background:var(--tc-bg,#fff);color:var(--tc,var(--muted));
  border:2px solid var(--tc-mid,var(--border));border-radius:8px;
  padding:.55rem .7rem;font-size:.76rem;font-weight:700;
  text-decoration:none;display:block;line-height:1.3;text-align:center;
  transition:transform .15s,box-shadow .15s;box-shadow:0 1px 2px rgba(0,0,0,.05);
}
.ticket:hover{transform:translateY(-2px);box-shadow:0 5px 12px rgba(0,0,0,.09)}
.ticket:focus-visible{outline:3px solid var(--text);outline-offset:2px}

.ticket-soon{
  background:transparent;color:#aaa;border:2px dashed var(--border);cursor:default;box-shadow:none;
  text-align:center;
}
.ticket-soon:hover{transform:none;box-shadow:none}

@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{animation:up .3s ease backwards}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <h1>Mr Rodker's Revision Hub</h1>
  <p class="subtitle">MCA Humanities Learning Area</p>

  <div class="subject-grid">

    <div class="subject-box">
      <button type="button" class="stamp-circle" style="--sc:var(--hist-stamp)" aria-label="Toggle History courses">🏛️</button>
      <div class="subj-name2">History</div>
      <div class="subj-tag">3 courses</div>
      <div class="ticket-list">
        <a href="GCSE.html" class="ticket" style="--tc:var(--gcse);--tc-bg:var(--gcse-bg);--tc-mid:var(--gcse-mid)">GCSE History</a>
        <a href="Y12.html" class="ticket" style="--tc:var(--lab);--tc-bg:var(--lab-bg);--tc-mid:var(--lab-mid)">Y12 History</a>
        <a href="civil-rights.html" class="ticket" style="--tc:var(--aa);--tc-bg:var(--aa-bg);--tc-mid:var(--aa-mid)">Y13 History</a>
      </div>
    </div>

    <div class="subject-box">
      <button type="button" class="stamp-circle soon" style="--sc:var(--rs)" aria-label="Toggle Religious Studies courses">🕊️</button>
      <div class="subj-name2" style="color:var(--muted)">Religious Studies</div>
      <div class="subj-tag">Coming soon</div>
      <div class="ticket-list">
        <div class="ticket ticket-soon">GCSE RS</div>
        <div class="ticket ticket-soon">Philosophy and Ethics</div>
      </div>
    </div>

    <div class="subject-box">
      <button type="button" class="stamp-circle soon" style="--sc:var(--geo)" aria-label="Toggle Geography courses">🌍</button>
      <div class="subj-name2" style="color:var(--muted)">Geography</div>
      <div class="subj-tag">Coming soon</div>
      <div class="ticket-list">
        <div class="ticket ticket-soon">GCSE Geography</div>
        <div class="ticket ticket-soon">A Level Geography</div>
      </div>
    </div>

  </div>

</div>
<script>
document.querySelectorAll('.subject-box').forEach(function(box){
  box.addEventListener('click', function(e){
    if (e.target.closest('.ticket-list')) return; // let the real course links navigate normally
    box.classList.toggle('expanded');
  });
});
</script>
</body>
</html>
