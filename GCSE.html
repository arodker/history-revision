 facts:['1303: Edward I granted Hansa (German) merchants lower taxes to operate the Steelyard in London – boosted English wool exports to Europe','1351: Edward III invited skilled Flemish weavers expelled from France – wanted their expertise to develop English cloth industry','Colchester rose from 53rd to 13th richest town in England as a result of Flemish weavers','Craft guilds resented migrants – accused them of stealing jobs and lowering wages; periodic riots','English cloth trade became hugely profitable; Hansa and Flemish migrants were fundamental to this transformation']},

// ── PAPER 1 · Unit 2 Early Modern ───────────
{paper:'p1',unit:'Unit 2 – Early Modern',heading:'Huguenot migrants c.1570–1710',
 hints:['Massacre','Denizen','Spitalfields','Bank','Riots'],
 facts:['1572: St Bartholomew\'s Day Massacre – 30,000 Huguenots murdered in France; thousands fled to Protestant England','1681: Charles II granted all Huguenots Denizen status – legal protection and right to own property','Huguenots transformed Spitalfields into a major textile centre – cloth exports rose twenty-fold over the century','Helped found the Bank of England (1694); started the English paper industry – 200 paper mills by 1714','English weavers rioted in 1675, 1681 and 1683 fearing job competition; tensions eased when Huguenots shared skills']},

{paper:'p1',unit:'Unit 2 – Early Modern',heading:'Palatine migrants 1708–09',
 hints:['Rhineland','13000','Naturalisation','Deported','Burden'],
 facts:['Wars in the Rhineland drove ~13,000 Palatine German Protestant refugees to London in 1709','1708: Foreign Protestants Naturalisation Act gave all European Protestants full citizenship – England positioned as Protestant sanctuary','Unlike Huguenots, Palatines were refugees not skilled workers – seen as a burden rather than an economic asset','Government response was hostile: 3,000 deported to Ireland when numbers overwhelmed resources','Their reception shows that Protestant identity alone was not enough – economic usefulness mattered too']},

{paper:'p1',unit:'Unit 2 – Early Modern',heading:'Return of the Jews 1656',
 hints:['Cromwell','Manasseh','Bevis','Restrictions','Finance'],
 facts:['1656: Cromwell, persuaded by Rabbi Manasseh ben Israel, allowed Jews to return to England to escape European persecution','Jews allowed to build their own synagogue – Bevis Marks in London (1701); could practise faith openly','Restrictions remained: still banned from university, army, law and Parliament','Jewish financiers helped develop London as a major financial centre after their return','Contrast with 1290 expulsion shows how economic usefulness again shaped government attitudes toward Jewish migrants']},

{paper:'p1',unit:'Unit 2 – Early Modern',heading:'Flemings and Walloons in Sandwich and Canterbury',
 hints:['Sandwich','Canterbury','Tripled','Restrictions','Skills'],
 facts:['1560s–70s: local councils in Sandwich and Canterbury actively invited Flemish and Walloon weavers to boost textile economy','Sandwich harbour traffic tripled in a decade; Canterbury allocated 100 empty homes to Walloon migrants','1569: Flemings in Sandwich banned from work Englishmen could do – resentment from local weavers grew','Tensions in Canterbury eased when Walloons shared skills: silk weaving, lace-making, diamond cutting; employed English workers','Shows local economic invitation could work but required skill-sharing to reduce hostility']},

// ── PAPER 1 · Unit 3 18th & 19th Centuries ──
{paper:'p1',unit:'Unit 3 – 18th & 19th Centuries',heading:'Irish migrants',
 hints:['Famine','Orange','Navvies','Scouse','Catholics'],
 facts:['Acts of Union 1801: Ireland incorporated into UK; Irish Catholics (90% of population) owned only 14% of land','Irish Famine 1845–46: potato blight killed ~1 million; ~2 million fled – many to Liverpool and Manchester','Orange Order violently opposed Catholic Irish migrants in Liverpool and Glasgow throughout the 19th century','Irish navvies built over 20,000 miles of British railway – fundamental to industrial infrastructure','Liverpool\'s Scouse accent developed partly from Irish speech patterns; Irish made up over 20% of the city\'s population by 1850s']},

{paper:'p1',unit:'Unit 3 – 18th & 19th Centuries',heading:'Ashkenazi Jews in Whitechapel',
 hints:['Pogroms','Yiddish','Ripper','Aliens','Sweatshops'],
 facts:['1880s: Russian pogroms drove ~150,000 Ashkenazi Jews to Britain; many settled in Whitechapel near docks and existing Jewish community','Some streets became 95% Jewish; Yiddish speakers often worked only within Jewish clothing sweatshops','Jewish Free School established to help children integrate and learn English','1888: Jews falsely blamed for Jack the Ripper murders by popular press – increased prejudice with no evidence','1905: Aliens Act directly targeted Ashkenazi Jewish migrants – Britain\'s first immigration restriction law']},

{paper:'p1',unit:'Unit 3 – 18th & 19th Centuries',heading:'South Asian migrants in the 18th & 19th centuries',
 hints:['Ayahs','Lascars','Suez','Abandoned','Space'],
 facts:['East India Company expansion from 1600s created demand for Indian Lascars (sailors) and Ayahs (nannies/servants)','Suez Canal opened 1869 – halved travel times between Britain and India; increased movement of people','1876: white sailors given 10 feet of personal space on ships; Lascars given only 6 feet – institutionalised racial inequality','Indian Ayahs sometimes abandoned by employers on arrival in England; Ayahs\' Home opened in Hackney 1900','Lascars paid less than white sailors and given inferior living conditions by shipping companies']},

{paper:'p1',unit:'Unit 3 – 18th & 19th Centuries',heading:'Black migrants in the 18th & 19th centuries',
 hints:['Somerset','Loyalists','Deported','Equiano','Ornaments'],
 facts:['1772: Somerset Case ruled slavery illegal in Britain – made Britain a refuge for enslaved Africans seeking freedom','American War of Independence 1780s: Black Loyalists who fought for Britain were given homes in Britain','400 black migrants deported from London to Sierra Leone 1792 – despite earlier promises of freedom','Black abolitionists Equiano and Sancho wrote autobiographies that helped persuade Parliament to abolish the slave trade (1807)','Some wealthy families kept African children as household "ornaments" – reflecting deep racial attitudes of the period']},

{paper:'p1',unit:'Unit 3 – 18th & 19th Centuries',heading:'Liverpool as a case study in migration',
 hints:['Irish','Lascars','Docklands','Orange','20percent'],
 facts:['Liverpool was Britain\'s busiest port and became a major centre of migrant settlement throughout the 18th and 19th centuries','Irish community: Irish Famine (1845–46) drove mass migration; by the 1850s Irish made up over 20percent of Liverpool\'s population – the highest concentration in any English city','Irish migrants settled in courts and cellars near the docks; faced intense Orange Order hostility; Catholic-Protestant tensions led to regular street violence throughout the 19th century','Lascars: South Asian and East African sailors employed by the East India Company regularly landed in Liverpool; many settled around the docklands; faced exploitation and inferior conditions','Liverpool became a genuinely multi-ethnic city by the late 19th century – but migrant communities faced poverty, disease and hostility in a city shaped by the slave trade and empire']},

// ── PAPER 1 · Unit 4 Modern ─────────────────
{paper:'p1',unit:'Unit 4 – Modern',heading:'WWI/WWII troops and refugees',
 hints:['Belgian','Kindertransport','Polish','Resettlement','Rebuild'],
 facts:['WWI: ~250,000 Belgian refugees welcomed in Britain as war victims; 90% returned home after 1918','Kindertransport 1938–39: ~8,000 Jewish children evacuated from Nazi Germany to British families – one of the most significant humanitarian acts in British history','WWII: millions of colonial soldiers from India, Africa and Caribbean served Britain; personal connections to Britain created expectation of belonging','1947: Polish Resettlement Act allowed ~120,000 Polish soldiers and families to remain in Britain','Post-WWII Britain needed over 1 million workers to Rebuild – actively recruited in Caribbean for London Transport and the NHS']},

{paper:'p1',unit:'Unit 4 – Modern',heading:'Windrush Generation',
 hints:['Nationality','Transport','NHS','Relations','Scandal'],
 facts:['1948 British Nationality Act gave all Commonwealth subjects the legal right to settle in Britain','London Transport and NHS actively recruited in the Caribbean – adverts in local newspapers; average pay four times higher than in the Caribbean','By 1960s: 12% of London Transport employees from ethnic minorities; by 2003: 30% of NHS doctors and 44% of nurses were migrants','1965 Race Relations Act: first law banning racial discrimination; 1976 Race Relations Act strengthened protections','2012: Windrush Scandal – legal Caribbean migrants wrongly detained, denied healthcare and threatened with deportation; exposed institutional failure']},

{paper:'p1',unit:'Unit 4 – Modern',heading:'East African Asians',
 hints:['Kenya','Amin','Leicester','Golden','Diwali'],
 facts:['1967: Africanisation in Kenya forced ~20,000 Kenyan Asians to choose British citizenship or leave; many came to Britain','1972: Idi Amin expelled ~27,000 Asians from Uganda with 90 days\' notice; most settled in Leicester and the Midlands','Leicester City Council placed adverts in Ugandan newspapers discouraging migration – showing official hostility','Despite initial hostility, Belgrave Road in Leicester became the "Golden Mile" due to prosperous Asian-owned businesses','Leicester now hosts the largest Diwali celebrations outside Asia']},

{paper:'p1',unit:'Unit 4 – Modern',heading:'EU migration',
 hints:['Maastricht','Poland','Brexit','3million','Freedom'],
 facts:['1992: Maastricht Treaty created the EU and free movement of people across all member states','2004: EU expansion brought large numbers of Polish and Eastern European workers to Britain','One of the largest waves of migration in British history – approximately 3 million EU citizens settled in Britain','Net migration from EU averaged ~150,000/year in the decade before Brexit','Brexit 2016: free movement ended – government policy reversed the entire framework for EU migration']},

{paper:'p1',unit:'Unit 4 – Modern',heading:'Black migrants in Bristol – 20th century',
 hints:['Windrush','Boycott','Lawrence','Riots','StPauls'],
 facts:['Caribbean migrants arrived in Bristol from late 1940s onwards; settled in St Pauls district; faced colour bar in housing, pubs and employment – Bristol Omnibus Company refused to employ black or Asian drivers or conductors','Bristol Bus Boycott 1963: led by Paul Stephenson and the West Indian Development Council; four-month boycott of Bristol buses forced the company to end its colour bar – directly influenced the 1965 Race Relations Act','Boycott was a key moment in British civil rights: showed that organised community action could challenge institutional racism through non-violent protest','1980: St Pauls riots broke out after police raid on the Black and White Café; two nights of unrest; showed deep tensions between Bristol\'s black community and police','1981: Scarman Report into Brixton riots (London) also reflected conditions in St Pauls – recommended community policing reforms; showed systemic problems nationally, not just locally']},

{paper:'p1',unit:'Unit 4 – Modern',heading:'20th Century legislation for migrants',
 hints:['Aliens','Nationality','Commonwealth','Relations','Equality'],
 facts:['1905 Aliens Act: Britain\'s first immigration restriction law – specifically targeted Ashkenazi Jewish migrants fleeing Russian pogroms; introduced immigration officers and right of refusal','1948 British Nationality Act: gave all Commonwealth subjects the legal right to settle in Britain – enabled the Windrush Generation; a deliberate government policy to recruit labour','1962 Commonwealth Immigrants Act: restricted Commonwealth immigration for the first time – required employment vouchers; a major reversal of the 1948 open-door policy','1968 Commonwealth Immigrants Act: rushed through in three days specifically to prevent Kenyan Asians (British passport holders) from settling – widely condemned as racist','Race Relations Acts 1965, 1976 and 2010: banned racial discrimination progressively – 1965 in public places, 1976 in employment and housing, 2010 Equality Act created comprehensive legal framework']},

{paper:'p1',unit:'Unit 4 – Modern',heading:'Anti-immigration politicians and movements',
 hints:['Mosley','Powell','National','Lewisham','Rivers'],
 facts:['Oswald Mosley: led British Union of Fascists in the 1930s (Battle of Cable Street 1936); returned with Union Movement after WWII; "Keep Britain White" slogan; received 8% of vote in Notting Hill 1959','Enoch Powell: Conservative MP; gave "Rivers of Blood" speech April 1968 – predicted racial violence if immigration continued; dismissed from Shadow Cabinet by Heath but 74% of British public agreed with him','National Front: founded 1967; grew rapidly in the 1970s; combined racism, antisemitism and anti-immigration politics; regular marches through immigrant communities','Battle of Lewisham 1977: National Front march through South London was blocked by anti-racist protesters; police protected National Front marchers; 214 arrests; showed public opposition to far right']},

{paper:'p1',unit:'Unit 4 – Modern',heading:'Asian community in Leicester',
 hints:['Amin','Belgrave','Golden','Diwali','Integration'],
 facts:['1972: Idi Amin gave Ugandan Asians 90 days to leave Uganda; ~27,000 settled in Britain; Leicester City Council placed adverts in Ugandan newspapers discouraging them from coming to Leicester specifically','Despite official hostility, many Ugandan Asians settled in Leicester – they were educated, entrepreneurial and had business experience; brought capital and skills','Belgrave Road in Leicester became the "Golden Mile" – Asian-owned shops, restaurants, jewellers and textile businesses created a prosperous and distinctive commercial district','Leicester now hosts the largest Diwali celebrations outside of India and Nepal – more than 35,000 people gather on Belgrave Road for the lights ceremony each year','Leicester is often cited as an example of successful multicultural integration: by 2011 it was one of the first British cities where white British were a minority; multiple communities have political representation']},


// ── PAPER 1 · Unit 5 Notting Hill ───────────
{paper:'p1',unit:'Unit 5 – Notting Hill',heading:'Arrival and settlement in Notting Hill',
 hints:['Bomb','Colour','Rachman','Pardner','Trust'],
 facts:['Post-WWII Notting Hill had cheap bomb-damaged housing – one of few areas where Caribbean migrants could rent given the colour bar elsewhere','Colour bar: estate agents and landlords refused housing to black migrants across London','Peter Rachman exploited black tenants: bought run-down properties, charged high rents, refused repairs, used threats to evict complainants','Sam King (ex-RAF) organised pardner schemes – informal community savings groups helping migrants buy homes','Notting Hill Housing Trust founded 1963 by Bruce Kenrick – provided fair housing for over 1,000 black residents']},

{paper:'p1',unit:'Unit 5 – Notting Hill',heading:'Housing and the colour bar',
 hints:['HMOs','Rachman','Protection','Portobello','Shebeens'],
 facts:['Colour bar forced most Caribbean migrants into multi-occupancy houses (HMOs) in run-down areas – no legal protection against discrimination until 1965','Rachman: packed tenants in, charged high rents, refused repairs, used intimidation to remove those who complained','Portobello Road Market hosted Caribbean food stalls – became a hub of Caribbean identity and community life','Shebeens (unlicensed basement clubs) developed because pubs and clubs routinely refused entry to black customers','No Race Relations Act until 1965 – black tenants entirely unprotected against exploitation throughout the 1950s']},

{paper:'p1',unit:'Unit 5 – Notting Hill',heading:'Racism and policing',
 hints:['97%','NoLaw','Teddy','Mosley','Stop'],
 facts:['In the 1950s: 97% of police were white men; no laws against racial discrimination existed','Police routinely raided black-owned businesses without evidence; failed to investigate racist attacks on black residents','Teddy Boys carried out violent street attacks on black people; police frequently failed to prosecute perpetrators','Oswald Mosley\'s Union Movement ran "Keep Britain White" campaign in 1959; received 8% of vote in North Kensington','Government allowed the White Defence League to hold rallies – showing official tolerance of racist organisations']},

{paper:'p1',unit:'Unit 5 – Notting Hill',heading:'1958 riots and murder of Kelso Cochrane',
 hints:['Mob','Police','Mail','Cochrane','Funeral'],
 facts:['August 1958: white mob of ~400 attacked black homes with petrol bombs, iron bars and clubs; violence lasted five nights','Police refused to link violence to racism; arrested black residents who defended themselves – one third of arrests were black victims','Daily Mail blamed black migrants for "provoking tensions" – reinforced rather than challenged racist narratives','May 1959: Kelso Cochrane (32-year-old Antiguan carpenter) killed by white youths; community believed police failed to investigate properly','Funeral attended by 1,200 mourners – black and white – showing solidarity; government still allowed White Defence League to rally']},

{paper:'p1',unit:'Unit 5 – Notting Hill',heading:'Black activism – Claudia Jones',
 hints:['Gazette','Carnival','Calypso','Panthers','Trinidad'],
 facts:['Claudia Jones (Trinidad-born activist) founded the West Indian Gazette 1958 – first major newspaper for Black Britons; campaigned against colour bars and racist immigration laws','1959: Jones organised the first Caribbean Carnival at St Pancras Town Hall in direct response to the 1958 riots – Calypso music, dance, Caribbean heritage celebrated','After Jones\' death the event moved outdoors and became the Notting Hill Carnival 1966 – now the largest street festival in Europe','British Black Panthers (BBP) focused on Black pride, self-defence against police brutality, housing and education','BBP led the 1970 protest march against police harassment of the Mangrove restaurant']},

{paper:'p1',unit:'Unit 5 – Notting Hill',heading:'Mangrove Nine 1970–71',
 hints:['Raids','Howe','OldBailey','Verdict','Racism'],
 facts:['Mangrove restaurant (Frank Crichlow) raided nine times in 18 months without justification; served as a community hub for meetings and legal advice','1970: BBP led protest march; police arrested nine leaders including Darcus Howe, Altheia Jones-LeCointe and Frank Crichlow','Tried at the Old Bailey 1971; demanded all-black jury citing Magna Carta right to "jury of peers" – denied','Found not guilty of main charges; judge explicitly stated racial hatred had influenced police actions','First official recognition of institutional racism in British policing – landmark moment in Black British history']},

{paper:'p1',unit:'Unit 5 – Notting Hill',heading:'Primary sources for Notting Hill',
 hints:['Gazette','Census','Times','Police','Oral'],
 facts:['West Indian Gazette (1958): shows Caribbean community perspectives on discrimination and activism – but as a campaign paper it reflects the views of activists, not all migrants','Census records 1951 and 1961: show numbers and types of people living in specific areas – useful for tracking settlement patterns objectively','National newspapers (The Times, Daily Mail): reveal how mainstream opinion viewed events – but can reflect prejudice of editors','Local police records and court transcripts: show how incidents were handled – useful for studying racial justice but may omit or minimise racist motivation','Oral history interviews (Crichlow, Jones): rich first-hand accounts – but subjective; memory selective; recorded long after events']},

// ── PAPER 2A · Unit 1 Origins 1941–58 ───────
{paper:'p2a',unit:'Unit 1 – Origins 1941–58',heading:'Grand Alliance and Tehran Conference',
 hints:['Alliance','Common','Tehran','Front','Suppressed'],
 facts:['1941: USA and UK formed Grand Alliance with USSR to defeat Nazi Germany – ideological differences between capitalism and communism put aside','Tehran Conference 1943: Stalin, Roosevelt and Churchill agreed strategy; Stalin pleased when Allies committed to a "second front" (D-Day 1944)','Alliance held together only by the common enemy – with Germany defeated it rapidly unravelled','Potsdam 1945: Stalin had already broken his Tehran promises; Roosevelt replaced by anti-Communist Truman; atomic bomb dropped without telling Stalin','The Grand Alliance was a temporary marriage of convenience, not a genuine partnership']},

{paper:'p2a',unit:'Unit 1 – Origins 1941–58',heading:'Yalta Conference February 1945',
 hints:['Zones','Elections','Promise','Roosevelt','Broken'],
 facts:['February 1945: agreed Germany split into four occupation zones; Berlin (inside Soviet zone) also divided into four','Stalin promised free and fair elections in Poland and Eastern Europe – a promise he immediately broke','Roosevelt died between Yalta and Potsdam; replaced by Truman who was far more aggressively anti-Communist','Stalin installed communist governments in Eastern Europe before the war had even ended','The broken Yalta promises were the single most important cause of the collapse of the Grand Alliance']},

{paper:'p2a',unit:'Unit 1 – Origins 1941–58',heading:'Potsdam Conference July 1945',
 hints:['Truman','Atomic','Broken','Tension','Agreements'],
 facts:['July 1945: with Hitler dead and Germany defeated, the common enemy was gone – tensions immediately surfaced','Stalin had already broken his Yalta promise by installing communist governments in Eastern Europe','Truman dropped the atomic bomb on Japan without telling Stalin – Stalin saw this as a direct threat to the USSR','Conference ended with very few agreements and enormous tension between Truman and Stalin','Potsdam was the point at which the Grand Alliance effectively collapsed']},

{paper:'p2a',unit:'Unit 1 – Origins 1941–58',heading:'Satellite states and Iron Curtain',
 hints:['Buffer','Cominform','Comecon','Curtain','Churchill'],
 facts:['Stalin created a "buffer zone" of communist satellite states – Poland, Czechoslovakia, Hungary, Romania, Bulgaria – to protect USSR from future invasion','1946: Churchill\'s "Iron Curtain" speech described the division of Europe into capitalist west and communist east','1947: Cominform set up to direct and control satellite state leaders','1949: Comecon set up to control satellite economies – mirror image of the Marshall Plan','Satellite states had no genuine independence – leaders took orders from Moscow']},

{paper:'p2a',unit:'Unit 1 – Origins 1941–58',heading:'Long and Novikov Telegrams 1946',
 hints:['Kennan','Novikov','Containment','Paranoia','Enemy'],
 facts:['February 1946: Long Telegram from US Ambassador Kennan – advised Truman the USSR was expansionist and must be "contained"; not a partner for diplomacy','September 1946: Novikov Telegram from Soviet Ambassador – advised Stalin the USA was seeking world domination and was an enemy','Both telegrams formally advised their governments to treat the other as an enemy – hardened attitudes on both sides','Long Telegram directly shaped the Truman Doctrine (1947) – "containment" became official US policy','Together the telegrams show how diplomatic communications formalised Cold War hostility']},

{paper:'p2a',unit:'Unit 1 – Origins 1941–58',heading:'Truman Doctrine and Marshall Plan 1947',
 hints:['Containment','$400m','$13bn','Imperialism','Cominform'],
 facts:['1947: Truman Doctrine – $400m to anti-communist fighters in Greece and Turkey; USA committed to containing communism anywhere in the world','1948: Marshall Plan – $13bn to rebuild Western European economies; reduced appeal of communist parties in France and Italy','Stalin rejected Marshall Aid for all satellite states; called it "Dollar Imperialism"','Stalin\'s response: Cominform 1947 (control satellite leaders); Comecon 1949 (control satellite economies)','Marshall Plan was highly effective – Western Europe recovered rapidly; contrast with struggling Eastern bloc was clear']},

{paper:'p2a',unit:'Unit 1 – Origins 1941–58',heading:'Berlin Blockade 1948–49',
 hints:['Trizonia','Blockade','Airlift','NoAtom','Divided'],
 facts:['West combined zones into Trizonia 1947 and introduced Deutschmark 1948 – both infuriated Stalin who saw this as rebuilding Germany as an anti-Soviet power','June 1948: Stalin closed all road and rail links to West Berlin – attempted to force the West to abandon the city','Truman ordered Berlin Airlift: 4,000 tonnes of food and fuel flown in daily for 10 months; planes landed every 3 minutes at peak','Stalin could not shoot down planes without starting a full war – he had no atomic bomb yet','May 1949: Stalin lifted the blockade; Germany permanently divided into FRG (West) and GDR (East)']},

{paper:'p2a',unit:'Unit 1 – Origins 1941–58',heading:'NATO 1949',
 hints:['April','Capitalist','Article5','12members','Isolationism'],
 facts:['NATO formed April 1949 as a direct response to Soviet expansion and the Berlin Blockade','12 founding members including USA, UK, France and Canada; Article 5 – attack on one member is attack on all','First peacetime military alliance in US history – a major shift from traditional American isolationism','Formalised the division of Europe into two armed camps; the Cold War was now military as well as ideological','Warsaw Pact formed 1955 as communist military alliance in direct response – mirroring NATO']},

{paper:'p2a',unit:'Unit 1 – Origins 1941–58',heading:'Warsaw Pact and arms race',
 hints:['1955','Hbomb','ICBMs','MAD','Nuclear'],
 facts:['1949: USSR developed atomic bomb – arms race began immediately','1952: USA created Hydrogen Bomb – 1,000 times more powerful than atomic bomb; USSR developed H-bomb 1953','1957: both sides developed ICBMs (Intercontinental Ballistic Missiles) – nuclear weapons could be launched across continents','MAD (Mutually Assured Destruction): if war broke out both sides would be destroyed – neither could "win" a nuclear war','1955: Warsaw Pact formed as communist military alliance – Europe now split into two permanently armed blocs']},

{paper:'p2a',unit:'Unit 1 – Origins 1941–58',heading:'Hungarian Uprising 1956',
 hints:['Rákosi','Nagy','1000tanks','20000','West'],
 facts:['Hungary was a communist satellite state ruled by harsh Stalinist dictator Rákosi; food shortages, secret police and lack of freedom drove protests','1956: Khrushchev replaced Rákosi with the popular Imre Nagy who began reforms – releasing prisoners, relaxing censorship, freedom of speech','Nagy went too far by announcing Hungary would leave the Warsaw Pact – Khrushchev sent 1,000 tanks into Budapest; 3,000 killed and 20,000 fled to the West','3,000 killed; 20,000 fled to the West; Nagy arrested and later executed; Kadar installed as new hardline leader','West condemned the invasion but did nothing – showed NATO would not intervene inside the Soviet sphere']},

// ── PAPER 2A · Unit 2 Crises 1958–70 ────────
{paper:'p2a',unit:'Unit 2 – Crises 1958–70',heading:'2nd Berlin Crisis – causes',
 hints:['Drain','NATO','Ultimatum','Brain','1955'],
 facts:['Brain drain: between 1949–61 approximately 3 million East Germans fled to the West via West Berlin – many were skilled professionals (doctors, engineers, lawyers) whose loss weakened the GDR economy severely','1955: West Germany joined NATO – Khrushchev saw this as a direct threat; a rearmed West Germany inside the Western military alliance was alarming to Soviet security','Khrushchev issued the Berlin Ultimatum November 1958: gave the Western powers six months to leave West Berlin and make it a "free city"; if not, he would hand control of access routes to East Germany','The Ultimatum was rejected by the West – Berlin remained a flashpoint; Khrushchev extended the deadline several times but the crisis continued to escalate','The brain drain was the most urgent problem for Khrushchev: by 1961 East Germany was losing around 30,000 people a month – the socialist state was bleeding to death through its own open border']},

{paper:'p2a',unit:'Unit 2 – Crises 1958–70',heading:'2nd Berlin Crisis – summits and U2',
 hints:['Paris','Vienna','U2','Eisenhower','Lied'],
 facts:['Paris Summit May 1960: Khrushchev walked out after an American U2 spy plane (piloted by Gary Powers) was shot down over the USSR; Eisenhower initially denied the flight then admitted it when the USSR produced Powers and the wreckage','Eisenhower\'s lie destroyed the Paris Summit before it began; Khrushchev used it as propaganda proof that the USA could not be trusted; set back diplomacy significantly','Vienna Summit June 1961: Kennedy and Khrushchev met for the first time; Khrushchev pressed his Berlin Ultimatum; he judged Kennedy as weak and inexperienced – this misjudgement contributed to placing missiles in Cuba later','Kennedy stood firm on Berlin at Vienna but was shaken by Khrushchev\'s aggression; returned to Washington and requested a $3.25bn increase in defence spending','The failed summits showed diplomacy could not resolve the Berlin crisis; a more decisive action was needed – the Wall was Khrushchev\'s solution']},

{paper:'p2a',unit:'Unit 2 – Crises 1958–70',heading:'2nd Berlin Crisis – consequences',
 hints:['Wall','140','Berliner','Symbol','August'],
 facts:['13 August 1961: East German soldiers began building the Berlin Wall overnight; barbed wire first, then concrete; it eventually stretched 155km around West Berlin','The Wall ended the brain drain immediately – emigration stopped almost overnight; Khrushchev had solved his most urgent problem','Over 140 people were killed trying to cross the Wall between 1961 and 1989; Peter Fechter (1962) bled to death in the "death strip" as guards watched – a powerful propaganda image for the West','June 1963: President Kennedy visited West Berlin; his speech declared "Ich bin ein Berliner" – American commitment to West Berlin; 450,000 people gathered; the visit was a major propaganda victory for the West','The Wall became the defining symbol of the Cold War – physical proof that communism could only survive by imprisoning its own people; it stood until 9 November 1989']},

{paper:'p2a',unit:'Unit 2 – Crises 1958–70',heading:'Cuban Revolution and Bay of Pigs',
 hints:['Castro','Batista','Nationalised','1400','Humiliated'],
 facts:['1959: Fidel Castro overthrew pro-American dictator Fulgencio Batista in the Cuban Revolution; Castro nationalised all American-owned land and businesses – US companies lost approximately $1 billion in assets','USA imposed a trade embargo on Cuba; Castro turned to the USSR for support; Khrushchev agreed to buy Cuban sugar and provide economic and military assistance – Cuba became a communist state 90 miles from the USA','April 1961: Bay of Pigs invasion – CIA trained approximately 1,400 Cuban exiles (Brigade 2506) to invade Cuba and overthrow Castro; Kennedy cancelled planned US air support at the last minute','The invasion was a catastrophic failure: all 1,400 men were captured or killed within three days; Kennedy was publicly humiliated; the CIA\'s involvement was obvious despite denials','Bay of Pigs had two crucial consequences: it pushed Cuba and the USSR even closer together, and it convinced Khrushchev that Kennedy was weak – a misjudgement that led directly to the missile crisis']},

{paper:'p2a',unit:'Unit 2 – Crises 1958–70',heading:'Cuban Missile Crisis – 13 days',
 hints:['Spyplane','Blockade','13days','Dobrynin','DEFCON'],
 facts:['14 October 1962: US U2 spy plane photographed Soviet nuclear missile sites under construction in Cuba; CIA analysts estimated they would be operational within two weeks','Kennedy was briefed on 16 October; formed ExComm (Executive Committee) of senior advisers; debated options – air strike, invasion, blockade, or diplomacy; chose a naval "quarantine" (blockade)','22 October: Kennedy announced the blockade on live television; put US forces on DEFCON 3; Soviet ships were sailing toward the blockade line with nuclear materials on board','Soviet submarines accompanying the ships carried nuclear torpedoes; submarine B-59 nearly fired one when depth-charged by US destroyers – officer Vasili Arkhipov refused to authorise launch','Thirteen days of intense diplomacy through back-channels (including Soviet ambassador Dobrynin); Khrushchev and Kennedy exchanged letters; world came closer to nuclear war than at any other point']},

{paper:'p2a',unit:'Unit 2 – Crises 1958–70',heading:'Cuban Missile Crisis – consequences',
 hints:['Hotline','Test','Khrushchev','Turkey','Détente'],
 facts:['Resolution: Khrushchev agreed to remove Soviet missiles from Cuba; Kennedy publicly pledged not to invade Cuba and secretly agreed to remove US Jupiter missiles from Turkey within six months','Kennedy appeared to "win" – Khrushchev appeared to have backed down; this damaged Khrushchev\'s authority within the USSR and he was removed from power in October 1964','June 1963: Moscow-Washington Hotline established – a direct telephone link between the two leaders to prevent future accidental nuclear war; a direct consequence of the dangerous lack of communication during the crisis','August 1963: Partial Test Ban Treaty signed – banned nuclear weapons testing in the atmosphere, underwater and in space; first arms control agreement of the Cold War','The crisis planted seeds of détente: both superpowers had looked into the nuclear abyss; recognised that MAD required communication and restraint; relationship cautiously improved throughout the 1960s']},

{paper:'p2a',unit:'Unit 2 – Crises 1958–70',heading:'Prague Spring – Dubček and reforms',
 hints:['Dubček','Human','Tito','Censorship','Writers'],
 facts:['January 1968: Alexander Dubček became First Secretary of the Czechoslovak Communist Party; he had grown up in the USSR but was committed to genuine reform','Dubček announced "Socialism with a human face" – a programme of liberalisation: relaxed censorship, allowed criticism of the government, permitted foreign travel, released political prisoners','Czech writers, intellectuals and students enthusiastically supported the reforms; newspapers published openly critical articles; a genuine political spring emerged in Prague','Dubček invited Marshal Tito of Yugoslavia (who had broken from Moscow in 1948 and ran an independent communist state) to Prague – Brezhnev saw this as a dangerous signal that Czechoslovakia might seek independence','By summer 1968: Brezhnev was receiving alarming reports from other satellite state leaders who feared the Czech example would inspire similar demands in their own countries; he decided to act']},

{paper:'p2a',unit:'Unit 2 – Crises 1958–70',heading:'Prague Spring – invasion and Brezhnev Doctrine',
 hints:['500000','70killed','Brezhnev','Albania','Husák'],
 facts:['Night of 20–21 August 1968: 500,000 Warsaw Pact troops (from USSR, Poland, Hungary, Bulgaria and East Germany) invaded Czechoslovakia; Dubček was arrested and taken to Moscow','70 civilians were killed in the invasion; Czechoslovak people responded with passive resistance – moving road signs, arguing with soldiers – but had no military means to resist','Dubček was forced to sign the Moscow Protocol agreeing to end all reforms; he was replaced by the hardline Gustáv Husák; the "normalisation" of Czechoslovakia began','Brezhnev Doctrine announced: if any communist country threatened the socialist bloc as a whole, other communist nations had a duty to intervene; this formalised Soviet right to invade any satellite state','Albania left the Warsaw Pact in protest and aligned with China; the West condemned the invasion but took no military action – showed once again that the Soviet sphere of influence was inviolable']},

// ── PAPER 2A · Unit 3 End of Cold War ───────
{paper:'p2a',unit:'Unit 3 – End of Cold War 1970–91',heading:'Détente and SALT 1970s',
 hints:['40%','SALT1','Helsinki','Apollo','Vietnam'],
 facts:['By 1970s both sides had reasons to ease tensions: 40% of Soviet economy spent on nuclear weapons; USA spending $150bn/year on Vietnam War','1972: SALT 1 signed by Nixon and Brezhnev – first nuclear arms limitation treaty; restricted ICBMs and SLBMs','1975: Helsinki Accords signed by 35 nations – agreed European borders, scientific cooperation and human rights','1975: Apollo-Soyuz mission – US and Soviet spacecraft docked in orbit; symbolised end of space race','SALT 2 negotiations began but USSR invaded Afghanistan 1979; Carter cancelled treaty – détente over']},

{paper:'p2a',unit:'Unit 3 – End of Cold War 1970–91',heading:'Soviet invasion of Afghanistan 1979',
 hints:['Mujahideen','Christmas','$8bn','Carter','Doctrine'],
 facts:['1978: Afghanistan became communist and tried to remove Islam from society – sparked Muslim resistance (the Mujahideen)','Mujahideen began overpowering the communist Afghan government; Brezhnev feared this would inspire rebellion in the USSR\'s own Muslim regions','Christmas Eve 1979: USSR invaded Afghanistan to prop up the communist government','10-year war costing $8 billion per year; estimated 15,000 Soviet soldiers killed; deeply unpopular at home','Carter scrapped SALT 2; issued Carter Doctrine; sent arms to Mujahideen – détente officially ended; Second Cold War began']},

{paper:'p2a',unit:'Unit 3 – End of Cold War 1970–91',heading:'Second Cold War and Reagan 1980–85',
 hints:['Evil','Trillion','Olympics','SDI','Doctrine'],
 facts:['1980: Reagan elected US President; called USSR an "Evil Empire"; committed to "winning" the Cold War rather than managing it','Reagan increased military spending by $1 trillion; Reagan Doctrine – funding anti-communist groups worldwide','USA boycotted Moscow Olympics 1980 (60 countries joined); USSR boycotted LA Olympics 1984 in retaliation','1983: SDI ("Star Wars") announced – orbital lasers to shoot down Soviet missiles; technology not ready but terrified USSR','SDI forced Soviet planners to consider whether they could afford to continue the arms race']},

{paper:'p2a',unit:'Unit 3 – End of Cold War 1970–91',heading:'Gorbachev\'s New Thinking 1985–88',
 hints:['Perestroika','Glasnost','Sinatra','INF','Malta'],
 facts:['1985: Gorbachev became Soviet leader; inherited poor economy, costly Afghanistan war, arms race the USSR could not win','Perestroika (reconstruction): allowed some capitalist investment in the Soviet economy','Glasnost (openness): freedom of speech; political prisoners released','1988: Sinatra Doctrine replaced Brezhnev Doctrine – satellite states could "go their own way" without Soviet invasion; crucial change','1987: INF Treaty – USA and USSR agreed to destroy all intermediate-range missiles; 1989: Malta Summit declared Cold War at an end']},

{paper:'p2a',unit:'Unit 3 – End of Cold War 1970–91',heading:'Events of 1989',
 hints:['Poland','Solidarity','Wall','November','Dominos'],
 facts:['June 1989: Poland first to abandon communism – Solidarity won elections; when Gorbachev did not send tanks, other satellite states followed rapidly','Hungary, Czechoslovakia, Bulgaria, Romania all abandoned communism by end of 1989; Romania involved violent revolution','9 November 1989: Berlin Wall fell – crowds gathered; East German guards stood down; people tore the Wall down','By December 1989 every satellite state had abandoned communism – process took less than six months once Poland led','Germany reunited October 1990; Warsaw Pact dissolved July 1991']},

{paper:'p2a',unit:'Unit 3 – End of Cold War 1970–91',heading:'Collapse of the USSR 1991',
 hints:['Latvia','Coup','Yeltsin','Christmas','Dissolved'],
 facts:['Gorbachev\'s reforms had unleashed forces he could not control: republics including Latvia, Lithuania and Estonia demanded independence','August 1991: Gang of Eight hardline communists arrested Gorbachev in an attempted coup to restore old-style communist rule','Boris Yeltsin led resistance from the Russian parliament building; army refused to fire on civilians; coup collapsed after three days','After the coup\'s failure Gorbachev had no authority left; holding the USSR together by force risked civil war','Christmas Day 1991: Gorbachev resigned and dissolved the USSR; 15 independent republics emerged; Cold War officially ended']},

// ── PAPER 2B · Unit 1 Queen & Religion ──────
{paper:'p2b',unit:'Unit 1 – Queen & Religion',heading:'Elizabeth\'s problems on accession 1558',
 hints:['Debt','Patriarchal','Illegitimate','Calais','Marriage'],
 facts:['Crown was £227,000 in debt – took 20 years to clear; unable to fight wars or fund government effectively','England was deeply patriarchal – many believed women could not rule, control men or lead armies; sister Mary I had reinforced this fear','Catholics believed Elizabeth was illegitimate (Pope had not sanctioned Henry VIII\'s divorce) and Mary Queen of Scots was the true queen','At war with France; Calais lost 1558 – national humiliation; peace made 1559 but debt and humiliation remained','Marriage dilemma: foreign prince risked xenophobic reaction; English husband would create noble rivalries']},

{paper:'p2b',unit:'Unit 1 – Queen & Religion',heading:'Religious Settlement 1558–59',
 hints:['Supremacy','Uniformity','Shilling','Vestments','Crucifix'],
 facts:['Act of Supremacy: Elizabeth became "Supreme Governor" of the Church – removed all papal authority from England','Act of Uniformity: identical Protestant services required in all churches; Catholic images and vestments allowed – the "Via Media"','Recusants fined 1 shilling for not attending – far lighter than burning (Mary I\'s approach)','Vestment Controversy: Puritans tried to ban vestments; Archbishop insisted they must be worn – Puritans lost','Crucifix Controversy: Puritans succeeded in getting crucifixes removed from all churches – a small but real Puritan victory']},

{paper:'p2b',unit:'Unit 1 – Queen & Religion',heading:'Puritan challenge to the Settlement',
 hints:['Extreme','Dudley','MPs','Vestments','Limits'],
 facts:['Puritans were extreme Protestants who wanted to remove all Catholic elements from the Church of England','Influential supporters: two Privy Councillors (Dudley and Walsingham) were Puritan sympathisers; Puritan MPs pushed for change in Parliament','Vestment Controversy showed limits of Puritan power: Archbishop held firm; could not override Church authority','Crucifix Controversy showed they could win small concessions – but could not fundamentally alter the Settlement','Unlike Catholics, Puritans had no alternative monarch to replace Elizabeth with – challenge was to the Settlement\'s details, not her rule']},

{paper:'p2b',unit:'Unit 1 – Queen & Religion',heading:'Catholic threat and excommunication',
 hints:['Recusancy','Excommunication','Treason','Distracted','Compliance'],
 facts:['One third of nobles were Catholic but most paid the 1 shilling recusancy fine rather than rebel – too risky','1570: Pope Pius V excommunicated Elizabeth – all Catholics encouraged to remove her from power; parliament made owning the decree treason','Spain and France were powerful Catholic nations but distracted: France in religious civil war from 1560s; Spain occupied with Dutch Revolt','Most English Catholics complied publicly while practising privately – potential threat far greater than actual danger','The excommunication gave foreign powers a religious justification for invasion they had not previously had']},

{paper:'p2b',unit:'Unit 1 – Queen & Religion',heading:'Mary, Queen of Scots 1558–69',
 hints:['Illegitimate','Guise','Edinburgh','Murder','Imprisoned'],
 facts:['Catholics believed Elizabeth was illegitimate and Mary was the true queen of England; even Protestants knew Mary was heir if Elizabeth had no children','Mary\'s mother from powerful Guise family; grew up in France as wife of the French king; Scotland had Auld Alliance with France','Treaty of Edinburgh 1560: Scottish lords renounced Mary\'s claim to English throne; Mary refused to ratify – kept threat alive','1567: accused of murdering husband Lord Darnley; forced to abdicate; fled to England 1568 seeking help','Elizabeth imprisoned Mary in northern England rather than helping her or handing her back – making her a focal point for 18 years of Catholic conspiracy']},

// ── PAPER 2B · Unit 2 Challenges 1569–88 ────
{paper:'p2b',unit:'Unit 2 – Challenges 1569–88',heading:'Revolt of the Northern Earls 1569',
 hints:['Northumberland','Durham','Nobles','Spanish','14000'],
 facts:['Earls of Northumberland and Westmoreland rebelled – wanted to restore Catholicism; resented losing influence to Elizabeth\'s Council of the North','Planned to free Mary Queen of Scots, marry her to Duke of Norfolk and place her on the throne','Raised armies; marched on Durham Cathedral; celebrated Catholic Mass; called for other Catholic nobles to join','No other nobles joined; expected Spanish troops never arrived; Elizabeth raised 14,000 soldiers and the Earls fled','~450 rebels hanged; Mary moved to Coventry, further from the Catholic north; Revolt actually strengthened Elizabeth\'s position']},

{paper:'p2b',unit:'Unit 2 – Challenges 1569–88',heading:'Plots – Ridolfi, Throckmorton, Babington',
 hints:['Ridolfi','Throckmorton','Babington','Walsingham','Executed'],
 facts:['All three plots aimed to kill Elizabeth and place Mary Queen of Scots on the throne; all uncovered by Walsingham\'s spy network','Ridolfi 1571: needed Spanish troops that never came; Duke of Norfolk executed; Elizabeth refused to execute Mary','Throckmorton 1583: involved French invasion; failed; Bond of Association 1584 – Privy Council pledged to kill anyone who conspired to benefit from Elizabeth\'s death','Babington 1586: Walsingham allowed it to run until he had Mary\'s written approval of plans to assassinate Elizabeth','Mary executed February 1587; Elizabeth signed death warrant but claimed to be horrified when carried out']},

{paper:'p2b',unit:'Unit 2 – Challenges 1569–88',heading:'Anglo-Spanish relations and Drake',
 hints:['Philip','Drake','Knighted','Dutch','Joinville'],
 facts:['Strong Anglo-Spanish relations at start: Philip II (previously married to Mary I) proposed to Elizabeth 1559 – she refused','Drake attacked Spanish ships throughout 1570s–80s secretly backed by Elizabeth; stole £400,000 during circumnavigation 1577–80','Elizabeth knighted Drake on deck of Golden Hind 1580 – Philip saw this as open endorsement of piracy','Elizabeth secretly funded and armed Dutch Protestant rebels against Spanish rule throughout the 1560s–80s','1584: Treaty of Joinville – Philip allied with French Catholics to destroy Protestantism; Elizabeth was a direct target']},

{paper:'p2b',unit:'Unit 2 – Challenges 1569–88',heading:'Spanish Armada 1588',
 hints:['Nonsuch','Fireships','Gravelines','Storms','Tilbury'],
 facts:['1585: Treaty of Nonsuch – Elizabeth pledged 7,400 troops to Dutch rebels; England and Spain officially at war; Drake raided Cadiz 1587','1588: Medina-Sidonia sent with 130 ships and 27,000 men to collect Parma\'s 30,000 troops from Netherlands then invade England','Drake sent fireships into the Armada at Calais – Spanish captains panicked and scattered, breaking the defensive formation','English navy defeated the disordered fleet at Battle of Gravelines; storms off Ireland and Scotland then destroyed over half the 130 ships','Parma\'s army was trapped by Dutch flyboats – plan was unworkable from the start; Elizabeth\'s Tilbury speech used as Protestant propaganda victory']},

// ── PAPER 2B · Unit 3 Elizabethan Society ───
{paper:'p2b',unit:'Unit 3 – Elizabethan Society',heading:'Education and entertainment',
 hints:['Grammar','Literacy','Theatre','Bear','Penny'],
 facts:['72 new grammar schools in Elizabeth\'s reign; fees based on income; male literacy rose from 20% to 30%','Girls did not attend school; female literacy remained at 10% throughout the reign','Nobility enjoyed hunting, hawking, real tennis; working class enjoyed bear-baiting, cock-fighting, gambling','Theatre open to all: 1 penny for standing in the pit; permanent theatres (The Theatre, The Rose) built in London from 1570s','Education was not open to all – designed to fit the station you were born into']},

{paper:'p2b',unit:'Unit 3 – Elizabethan Society',heading:'Poverty and poor relief',
 hints:['Population','Enclosure','Vagabonds','Correction','Deserving'],
 facts:['Population rose from 3 million to 4 million – food prices rose; wages fell; more competition for fewer jobs','Enclosure: wealthy landowners took common land from the poor to farm sheep for the wool trade; many became landless','1572 Vagabonds Act: vagabonds over 14 whipped and burned through the right ear; further offences meant execution','1576: Houses of Correction built to teach the poor skills; wealthy parishioners required to fund poor relief','Society divided poor into "deserving" (old, disabled) and "undeserving" (able-bodied unemployed) – blamed the poor for poverty']},

{paper:'p2b',unit:'Unit 3 – Elizabethan Society',heading:'Voyages of exploration',
 hints:['Mercator','Hawkins','Drake','Circumnavigation','Patronage'],
 facts:['New technology made long voyages possible: Mercator map 1569 (accurate world geography); astrolabes (navigation by stars); improved galleons','1562: Hawkins created Triangular Slave Trade bringing great wealth; Elizabeth personally invested in his expeditions','1577–80: Drake circumnavigated the globe (second person to do so); raided £400,000 of Spanish treasure; knighted by Elizabeth 1580','Voyages driven by desire for fame, profit and royal patronage – Elizabeth\'s support gave exploration social prestige','Exploration increased England\'s commercial and geographic knowledge; laid foundations for later Empire']},

{paper:'p2b',unit:'Unit 3 – Elizabethan Society',heading:'Virginia colony 1585 and 1587',
 hints:['Raleigh','Tiger','Wingina','Roanoke','Croatoan'],
 facts:['Sir Walter Raleigh organised and financed two attempts at a colony in Virginia in the 1580s','1585: 108 settlers on Roanoke Island; supply ship The Tiger ran aground – seawater destroyed most food stores immediately','Too many soldiers and merchants; not enough farmers; colonists depended on Algonquian people for food from the start','Relations broke down as disease (invisible bullets) spread from English to natives; Ralph Lane led pre-emptive attack and killed chief Wingina – ended any chance of cooperation', 'supply ships cannot leave England as all ships are needed to defend against Spanish Armada','1590: returned to find colony vanished; only "Croatoan" carved in a tree; colonists never seen again']},

{paper:'p2b',unit:'Unit 3 – Elizabethan Society',heading:'Causes of poverty in Elizabethan England',
 hints:['Population','Enclosure','Harvest','Debasement','Malthusian'],
 facts:['Population growth: England\'s population grew from approximately 3 million to 4 million during Elizabeth\'s reign – increased demand for food drove up prices while more people competed for the same number of jobs, driving down wages; a classic Malthusian crisis','Enclosure: wealthy landowners enclosed common land to farm sheep for the highly profitable wool trade; poor families lost access to land they had used to grow food and graze animals for generations – many became landless','Harvest failures: the "little ice age" brought lower temperatures and more frequent harvest failures throughout the second half of the 16th century; bad harvests in the 1590s caused near-famine conditions in some areas','Debasement of the currency: Henry VIII and Edward VI had reduced the silver content of coins to fund wars; this caused inflation that continued throughout Elizabeth\'s reign – prices rose faster than wages could keep pace'],},

{paper:'p2b',unit:'Unit 3 – Elizabethan Society',heading:'Attitudes and legislation towards the poor',
 hints:['Deserving','Vagabonds','Correction','Attitudes','Statute'],
 facts:['Elizabethan society divided the poor into the "deserving poor" (the elderly, sick or disabled who genuinely could not work) and the "undeserving poor" (able-bodied people without work, assumed to be lazy or criminal)','1563 Statute of Artificers: set wages and regulated employment; first attempt at an organised approach to work and poverty rather than simply punishing vagabonds','1572 Vagabonds Act: vagabonds over 14 to be whipped and burned through the right ear for the first offence; further offences could mean execution; reflected the punitive Attitudes of the period','1576 Act for the Relief of the Poor: established Houses of Correction to teach the poor skills; local officials required to find work for the unemployed; wealthy required to contribute to a poor relief fund – a more constructive approach','1601 Poor Law: consolidated all previous legislation into one comprehensive system; distinguished deserving from undeserving poor in law; established parish as the unit of poor relief – the foundation of English poor relief for the next two centuries'],},

// ── PAPER 3 · Unit 1 Weimar Republic ────────
{paper:'p3',unit:'Unit 1 – Weimar Republic',heading:'Treaty of Versailles 1919',
 hints:['Reparations','Land','Army','Guilt','Dolchstoss'],
 facts:['June 1919: Weimar government had no say in negotiations – forced to accept terms dictated by Britain, France and USA','£6.6 billion reparations; lost 13% of land (Alsace-Lorraine to France; Polish Corridor created); overseas colonies lost','Army limited to 100,000 men; no submarines or air force; Rhineland demilitarised','Article 231 – war guilt clause: Germany forced to accept 100% responsibility; used to justify reparations','Combined with the Dolchstoss myth, the Treaty made the Weimar Republic deeply unpopular from its very first days']},

{paper:'p3',unit:'Unit 1 – Weimar Republic',heading:'Origins of the Weimar Republic 1918–19',
 hints:['Kaiser','Armistice','Dolchstoss','Coalitions','Article48'],
 facts:['WWI: 2 million Germans died; 4 million injured; government debts tripled; 750,000 civilians starved','9 November 1918: Kaiser abdicated; Ebert declared republic; armistice signed 2 days later on 11 November','Weimar politicians blamed for "Dolchstoss" (stab-in-the-back) – called "November Criminals"; myth false but extremely damaging','Proportional representation created unstable coalitions – 9 different coalition governments in the first 4 years','Article 48: President could pass laws without Reichstag in emergencies – later exploited by Hitler']},

{paper:'p3',unit:'Unit 1 – Weimar Republic',heading:'Spartacists and Kapp Putsch 1919–20',
 hints:['Luxemburg','Freikorps','Kapp','Strike','376'],
 facts:['January 1919: Spartacist revolt – Rosa Luxemburg led 100,000 communist workers in armed uprising in Berlin','Ebert used right-wing Freikorps (ex-soldiers) to crush the revolt; Luxemburg killed; showed Weimar would use far-right against far-left','1920: Kapp Putsch – Freikorps seized Berlin; Ebert fled; regular army refused to fire on Freikorps ("Reichswehr does not fire on Reichswehr")','Workers of Berlin went on general strike; Kapp could not govern; gave up after 3 days','376 politicians assassinated in these early years – government threatened from both left and right simultaneously']},

{paper:'p3',unit:'Unit 1 – Weimar Republic',heading:'Hyperinflation 1923',
 hints:['Ruhr','Printed','Bread','Savings','Munich'],
 facts:['Germany defaulted on reparations; January 1923: French and Belgian troops invaded the Ruhr to extract coal directly','Weimar government asked Ruhr workers to go on strike; printed money to pay them – currency collapsed','Bread rose from 1 mark (1919) to 200 billion marks (November 1923)','Middle classes lost savings permanently; working class could not keep up with prices','Munich Putsch November 1923 directly exploited this crisis – economic chaos fuelled political extremism']},

{paper:'p3',unit:'Unit 1 – Weimar Republic',heading:'Stresemann and Weimar recovery 1923–29',
 hints:['Rentenmark','Dawes','Locarno','League','Young'],
 facts:['November 1923: Stresemann introduced the Rentenmark – tied to land value, not printed money; halted hyperinflation','1924: Dawes Plan – reparations cut to £50m/year; secured $200m US loans to stabilise economy','1925: Locarno Pact – Germany accepted Versailles borders; France left the Ruhr; Germany accepted back into Europe diplomatically','1926: Germany joined the League of Nations','1929: Young Plan – reparations cut to £2bn extended to 1988; extremist support fell from 40% (1924) to 28% (1928)']},

{paper:'p3',unit:'Unit 1 – Weimar Republic',heading:'Weimar culture and women in the Golden Years',
 hints:['Wages','Women','Bauhaus','Metropolis','Fragile'],
 facts:['Wages rose 25%; unemployment fell; 100,000 new houses built; war veterans received pensions','Women gained equal voting rights to men; worked in traditionally male jobs; wore modern fashions; more independent social lives','Bauhaus school developed modern affordable design; Otto Dix\'s art depicted post-war reality; Fritz Lang\'s Metropolis (1927) a landmark film','Berlin became one of the most culturally exciting cities in Europe','However: 2 million remained unemployed; middle-class savings never returned; prosperity entirely dependent on US loans – all destroyed by 1929 crash']},

// ── PAPER 3 · Unit 2 Hitler\'s Rise ──────────
{paper:'p3',unit:'Unit 2 – Hitler\'s Rise',heading:'Early Nazi Party 1919–22',
 hints:['DAP','25Point','3000','SA','Rebranded'],
 facts:['Hitler joined the tiny German Workers\' Party (DAP) in Munich – only 23 members; he had been sent as an army spy but was converted by their ideas','1920: co-wrote 25 Point Programme – nationalist, anti-democratic and anti-Semitic views; party renamed NSDAP','Charismatic speeches grew membership from 23 (1919) to 3,000 (1920) to 20,000 (1923)','1921: Hitler took over the party leadership; SA (Stormtroopers) set up under Röhm – 800 members by 1922','Introduced swastika logo and party newspaper (Völkischer Beobachter)']},

{paper:'p3',unit:'Unit 2 – Hitler\'s Rise',heading:'Munich Putsch 1923',
 hints:['Ludendorff','Mussolini','BeerHall','16dead','MeinKampf'],
 facts:['By 1923: 20,000 Nazi members; General Ludendorff\'s support; hyperinflation made Weimar deeply unpopular','Inspired by Mussolini\'s successful March on Rome (1922) – hoped to seize Munich then march on Berlin','8 November: Hitler burst into Beer Hall where politician Von Kahr was speaking; Von Kahr secretly informed Ebert rather than joining','9 November: police were waiting; 16 Nazis killed; Hitler fled; arrested 11 November; Putsch completely failed','At trial gave nationally-reported speech; served only 9 months of 5-year sentence; wrote Mein Kampf; switched to electoral strategy']},

{paper:'p3',unit:'Unit 2 – Hitler\'s Rise',heading:'Lean years 1923–29',
 hints:['Banned','Electoral','Bamberg','Goebbels','12seats'],
 facts:['After Munich Putsch: Nazi Party banned; Hitler served 9 months; on release rebuilt party with new electoral strategy','New branches (Gaue) across Germany; Goebbels joined and developed propaganda; SS set up as personal elite bodyguard','Bamberg Conference 1926: Hitler cemented far-right direction; silenced left-wing Nazi leaders','However: in 1928 Nazis won only 12 Reichstag seats – Stresemann\'s economic recovery meant few wanted radical solutions','Hindenburg\'s election as President (1925) gave many conservatives confidence in the Republic – further marginalised Nazis']},

{paper:'p3',unit:'Unit 2 – Hitler\'s Rise',heading:'Wall Street Crash and Nazi growth 1929–32',
 hints:['£14bn','6million','Brüning','Businessmen','230'],
 facts:['October 1929: Wall Street Crash – American banks lost £14bn in a day; recalled loans from Germany; businesses went bankrupt','Unemployment reached 6 million by 1933; Chancellor Brüning nicknamed "hunger chancellor"; Weimar appeared helpless','Wealthy businesspeople, fearing Communist revolution, bankrolled the Nazis – funded propaganda, rallies and SA expansion','Nazis targeted different groups: "Arbeit und Brot" for workers; price guarantees for farmers; national restoration for middle class','July 1932: Nazis won 230 seats – largest party; grown from 12 seats in just 4 years']},

{paper:'p3',unit:'Unit 2 – Hitler\'s Rise',heading:'Hitler becomes Chancellor January 1933',
 hints:['Corporal','13million','Papen','Controlled','30January'],
 facts:['Even with 230 seats Hindenburg despised Hitler as a "jumped-up little corporal" and refused to make him Chancellor','April 1932: Hindenburg re-elected President; Hitler came second with 13 million votes but still denied the chancellorship','Von Papen (May 1932) then Von Schleicher (November 1932) both failed as Chancellors; Hindenburg ran out of alternatives','Von Papen convinced Hindenburg he could "control" Hitler as Chancellor with himself as Vice-Chancellor – a fatal miscalculation','30 January 1933: Hitler appointed Chancellor; Von Papen told a friend "Mouse in my pocket"']},

// ── PAPER 3 · Unit 3 Nazi Control ───────────
{paper:'p3',unit:'Unit 3 – Nazi Control',heading:'Reichstag Fire and Enabling Act 1933',
 hints:['Fire','4000','81seats','Enabling','Banned'],
 facts:['27 February 1933: Reichstag burned; Dutch Communist van der Lubbe blamed; Article 48 emergency declared; 4,000 Communists arrested that night','Communists banned from their 81 seats – gave Nazis the crucial 2/3 majority needed to change the Constitution legally','March 1933: Enabling Act passed – gave Hitler power to make any law without the Reichstag; democracy legally abolished','Hitler immediately banned all other parties (July 1933), trade unions and local government','Germany became a one-party state within months of Hitler taking the chancellorship']},

{paper:'p3',unit:'Unit 3 – Nazi Control',heading:'Night of the Long Knives 1934',
 hints:['Röhm','3 million','30June','400'],
 facts:['Ernst Röhm led the SA – 3 million members; publicly called for SA to replace the regular army; threatened Hitler\'s relationship with the military','Hitler feared that Röhm was the only person in Nazi party influential enough to rival him.','Röhm was often critical of Hitler, called him Little Adie, and wanted a more left-wing revolution.','Hitler\'s conservative allies (army, businesspeople) feared the SA; army made clear their loyalty depended on SA being removed','30 June 1934: SS murdered Röhm and approximately 400 others including rival politicians and former allies.','Hitler personally arrests Röhm who is taken to a cell and shot.','Hitler has removed internal rivals within the Nazi party - no one else will dare challenge him now!']},

{paper:'p3',unit:'Unit 3 – Nazi Control',heading:'Hindenburg\'s death and the oath of allegiance',
 hints:['Führer','Oath','August','Personal','Constitution'],
 facts:['2 August 1934: President Paul von Hindenburg died of lung cancer aged 86; Hitler immediately combined the offices of Chancellor and President into the new title of "Führer und Reichskanzler" (Leader and Reich Chancellor)','Hitler held a rigged referendum and ensured it was approved with 90% in favour','The Reichswehr (German army) immediately swore a new personal oath of loyalty – not to Germany as before, but to Adolf Hitler personally.','Now Hitler was complete dictator of Germany.'],},

{paper:'p3',unit:'Unit 3 – Nazi Control',heading:'Police state – Gestapo and SS',
 hints:['Gestapo','SS300000','Dachau','Judges','SD'],
 facts:['Gestapo (secret police): plainclothes; people so afraid they informed on neighbours, parents and friends – self-policing made resistance nearly impossible','SS: led by Himmler and Heydrich; 300,000 members; above the law; ran Dachau concentration camp (opened 1933)','All lawyers and judges had to be loyal Nazis; no juries; prisoners sent to camps without fair trial','SD (Security Service): tapped phones, read letters, monitored behaviour – comprehensive surveillance of German society','Combination of real terror and feared surveillance created a society in which most chose compliance']},

{paper:'p3',unit:'Unit 3 – Nazi Control',heading:'Control of the Churches',
 hints:['Concordat','Reich','Niemöller','800','Confessing'],
 facts:['1933: Concordat signed with Pope Pius XI – Pope agreed not to criticise Nazis in exchange for Catholic schools being left alone; neutered potential Catholic opposition','Reich Church established to bring all Protestant churches under Nazi control; swastika displayed alongside the cross','Some clergy refused: Pastor Niemöller set up the Confessing Church 1934 to oppose the Reich Church','6,000 priests joined the Confessing Church; approximately 800 sent to concentration camps for speaking out','Shows Nazis could not fully control religion – but could suppress open opposition through imprisonment']},

{paper:'p3',unit:'Unit 3 – Nazi Control',heading:'Propaganda and censorship',
 hints:['Goebbels','45mins','Burning','Nuremberg','Olympics'],
 facts:['Goebbels ran the Reich Ministry of Public Enlightenment and Propaganda – controlled all public information','All films preceded by 45 minutes of Nazi propaganda; Nazi leaders broadcast on radio; loudspeakers set up on street corners','Censorship: critical newspapers closed; radios designed to block foreign broadcasts; books by Jewish and Communist authors publicly burned','Nuremberg rallies: 200,000 people, 20,000 flags – carefully orchestrated to project image of total Nazi power and unity','Berlin Olympics 1936 used as global propaganda showcase; Leni Riefenstahl\'s film Triumph of the Will glorified Nazi power']},

{paper:'p3',unit:'Unit 3 – Nazi Control',heading:'Opposition and resistance',
 hints:['Swing','Pirates','Niemöller','Democrats','Assassination'],
 facts:['Most people either genuinely supported the regime or passively accepted it – propaganda, economic improvement and terror all worked together','Swing Youth: teenagers from wealthy families who listened to banned American jazz; Edelweiss Pirates attacked Hitler Youth members','Confessing Church (Niemöller): 6,000 priests; ~800 sent to concentration camps – religious resistance existed but was suppressed','Social Democrats continued underground anti-Nazi newspapers; trade unionists carried out small acts of sabotage','Some army officers attempted to assassinate Hitler (1944 most notable) – all failed; showed even within the regime there were opponents']},

// ── PAPER 3 · Unit 4 Life in Nazi Germany ───
{paper:'p3',unit:'Unit 4 – Life in Nazi Germany',heading:'Women in Nazi Germany',
 hints:['3Ks','Loan','Cross','Banned','Reversed'],
 facts:['Nazis believed in the "3 Ks": Kinder (Children), Kirche (Church), Küche (Kitchen) – hated the "new women" of 1920s Weimar','1933: Marriage loan of 1,000 marks if wife gave up work; a quarter cancelled per child – powerful economic incentive','Mother\'s Cross medal: bronze for 4 children, silver for 6, gold for 8 – motherhood elevated as patriotic service','Women banned from teaching, medicine, law and civil service; girls banned from grammar schools from 1937','By late 1930s: rearmament forced the Nazis to bring women back into factories – ideology reversed by economic necessity']},

{paper:'p3',unit:'Unit 4 – Life in Nazi Germany',heading:'Young people and Hitler Youth',
 hints:['Oath','Guns','Maidens','Compulsory','Schools'],

 q:'Write a narrative account analysing the key events of détente in the 1970s. (8 marks)\nHints: SALT 1 / Helsinki Accords',
 content:[
  {h:'Beginning',pts:['By 1970s both sides had reasons to ease tensions: 40% of Soviet economy on nuclear weapons; USA had costly Vietnam War; risk of MAD']},
  {h:'Middle',pts:['1972: SALT 1 signed by Nixon and Brezhnev – first nuclear arms limitation treaty; restricted ICBMs and SLBMs','1975: Helsinki Accords signed by 35 nations; Apollo-Soyuz mission – US and Soviet spacecraft docked in orbit; symbolised end of space race']},
  {h:'End',pts:['1979: SALT 2 negotiations but USSR invaded Afghanistan on Christmas Eve – Carter cancelled treaty; détente over','Reagan elected 1980; called USSR "Evil Empire"; Second Cold War began']}
 ]},

{paper:'p2a',type:'8mark-narrative',skill:'Narrative account',
 q:'Write a narrative account analysing the key events of the Second Cold War 1979–85. (8 marks)\nHints: Afghanistan / Reagan',
 content:[
  {h:'Beginning',pts:['Christmas Eve 1979: USSR invaded Afghanistan; Carter scrapped SALT 2; issued Carter Doctrine; sent arms to the Mujahideen – détente over']},
  {h:'Middle',pts:['1980: Reagan elected; $1 trillion military spending increase; Reagan Doctrine – funding anti-communist groups worldwide','1980: USA boycotted Moscow Olympics (60 countries joined); USSR boycotted LA Olympics 1984']},
  {h:'End',pts:['1983: SDI/"Star Wars" announced – terrified the USSR and forced them to seek negotiations','By 1985 the USSR desperately needed to reduce military spending; created the conditions for Gorbachev\'s election and New Thinking']}
 ]},

{paper:'p2a',type:'8mark-narrative',skill:'Narrative account',
 q:'Write a narrative account analysing the end of communist rule in Eastern Europe 1985–91. (8 marks)\nHints: Sinatra Doctrine / fall of the Berlin Wall',
 content:[
  {h:'Beginning',pts:['1985: Gorbachev became Soviet leader; introduced Perestroika and Glasnost; "we can\'t go on living like this"','1988: Sinatra Doctrine – satellite states could "go their own way"; Brezhnev Doctrine withdrawn']},
  {h:'Middle',pts:['June 1989: Poland first to abandon communism; Gorbachev did not send tanks; all other satellite states followed rapidly','9 November 1989: Berlin Wall fell; by end of 1989 every satellite state had abandoned communism']},
  {h:'End',pts:['Germany reunited 1990; Warsaw Pact dissolved 1991','August 1991: Gang of Eight coup failed after 3 days; Gorbachev resigned Christmas Day 1991; USSR dissolved; Cold War officially ended']}
 ]},

{paper:'p2a',type:'8mark-importance',skill:'Importance',
 q:'Explain the importance of the Truman Doctrine (1947) for the development of the Cold War. (8 marks)',
 content:[
  {h:'Para 1',pts:['$400m to anti-communist fighters in Greece and Turkey – committed USA to containing communism anywhere in the world','Transformed ideological disagreement into formal global rivalry; containment became official US strategy for the next four decades']},
  {h:'Para 2',pts:['Stalin established Cominform (1947) and Comecon (1949) as direct mirror responses to the Truman Doctrine and Marshall Plan','Accelerated the division of the world into two competing blocs; made diplomatic cooperation far less likely']}
 ]},

{paper:'p2a',type:'8mark-importance',skill:'Importance',
 q:'Explain the importance of the Berlin Blockade (1948–49) for the development of the Cold War. (8 marks)',
 content:[
  {h:'Para 1',pts:['Showed USA and USSR could not cooperate over Germany; led directly to permanent division into FRG and GDR in 1949','Berlin remained the divided heart of Cold War tension until 1989 – the blockade made that division permanent']},
  {h:'Para 2',pts:['Convinced Western powers they needed permanent military alliance; NATO formed April 1949 as a direct response','Formalised the division of Europe into two armed camps; the Cold War became military as well as ideological; Warsaw Pact followed 1955']}
 ]},

{paper:'p2a',type:'8mark-importance',skill:'Importance',
 q:'Explain the importance of the arms race for relations between the USA and USSR. (8 marks)',
 content:[
  {h:'Para 1',pts:['1949: USSR atomic bomb; 1952: US H-bomb (1,000× more powerful); 1953: USSR H-bomb; 1957: both had ICBMs','MAD meant neither side could win a nuclear war – paradoxically prevented direct conflict between superpowers throughout the Cold War']},
  {h:'Para 2',pts:['Arms race hugely expensive: 40% of Soviet economy on nuclear weapons by 1970s','Economic strain drove détente (1972), Gorbachev\'s election (1985) and Soviet collapse (1991) – the arms race ultimately helped end the Cold War']}
 ]},

{paper:'p2a',type:'8mark-importance',skill:'Importance',
 q:'Explain the importance of the Hungarian Uprising (1956) for Soviet control of Eastern Europe. (8 marks)',
 content:[
  {h:'Para 1',pts:['1,000 tanks; 3,000 killed; 20,000 fled to the West; Nagy later executed – established that the USSR would use overwhelming force to prevent satellite states leaving','De-Stalinisation had clear limits – reforms were tolerated only within the communist bloc; leaving the Warsaw Pact was absolutely not permitted']},
  {h:'Para 2',pts:['West condemned invasion but did nothing – showed Truman Doctrine applied only outside Soviet sphere; NATO was not a guarantee for Eastern Europeans','Confirmed that satellite states had no real independence – their fate depended entirely on Soviet willingness to allow reform']}
 ]},

{paper:'p2a',type:'8mark-importance',skill:'Importance',
 q:'Explain the importance of the Berlin Wall (1961) for the development of the Cold War. (8 marks)',
 content:[
  {h:'Para 1',pts:['Ended the "brain drain" of 3 million East Germans who had fled West since 1949; stabilised the East German economy in the short term','Khrushchev had secured his most immediate objective – preventing the collapse of the GDR through emigration']},
  {h:'Para 2',pts:['Long term: became the defining symbol of Cold War division; Kennedy\'s "Ich bin ein Berliner" (1963) gave the West powerful propaganda','Demonstrated to the world that communism could only survive by physically imprisoning its own people – massive long-term damage to Soviet reputation']}
 ]},

{paper:'p2a',type:'8mark-importance',skill:'Importance',
 q:'Explain the importance of the Cuban Missile Crisis (1962) for superpower relations. (8 marks)',
 content:[
  {h:'Para 1',pts:['For 13 days world closest to nuclear war in history; both sides realised they had come dangerously close to catastrophe','Hotline (1963) and Test Ban Treaty (1963) followed immediately – first arms control agreements of the Cold War']},
  {h:'Para 2',pts:['Khrushchev forced to remove missiles publicly; seen to have "blinked"; forced from power 1964','Crisis began slow movement toward détente – contributed to the 1970s period of negotiation between Nixon and Brezhnev']}
 ]},

{paper:'p2a',type:'8mark-importance',skill:'Importance',
 q:'Explain the importance of the Prague Spring (1968) for Soviet control of Eastern Europe. (8 marks)',
 content:[
  {h:'Para 1',pts:['500,000 troops showed USSR would use overwhelming force to prevent even moderate reform that threatened the communist bloc','Dubček\'s "Socialism with a human face" was crushed – showed that reform within the system was simply not permitted']},
  {h:'Para 2',pts:['Albania left the Warsaw Pact in protest and aligned with China – first fracture in the communist bloc','West condemned invasion but did nothing – confirmed that Soviet sphere was inviolable; this context was crucial for why détente eventually became necessary']}
 ]},

{paper:'p2a',type:'8mark-importance',skill:'Importance',
 q:'Explain the importance of SALT 1 (1972) for relations between the USA and USSR. (8 marks)',
 content:[
  {h:'Para 1',pts:['First nuclear arms limitation treaty between superpowers – showed both sides were willing to negotiate rather than simply threaten','Restricted ICBMs and SLBMs; 40% of Soviet economy on nuclear weapons – both sides had strong economic reasons to limit the arms race']},
  {h:'Para 2',pts:['Part of broader détente: Helsinki Accords (1975), Apollo-Soyuz mission (1975) – genuine improvement in superpower relations','However SALT 2 abandoned after Afghanistan (1979) – shows how fragile détente was; a single crisis could destroy years of diplomatic progress']}
 ]},

{paper:'p2a',type:'8mark-importance',skill:'Importance',
 q:'Explain the importance of the Soviet invasion of Afghanistan (1979) for the Cold War. (8 marks)',
 content:[
  {h:'Para 1',pts:['Carter scrapped SALT 2 and issued Carter Doctrine; sent arms to Mujahideen – détente officially ended after less than a decade','Reagan elected 1980; $1 trillion military spending increase; called USSR "Evil Empire" – Second Cold War began immediately']},
  {h:'Para 2',pts:['10-year war costing $8 billion per year became a massive economic drain on the USSR – "the Soviet Vietnam"','Combined with the cost of the arms race and SDI, Afghanistan was a key factor in the economic crisis that brought Gorbachev to power']}
 ]},

{paper:'p2a',type:'8mark-importance',skill:'Importance',
 q:'Explain the importance of Gorbachev\'s New Thinking for Soviet control of Eastern Europe. (8 marks)',
 content:[
  {h:'Para 1',pts:['Sinatra Doctrine (1988) withdrew the threat of Soviet invasion – without this, communist governments were immediately vulnerable to popular pressure','Poland led in June 1989; Gorbachev did not send tanks; every other satellite state followed within months; Berlin Wall fell 9 November 1989']},
  {h:'Para 2',pts:['By end of 1989 all satellite states had abandoned communism; Germany reunited 1990; Warsaw Pact dissolved 1991','Gorbachev\'s reforms were intended to save the USSR by reforming it – instead they fatally undermined Soviet authority across all of Eastern Europe']}
 ]},

{paper:'p2a',type:'8mark-importance',skill:'Importance',
 q:'Explain the importance of the fall of the Berlin Wall (1989) for the end of the Cold War. (8 marks)',
 content:[
  {h:'Para 1',pts:['9 November 1989: the defining physical symbol of Cold War division fell – visually announced the end of communist Europe','Triggered rapid domino effect: all satellite states abandoned communism by end of 1989; Germany reunited 1990; Warsaw Pact dissolved 1991']},
  {h:'Para 2',pts:['Malta Summit (1989): Bush and Gorbachev declared Cold War at an end','August 1991: coup failed; Gorbachev resigned Christmas Day 1991; USSR dissolved; 15 independent republics emerged']}
 ]},
