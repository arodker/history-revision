{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of Elizabeth\'s financial problems when she became queen in 1558. (2 marks)',
 content:[{h:'Points',pts:['The crown was £227,000 in debt when Elizabeth came to the throne – it took 20 years to clear and made it extremely difficult to fight wars or fund government','This debt meant Elizabeth had to rely heavily on Parliament for taxation and could not act independently in foreign policy without risking financial collapse']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the religious divisions Elizabeth faced in 1558. (2 marks)',
 content:[{h:'Points',pts:['England was deeply divided between Catholics and Protestants; her sister Mary I had burned 300 Protestants while Catholics hoped for the return of the Pope\'s authority','Catholics believed Elizabeth was illegitimate because the Pope had not sanctioned Henry VIII\'s divorce, meaning Mary Queen of Scots had a rival claim to the throne']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of Elizabeth\'s Privy Council. (2 marks)',
 content:[{h:'Points',pts:['Elizabeth\'s most important advisors were William Cecil, Robert Dudley and Francis Walsingham; they met regularly to advise her on government, foreign policy and religious matters','The Privy Council had real power – Walsingham ran a nationwide spy network and Cecil controlled government administration; their advice shaped Elizabeth\'s major decisions']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of England\'s foreign policy problems in 1558. (2 marks)',
 content:[{h:'Points',pts:['England was at war with France in 1558 and had just lost Calais – its last French territory – which was a national humiliation and cost England its military foothold in Europe','England also faced the threat of Scotland under Mary Queen of Scots who had the Auld Alliance with France, meaning Elizabeth risked a Catholic invasion from both north and south']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the Act of Supremacy (1559). (2 marks)',
 content:[{h:'Points',pts:['The Act of Supremacy made Elizabeth "Supreme Governor" of the Church of England – she chose "Governor" rather than "Head" as it was less offensive to Catholics','The Act removed all papal authority from England; anyone who denied Elizabeth\'s supremacy could be charged with treason']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the Act of Uniformity (1559). (2 marks)',
 content:[{h:'Points',pts:['The Act of Uniformity required all churches to use identical Protestant services; Catholic images and vestments were still allowed – this "Via Media" was designed to satisfy both Protestants and moderate Catholics','Recusants who did not attend a licensed church were fined just 1 shilling – much lighter than Mary I\'s approach of burning Protestant heretics']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the Vestment Controversy. (2 marks)',
 content:[{h:'Points',pts:['Puritans refused to wear vestments in church, arguing they were Catholic symbols; the Archbishop of Canterbury had to insist they must be worn','The controversy showed the limits of Puritan power – they could not override Church authority even with supporters in the Privy Council and Parliament']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the Crucifix Controversy. (2 marks)',
 content:[{h:'Points',pts:['Puritans campaigned to have crucifixes removed from all churches, arguing they were Catholic idols with no place in a Protestant church','Unlike the Vestment Controversy, the Puritans succeeded – crucifixes were removed from all churches; a small but real Puritan victory']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the Puritan challenge to the Religious Settlement. (2 marks)',
 content:[{h:'Points',pts:['Puritans were extreme Protestants who wanted to remove all Catholic elements from the Church; they had powerful supporters including two Privy Councillors (Dudley and Walsingham) and MPs who pushed for change in Parliament','Unlike Catholics, Puritans had no alternative monarch to replace Elizabeth – their challenge was to the details of the Settlement, not to her right to rule']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the threat posed by Catholics to Elizabeth in the years 1558–69. (2 marks)',
 content:[{h:'Points',pts:['One third of nobles were Catholic but most paid the 1 shilling recusancy fine rather than rebel – the risk of rebellion was too high','Spain and France were powerful Catholic nations who could support English Catholics, but both were distracted throughout the 1560s by their own conflicts']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the papal excommunication of Elizabeth (1570). (2 marks)',
 content:[{h:'Points',pts:['Pope Pius V issued the papal bull Regnans in Excelsis in 1570, excommunicating Elizabeth and encouraging all Catholics in England and Europe to remove her from power','Parliament responded by making it treason to own a copy of the excommunication decree – showing how seriously Elizabeth\'s government viewed the threat']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of Mary Queen of Scots as a threat to Elizabeth. (2 marks)',
 content:[{h:'Points',pts:['Catholics believed Elizabeth was illegitimate and Mary was the true queen of England; even Protestants knew Mary was Elizabeth\'s heir if she had no children – simply by existing she was a focal point for opposition','Mary\'s mother was from the powerful Guise family; she had grown up in France; Scotland\'s Auld Alliance with France meant she could potentially trigger a French-backed Catholic invasion']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the Treaty of Edinburgh (1560). (2 marks)',
 content:[{h:'Points',pts:['The Treaty of Edinburgh was signed by Scottish Protestant lords who had received help from Elizabeth; they renounced Mary Queen of Scots\' claim to the English throne','Mary refused to ratify the Treaty of Edinburgh – keeping her claim to the English throne legally alive and remaining a persistent threat throughout Elizabeth\'s reign']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the York Conference (1568). (2 marks)',
 content:[{h:'Points',pts:['When Mary Queen of Scots fled to England in 1568 seeking help, Elizabeth held a conference at York to examine the charges that Mary had murdered her husband Lord Darnley','Elizabeth decided Mary was guilty and had her imprisoned in northern England rather than helping her or returning her to Scotland']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the Revolt of the Northern Earls (1569). (2 marks)',
 content:[{h:'Points',pts:['The Earls of Northumberland and Westmoreland raised armies, marched on Durham Cathedral and celebrated Catholic Mass; they planned to free Mary Queen of Scots and place her on the throne','Elizabeth raised an army of 14,000 soldiers; when no other Catholic nobles joined and their expected Spanish support failed to arrive, the Earls fled; Elizabeth hanged approximately 450 rebels']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the Ridolfi Plot (1571). (2 marks)',
 content:[{h:'Points',pts:['The Ridolfi Plot aimed to assassinate Elizabeth and place Mary Queen of Scots on the throne with the help of Spanish troops sent by Philip II','The plot was uncovered by Walsingham\'s spy network; the Duke of Norfolk was executed; Elizabeth refused Parliament\'s demands that Mary also be executed']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the Bond of Association (1584). (2 marks)',
 content:[{h:'Points',pts:['The Bond of Association was agreed by Elizabeth\'s Privy Council after the Throckmorton Plot; it pledged that they would kill anyone who conspired to benefit from Elizabeth\'s death','It was specifically designed to ensure that Mary Queen of Scots would be killed if there was another Catholic plot – making her execution after the Babington Plot legally and politically possible']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of Walsingham\'s spy network. (2 marks)',
 content:[{h:'Points',pts:['Francis Walsingham built a highly effective intelligence network that uncovered all three major Catholic plots against Elizabeth – Ridolfi (1571), Throckmorton (1583) and Babington (1586)','In the Babington Plot, Walsingham allowed the conspiracy to continue after discovering it specifically to gather undeniable written evidence of Mary Queen of Scots\' direct involvement']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the Babington Plot (1586). (2 marks)',
 content:[{h:'Points',pts:['Anthony Babington planned to assassinate Elizabeth and place Mary Queen of Scots on the throne; Walsingham allowed the plot to continue until he had clear written evidence of Mary\'s direct approval','Mary was tried for treason and found guilty; Elizabeth signed the death warrant and Mary was executed in February 1587']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of Drake\'s circumnavigation of the globe (1577–80). (2 marks)',
 content:[{h:'Points',pts:['Drake became only the second crew to circumnavigate the globe between 1577 and 1580; during the voyage he raided £400,000 of Spanish treasure from Spanish ships and colonies','Elizabeth knighted Drake in 1580 on the deck of the Golden Hind despite Philip II\'s furious protests – Philip saw this as open endorsement of piracy']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of Drake\'s raid on Cadiz (1587). (2 marks)',
 content:[{h:'Points',pts:['In 1587 Drake sailed to Cadiz and destroyed around 30 Spanish ships and damaged many others, then led the Spanish navy on a chase and stole £140,000 worth of supplies','Known as "the singeing of the King of Spain\'s beard", the raid delayed the Armada by a year and gave England crucial time to prepare its defences']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the Dutch Revolt. (2 marks)',
 content:[{h:'Points',pts:['Protestant Dutch had been rebelling against Spanish Catholic rule since the 1560s; Elizabeth had secretly funded and armed them; in 1585 she signed the Treaty of Nonsuch pledging 7,400 troops and £126,000 per year','The Dutch Revolt was central to Anglo-Spanish deterioration because it forced Elizabeth to choose between supporting Protestantism in Europe and maintaining peace with Spain']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the Treaty of Joinville (1584). (2 marks)',
 content:[{h:'Points',pts:['In 1584 Philip II of Spain signed the Treaty of Joinville with French Catholics, pledging to work together to destroy Protestantism across Europe','The Treaty made Elizabeth a direct target – Spain and France were now officially committed to removing the Protestant queen of England']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the Spanish Armada of 1588. (2 marks)',
 content:[{h:'Points',pts:['The Duke of Medina-Sidonia was sent with 130 ships and 27,000 men to the Netherlands to collect the Duke of Parma\'s 30,000 troops; the plan was then to invade England','Drake sent fireships into the tightly-anchored Armada at Calais – Spanish captains panicked and scattered, breaking the defensive formation that had protected them up the Channel']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the Battle of Gravelines (1588). (2 marks)',
 content:[{h:'Points',pts:['The English navy attacked the scattered Armada at Gravelines the morning after the fireships; Drake\'s faster and more manoeuvrable galleons inflicted significant damage on the disordered Spanish fleet','After Gravelines, storms off Ireland and Scotland destroyed over half of the 130 Spanish ships; Parma\'s army had been trapped by Dutch flyboats and could never link up with the Armada']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of Elizabeth\'s Tilbury speech (1588). (2 marks)',
 content:[{h:'Points',pts:['Elizabeth delivered her Tilbury speech to rally English troops against the Spanish invasion threat; she declared "I may have the body of a weak and feeble woman but I have the heart and stomach of a king"','England\'s victory over the Armada was used as a Protestant propaganda triumph; a medal declared "God blew, and they were scattered"']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of grammar schools in Elizabethan England. (2 marks)',
 content:[{h:'Points',pts:['72 new grammar schools were introduced during Elizabeth\'s reign; fees were based on parents\' income and some middle-class boys could attend; male literacy rose from 20% to 30%','Girls did not attend school at all; female literacy remained at 10% throughout the reign – education was designed to fit the social station you were born into']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of Elizabethan attitudes to blood sports. (2 marks)',
 content:[{h:'Points',pts:['Bear-baiting, bull-baiting and cock-fighting were popular across all social classes throughout Elizabeth\'s reign; Elizabeth herself enjoyed these spectacles and they were not considered cruel by Elizabethan standards','Public executions and the pillory also drew large crowds as forms of public entertainment']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of theatre in Elizabethan England. (2 marks)',
 content:[{h:'Points',pts:['From the 1570s permanent theatres such as The Theatre and The Rose were built in London; for just 1 penny anyone could stand in the pit and watch a performance – theatre was open to all social classes','Theatre was a genuinely new form of entertainment that brought drama, comedy and ideas to ordinary Londoners']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of enclosure in Elizabethan England. (2 marks)',
 content:[{h:'Points',pts:['Enclosure was when wealthy landowners took common land away from poor people and fenced it off to farm sheep for the profitable wool trade','This left many poor people landless; they drifted to towns looking for work and swelled the numbers of vagabonds – one of the main causes of increased poverty during Elizabeth\'s reign']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the Vagabonds Act (1572). (2 marks)',
 content:[{h:'Points',pts:['The Vagabonds Act of 1572 stated that vagabonds over the age of 14 were to be whipped and burned through the right ear for their first offence; further offences could mean execution','The Act reflected Elizabethan attitudes that the "undeserving poor" – those who could work but did not – were criminals who deserved punishment rather than help']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the Houses of Correction (1576). (2 marks)',
 content:[{h:'Points',pts:['From 1576, Houses of Correction were built where the poor were taught skills to find work – a more constructive approach than the purely punitive Vagabonds Act of 1572','Local officials were required to find work for the poor and wealthy people had to contribute to a fund distributed to the deserving poor – the first organised approach to poor relief']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the Malthusian Crisis during Elizabeth\'s reign. (2 marks)',
 content:[{h:'Points',pts:['During Elizabeth\'s reign the population grew from 3 million to 4 million; this pushed up food prices and increased competition for jobs, driving down wages – the combination caused widespread poverty','The "little ice age" meant temperatures dropped and harvests were more likely to fail, making food shortages more frequent and severe']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of Elizabethan attitudes towards the poor. (2 marks)',
 content:[{h:'Points',pts:['Elizabethan society divided the poor into the "deserving poor" (the old or physically disabled who could not work) and the "undeserving poor" (those who were able-bodied but unemployed)','Elizabethans blamed the undeserving poor for laziness and criminality; there were exaggerated rumours about vagabonds committing crimes and spreading disease']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of Elizabethan voyages of exploration. (2 marks)',
 content:[{h:'Points',pts:['New technology made long voyages possible: the Mercator map (1569) gave a more accurate picture of the world\'s geography; astrolabes used stars to determine a ship\'s location; improved galleon designs made ocean voyages safer','1562: John Hawkins created the Triangular Slave Trade bringing great wealth to England; Elizabeth personally invested in his expeditions']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the failure of the first Virginia colony (1585). (2 marks)',
 content:[{h:'Points',pts:['108 settlers arrived at Roanoke Island in 1585 but the supply ship The Tiger ran aground on landing, causing seawater to destroy most of the precious food stores – leaving the colonists dependent on the Algonquian people','Relations with the Algonquian people broke down; Ralph Lane led a pre-emptive attack killing chief Wingina – ending any chance of the cooperation essential to the colony\'s survival']}]},

{paper:'p2b',type:'2mark',skill:'Describe one feature',
 q:'Describe one feature of the mystery of the lost Roanoke colony. (2 marks)',
 content:[{h:'Points',pts:['A second expedition of colonists arrived in 1587 but supply ships were forced to return to England; the Armada crisis of 1588 prevented them returning until 1590','When ships returned in 1590 the colony had completely vanished; the only clue was the word "Croatoan" carved into a tree – the colonists were never seen again']}]},

// ── P2b · 12-mark (all 14) ───────────────────
{paper:'p2b',type:'12mark',skill:'Explain why',
 q:'Explain why Elizabeth faced challenges when she became queen in 1558. (12 marks)\nHints: Religion / France',
 content:[
  {h:'Para 1 – Religious division',pts:['England deeply divided between Catholics and Protestants; 1/3 of nobles were Catholic and did not accept Elizabeth\'s legitimacy','Catholics believed Elizabeth was illegitimate – Pope had not sanctioned Henry VIII\'s divorce; Mary Queen of Scots had a rival claim','Any religious settlement risked offending either powerful Catholic nobles or influential Puritan MPs']},
  {h:'Para 2 – Foreign threat and debt',pts:['£227,000 crown debt; at war with France; Calais lost 1558 – national humiliation','Scotland had Auld Alliance with France and was ruled by Catholic Mary QoS – threat of invasion from north and south simultaneously','Elizabeth had no army or money to defend against these threats effectively']},
  {h:'Para 3 – Patriarchal attitudes and marriage',pts:['Deeply patriarchal society – many believed women could not rule or lead armies; sister Mary I had reinforced this fear','Expected to marry but foreign husband risked xenophobic reaction; English husband would create noble rivalries','Elizabeth\'s refusal to commit to marriage became a recurring political problem with MPs and Privy Councillors']}
 ]},

{paper:'p2b',type:'12mark',skill:'Explain why',
 q:'Explain why the Religious Settlement was disliked by some in England. (12 marks)\nHints: Royal Supremacy / Vestments',
 content:[

  {h:'Disagree A – political grievances drove the earls personally',agree:false,pts:['Earls resented being marginalised by Elizabeth\'s Protestant advisers, particularly William Cecil','Traditional families had ruled northern England but had been replaced by Elizabeth\'s Council of the North – loss of status and power','Revolt was as much about restoring aristocratic influence as restoring Catholicism – the two were inseparable for the earls']},
  {h:'Disagree B – Mary Queen of Scots was the catalyst that made rebellion possible',agree:false,pts:['Mary\'s arrival and imprisonment in the north gave the revolt its specific political objective – placing her on the throne','Without Mary as an alternative monarch the revolt would have had no clear aim beyond opposing the Settlement','Revolt planned to free Mary and marry her to the Duke of Norfolk – a political coup that used religious language as justification']}
 ]},

{paper:'p2b',type:'16mark',skill:'How far do you agree',
 q:'"There was a significant improvement in access to education in Elizabeth\'s reign." How far do you agree?\nHints: Grammar schools / Female education',
 content:[
  {h:'Agree – grammar school expansion was significant',agree:true,pts:['72 new grammar schools during Elizabeth\'s reign – real expansion in formal education provision','Fees based on income allowed some middle-class boys to attend alongside nobility','Male literacy rose from 20% to 30% – a measurable improvement in educational outcomes during the reign']},
  {h:'Disagree A – the poor and rural people remained excluded',agree:false,pts:['Grammar schools charged fees the poor could not afford; rural majority had virtually no access to formal schooling','Education was designed to fit the station you were born into – not to create social mobility','For the majority of Elizabeth\'s subjects, access to education did not change at all during the reign']},
  {h:'Disagree B – women were completely excluded from improvement',agree:false,pts:['Girls did not attend school at all; Female education – female literacy remained at 10% throughout the entire reign with no improvement whatsoever','Noble women were educated privately but this was available to only a tiny fraction of the female population','To say access "significantly improved" ignores the fact that half the population – all women – saw no change at all']}
 ]},

{paper:'p2b',type:'16mark',skill:'How far do you agree',
 q:'"Entertainment in Elizabethan England continued to be based on violence." How far do you agree?\nHints: Bear-baiting / Theatre',
 content:[
  {h:'Agree – violent entertainment remained popular',agree:true,pts:['Bear-baiting, bull-baiting and cock-fighting were popular across all social classes throughout the reign; Elizabeth herself enjoyed these spectacles','Public executions and the pillory drew large crowds as entertainment; these were not declining in popularity','The aristocracy continued to hunt as a central social activity; violent entertainments showed no signs of dying out']},
  {h:'Disagree A – Theatre was a genuinely new non-violent entertainment',agree:false,pts:['Permanent theatres from 1570s (The Theatre, The Rose) attracted thousands for 1 penny; Shakespeare\'s plays offered drama and comedy based on language','Theatre shows Elizabethan entertainment was diversifying – not simply continuing old violent traditions','For the first time ordinary Londoners had access to a rich cultural experience that did not involve violence or blood']},
  {h:'Disagree B – court entertainment had always been non-violent',agree:false,pts:['Nobility enjoyed hunting, hawking, real tennis, music, dancing – a rich range of non-violent pastimes at court','Elizabeth\'s court was renowned for music, poetry and dancing; she herself was an accomplished musician','To say entertainment "continued to be based on violence" ignores the rich non-violent cultural life that existed at every level of society']}
 ]},

{paper:'p2b',type:'16mark',skill:'How far do you agree',
 q:'"Life for ordinary people improved during Elizabeth\'s reign." How far do you agree?\nHints: Inflation / Education',
 content:[
  {h:'Agree – some genuine improvements occurred',agree:true,pts:['72 new grammar schools; male literacy rose 20% to 30%; theatre open to all for 1 penny – real improvements in cultural access','1576 Houses of Correction built; organised poor relief created; first government responsibility for the poor','For some – particularly in London and among artisan classes – cultural life and access to services genuinely improved']},
  {h:'Disagree A – Inflation and poverty increased for most ordinary people',agree:false,pts:['Population rose from 3 to 4 million – food prices rose, wages fell due to Inflation; the Malthusian Crisis made life materially harder','Enclosure deprived rural poor of common land essential to their subsistence throughout the reign','For the rural poor – the majority of the population – life was measurably harder at the end of the reign than at the start']},
  {h:'Disagree B – improvements were narrow in scope and reach',agree:false,pts:['Theatre in London benefited urban Londoners; rural majority had no access to these cultural gains','Educational improvements benefited middle-class boys; girls were entirely excluded; the poor could not afford fees','Poor relief legislation helped limited numbers; the scale of poverty far exceeded what any Elizabethan law could address']}

{paper:'p2b',type:'16mark',skill:'How far do you agree',
 q:'"Attitudes towards the poor barely changed during Elizabeth\'s reign." How far do you agree?\nHints: 1576 Act for the Relief of the Poor / Vagabonds',
 content:[
  {h:'Agree – core attitudes remained unchanged',agree:true,pts:['Distinction between "deserving" and "undeserving" poor persisted completely unchanged throughout the reign','1572 Vagabonds Act: whipping and ear-burning – harsh punitive approach reflecting belief that poverty was a moral failing','Exaggerated rumours about criminal Vagabonds persisted throughout the reign; popular attitudes never fundamentally changed']},
  {h:'Disagree A – legislation showed changing official thinking',agree:false,pts:['1576 Act for the Relief of the Poor: Houses of Correction built; local officials required to find work for poor; wealthy required to fund relief','A shift from pure punishment toward practical support – recognising poverty as a social problem requiring organised response','The 1576 Act was a genuine departure from the purely punitive approach of the 1572 Vagabonds Act']},
  {h:'Disagree B – attitudes varied by group and changed gradually',agree:false,pts:['The deserving/undeserving distinction itself showed some compassion – old and disabled recognised as genuinely needing help','Elizabethan poor law developed across several pieces of legislation (1563, 1572, 1576) – shows evolving thinking, not static attitudes','To say attitudes "barely changed" is too absolute; the 1576 Act\'s constructive approach was a genuine change from earlier Tudor thinking']}
 ]},

{paper:'p2b',type:'16mark',skill:'How far do you agree',
 q:'"Poverty increased during Elizabeth\'s reign mainly because of changes in agriculture." How far do you agree?\nHints: Enclosure / Population rise',
 content:[
  {h:'Agree – agricultural change was a major cause',agree:true,pts:['Enclosure drove families off common land they had depended on for subsistence – creating a large class of landless labourers','Shift from arable to sheep farming reduced demand for agricultural labour – same land now employed far fewer people','For rural England specifically, Enclosure was probably the most direct driver of increased poverty']},
  {h:'Disagree A – Population rise was equally important',agree:false,pts:['Population rise from 3 to 4 million increased competition for jobs and food; employers could lower wages; prices rose','Population rise affected urban workers with no connection to agricultural land – enclosure alone cannot explain their poverty','Little ice age: harvest failures independent of enclosure made food prices more volatile and poverty more severe']},
  {h:'Disagree B – financial factors were also significant causes',agree:false,pts:['Debasement of the currency by Henry VIII created inflation that persisted throughout Elizabeth\'s reign','This eroded the real purchasing power of wages for urban workers entirely independent of any agricultural change','Several overlapping causes combined: attributing poverty "mainly" to agriculture is an oversimplification of a complex problem']}
 ]},

{paper:'p2b',type:'16mark',skill:'How far do you agree',
 q:'"Voyages of exploration increased in Elizabeth\'s reign mainly because of the opportunity for fame." How far do you agree?\nHints: Drake / Mercator map',
 content:[
  {h:'Agree – fame was a genuine motivating factor',agree:true,pts:['Drake\'s circumnavigation brought enormous national prestige; Elizabeth knighted him on deck of the Golden Hind – exploration became socially desirable','Elizabeth\'s patronage gave exploration royal endorsement; accounts of Drake\'s exploits were widely read and celebrated','Fame and national glory were powerful incentives in a society where reputation and honour mattered enormously']},
  {h:'Disagree A – profit was more important than fame',agree:false,pts:['Elizabeth personally invested in Hawkins\' Triangular Slave Trade expeditions – economic calculation drove royal backing','Drake stole £400,000 of Spanish treasure during his circumnavigation – profit and fame were inseparable motivations','Without the prospect of profit, London merchants would not have funded the voyages that made exploration possible']},
  {h:'Disagree B – new technology made voyages newly possible',agree:false,pts:['Mercator map 1569, astrolabes and improved galleons meant voyages that had been impossible before became achievable','Without these technological advances, desire for fame or profit could not have produced results','Technology enabled the age of exploration – desire for fame was the motivation but the Mercator map and new ship designs were the enabler']}
 ]},

{paper:'p2b',type:'16mark',skill:'How far do you agree',
 q:'"The failure of the Virginia colony in the 1580s was mainly due to Native American resistance." How far do you agree?\nHints: Wingina / Poor planning',

  {h:'Disagree A – poor planning was more important than Native American resistance',agree:false,pts:['Loss of The Tiger on arrival in 1585 left colony immediately vulnerable – before any serious conflict with Native Americans had occurred','Too many soldiers and merchants; not enough farmers with practical skills to be self-sufficient – Poor planning from the outset','Roanoke Island chosen with a shallow harbour unsuitable for large supply ships – a fundamental logistical error']},
  {h:'Disagree B – bad timing and external events were decisive',agree:false,pts:['1587 expedition: colonists arrived too late in the year to plant crops; supply ships forced to return to England immediately','Armada crisis 1588 prevented any supply ships returning until 1590 – by which time the colony had vanished','The 1587 colony\'s failure owed almost nothing to Native American resistance – it was caused by supply failure and bad timing']}
 ]},

{paper:'p3',type:'12mark',skill:'Explain why',
 q:'Explain why the Weimar Republic was unpopular in the period 1919–23. (12 marks)\nHints: Treaty of Versailles / Hyperinflation',
 content:[
  {h:'Para 1 – Treaty of Versailles and Dolchstoss',pts:['June 1919: forced to accept £6.6bn reparations, loss of 13% of land, army limited to 100,000, 100% war guilt – all blamed on Weimar politicians','Called "November Criminals" – accused of stabbing the undefeated army in the back by signing the armistice 11 November 1918','Treaty gave extremist parties a permanent grievance to exploit – the founding political wound of the Weimar period']},
  {h:'Para 2 – Political violence from left and right',pts:['January 1919: Spartacist revolt – Luxemburg led 100,000 workers; Ebert used right-wing Freikorps to crush it','1920: Kapp Putsch – Freikorps seized Berlin; army refused to act; only workers\' general strike saved democracy','376 politicians assassinated in these early years; government threatened from both left and right simultaneously']},
  {h:'Para 3 – Hyperinflation 1923',pts:['France invaded the Ruhr 1923; government printed money to pay striking workers – bread rose from 1 mark (1919) to 200 billion marks (November 1923)','Middle classes lost savings permanently; working class could not keep up with prices','Made abstract political resentment into lived economic catastrophe; directly fuelled extremism and the Munich Putsch']}
 ]},

{paper:'p3',type:'12mark',skill:'Explain why',
 q:'Explain why the Weimar Republic became more stable in the years 1924–29. (12 marks)\nHints: Dawes Plan / Hindenburg',
 content:[
  {h:'Para 1 – Economic recovery under Stresemann',pts:['November 1923: Rentenmark introduced – halted hyperinflation; tied to land value not printed money','1924: Dawes Plan – reparations cut to £50m/year; $200m US loans secured to stabilise economy','1929: Young Plan – reparations cut to £2bn extended to 1988; extremist support fell from 40% (1924) to 28% (1928)']},
  {h:'Para 2 – International rehabilitation',pts:['1925: Locarno Pact – Germany accepted Versailles borders; France left the Ruhr; diplomatic success restored national confidence','1926: Germany joined the League of Nations – accepted back into the international community as a legitimate state','These achievements undermined the nationalist argument that Weimar had failed Germany internationally']},
  {h:'Para 3 – Hindenburg\'s election gave conservatives confidence in the Republic',pts:['1925: war-hero Hindenburg elected President – conservatives who had opposed the Republic now more willing to support it','Traditional conservatives who might have backed the Nazis instead supported Hindenburg and Weimar\'s stability','This removed a key political constituency from the extremists and made the Weimar system appear more legitimate']}
 ]},

{paper:'p3',type:'12mark',skill:'Explain why',
 q:'Explain why life improved for some Germans in the years 1924–29. (12 marks)\nHints: Women\'s rights / Culture',
 content:[
  {h:'Para 1 – Economic improvement',pts:['Rentenmark ended hyperinflation; Dawes Plan secured $200m US loans; wages rose 25%; unemployment fell','100,000 new houses built; war veterans received pensions; real improvement in material conditions for those in work','For those with jobs the mid-1920s saw genuine improvement after years of hyperinflation and political violence']},
  {h:'Para 2 – Women\'s rights expanded significantly',pts:['Women gained equal voting rights to men in the Weimar constitution; began working in traditionally male jobs','Wore modern fashions (flappers); more independent social activities; Women\'s rights were more advanced than in most of Europe','Represented a real transformation from pre-war Imperial Germany for many women, especially in cities']},
  {h:'Para 3 – Cultural flourishing',pts:['Weimar Germany became the centre of modern European Culture; Bauhaus school developed modern affordable design','Fritz Lang\'s Metropolis (1927) and Otto Dix\'s art showed German culture at the cutting edge of European modernity','Berlin became one of the most culturally exciting cities in the world – however prosperity was built entirely on US loans']}
 ]},

{paper:'p3',type:'12mark',skill:'Explain why',
 q:'Explain why Hitler attempted the Munich Putsch in 1923. (12 marks)\nHints: Mussolini / Ludendorff',
 content:[
  {h:'Para 1 – Economic crisis created the opportunity',pts:['Hyperinflation had made Weimar deeply unpopular by 1923; government appeared helpless; bread cost billions of marks','France\'s Ruhr invasion added national humiliation to economic chaos; the moment seemed perfect for radical action','Nazi Party had grown to 20,000 members – Hitler felt he had sufficient support to act']},
  {h:'Para 2 – Mussolini\'s example and Ludendorff\'s support gave Hitler confidence',pts:['October 1922: Mussolini\'s March on Rome – fascists marched on Italian capital; King made Mussolini Prime Minister; Hitler hoped to replicate this','War-hero General Ludendorff\'s support gave the coup military credibility and public appeal','Hitler believed Ludendorff\'s involvement would persuade the army to follow rather than fire on their former commander']},
  {h:'Para 3 – Hitler overestimated his support',pts:['Nazi Party had grown to 20,000 members','SA led by Ernst Rohm were becoming a powerful force in Munich','Hitler, incorrectly, believed that the Bavarian leader Gustav Von Kahr would support his revolution.']}
 ]},

{paper:'p3',type:'12mark',skill:'Explain why',
 q:'Explain why the Nazis were unable to gain large amounts of support in the years 1924–28. (12 marks)\nHints: Party banned / Stresemann\'s recovery',
 content:[
  {h:'Para 1 – Aftermath of Munich Putsch weakened the party',pts:['Nazi Party banned after Putsch; Hitler served 9 months; on release had to rebuild party from scratch','Without the party organisation, momentum from the 1923 crisis was lost; the most promising window of opportunity had closed','Hitler switched to electoral strategy but building a national electoral machine from scratch took years']},
  {h:'Para 2 – Stresemann\'s economic recovery removed the conditions for extremism',pts:['Rentenmark (1923), Dawes Plan (1924) and Locarno Pact (1925) gradually stabilised Germany','As economy improved and international standing recovered, extremist parties lost their appeal','Extremist support fell from 40% (1924) to 28% (1928) – Stresemann\'s success directly undermined the Nazis\' core message']},
  {h:'Para 3 – Hindenburg\'s election gave conservatives confidence in Weimar',pts:['1925: election of war-hero Hindenburg as President gave conservatives who had opposed the Republic reason to support it','Traditional conservatives who might have backed the Nazis instead supported Hindenburg and Weimar\'s stability','In 1928 Nazis won only 12 Reichstag seats – in a period of relative prosperity there was simply no market for extreme solutions']}
 ]},

{paper:'p3',type:'12mark',skill:'Explain why',
 q:'Explain why support for the Nazi Party increased in the years 1929–32. (12 marks)\nHints: Wall Street Crash / Fear of communism',
 content:[
  {h:'Para 1 – Wall Street Crash and unemployment',pts:['October 1929: Wall Street Crash; US banks recalled loans; businesses went bankrupt; unemployment reached 6 million by 1933','Brüning nicknamed "hunger chancellor" – Weimar appeared completely helpless; people were desperate for radical change','Nazi Reichstag seats grew from 12 (1928) to 230 (July 1932) – almost entirely because of the economic crisis']},
  {h:'Para 2 – Fear of communism and business funding',pts:['Wealthy businesspeople feared economic chaos would bring Communist revolution; bankrolled the Nazis – funded propaganda, rallies and SA expansion','Nazi electoral success was partly built on class Fear of communism; the Nazis became the shield against the KPD for those with property to lose','SA projected disciplined image of organised strength that contrasted with the chaos of Weimar politics']},
  {h:'Para 3 – Hitler\'s personal appeal and targeted propaganda',pts:['Hitler\'s charismatic speeches tailored to different audiences: "Arbeit und Brot" for workers; price guarantees for farmers; national restoration for middle class','Goebbels ran sophisticated propaganda using radio, posters and rallies – Nazis far more effective at political communication than other parties','Promised to tear up the Treaty of Versailles – exploited 10 years of built-up resentment at national humiliation']}
 ]},

{paper:'p3',type:'12mark',skill:'Explain why',
 q:'Explain why Hitler became Chancellor in January 1933. (12 marks)\nHints: Von Papen / Elections of 1932',
 content:[
  {h:'Para 1 – Nazi electoral success created pressure on Hindenburg',pts:['July 1932: Nazis won 230 seats – largest party in Reichstag; democratic logic pointed to Hitler being given power','13 million votes for Hitler in April 1932 presidential election; Hindenburg had run out of arguments for ignoring the largest party indefinitely','However Nazi support was actually falling by November 1932 (196 seats) – Hitler\'s appointment was not inevitable from electoral success alone']},
  {h:'Para 2 – Failure of alternatives left Hindenburg with no options',pts:['Von Papen (May 1932) could not control Reichstag; forced to resign after six months','Von Schleicher (November 1932) asked Hindenburg for permission to create a military dictatorship – Hindenburg refused','By January 1933 Hindenburg had genuinely run out of viable alternatives; Hitler was the only politician who could command a Reichstag majority']},
  {h:'Para 3 – Von Papen\'s fatal miscalculation handed Hitler the chancellorship',pts:['Von Papen convinced Hindenburg that Hitler could be "controlled" with himself as Vice-Chancellor and a majority of non-Nazi ministers','"Mouse in my pocket" – Von Papen believed he could use Hitler\'s popularity while retaining real power','30 January 1933: Hitler appointed Chancellor; Von Papen\'s catastrophic miscalculation became clear within 18 months']}
 ]},

{paper:'p3',type:'12mark',skill:'Explain why',
 q:'Explain why Hitler was able to create a dictatorship in the years 1933–34. (12 marks)\nHints: Reichstag Fire / Enabling Act',
 content:[
  {h:'Para 1 – Reichstag Fire provided the legal pretext',pts:['27 February 1933: Reichstag burned; Dutch Communist blamed; 4,000 Communists arrested that night; Communists banned from their 81 seats','This gave Nazis the crucial 2/3 majority required to change the Constitution legally','March 1933: Enabling Act – gave Hitler power to pass any law without the Reichstag; democracy legally abolished']},
  {h:'Para 2 – Banning all opposition destroyed any legal resistance',pts:['All other parties banned July 1933; trade unions banned; local government abolished – Germany became a one-party state within months','Police state established: Gestapo, SS and Dachau (1933) created overwhelming atmosphere of terror','No legitimate political opposition left through which resistance could be organised']},
  {h:'Para 3 – Night of the Long Knives and Hindenburg\'s death completed the process',pts:['30 June 1934: Röhm and ~400 others murdered; army\'s loyalty secured – they agreed to swear personal oath to Hitler in return','2 August 1934: Hindenburg died; Hitler combined Chancellor and President into title of "Führer"','Process took just 18 months – from Chancellor to complete dictator – using legal mechanisms throughout']}
 ]},

{paper:'p3',type:'12mark',skill:'Explain why',
 q:'Explain why the Nazis were able to control the German people in the years 1933–39. (12 marks)\nHints: Propaganda / The Gestapo',
 content:[
  {h:'Para 1 – Police state and terror',pts:['Gestapo created such fear that citizens informed on neighbours, parents and friends – self-policing made resistance almost impossible to organise','SS: 300,000 members; above the law; ran Dachau (1933); could arrest, interrogate or execute without trial','Punishment for dissent so severe that most people chose compliance even if they privately disagreed']},
  {h:'Para 2 – Propaganda and censorship',pts:['Goebbels: 45 minutes of Nazi content before every film; radios blocked foreign broadcasts; Nuremberg rallies with 200,000 people','Censorship removed all alternative viewpoints: newspapers closed; books burned; art and culture "Nazified"','Combination of positive Propaganda and negative censorship created an information environment where opposition was invisible']},
  {h:'Para 3 – Genuine support from economic success',pts:['Unemployment fell from 6 million (1933) to 500,000 (1939) – many Germans had genuine material reason to support the regime','Hitler Youth (compulsory 1936) and League of German Maidens indoctrinated an entire generation','Fear, propaganda and economic improvement combined – most Germans either genuinely supported or passively accepted Nazi rule']}
 ]},

{paper:'p3',type:'12mark',skill:'Explain why',
 q:'Explain why some groups opposed the Nazis in the years 1933–39. (12 marks)\nHints: Pastor Niemöller / Youth groups',
 content:[
  {h:'Para 1 – Church opposition challenged Nazi control of religion',pts:['1933: Concordat signed with Pope Pius XI neutralised Catholic opposition – but many individual priests still spoke out','Confessing Church set up 1934 by Pastor Niemöller to oppose the Reich Church; 6,000 priests joined; ~800 sent to concentration camps','Church had its own institutional identity and moral authority that was difficult for the Nazis to completely suppress']},
  {h:'Para 2 – Youth groups resisted Nazi conformity',pts:['Swing Youth: teenagers from wealthy families listened to banned American jazz – cultural resistance to Nazi conformity','Edelweiss Pirates: attacked Hitler Youth members, went on hikes, told anti-Nazi jokes – more active resistance','Only 25% of young people attended Nazi Youth groups voluntarily before made compulsory 1936 – broader resistance than is sometimes assumed']},
  {h:'Para 3 – Workers and political opponents continued quiet resistance',pts:['Social Democrats continued underground newspapers; workers sometimes damaged machinery or stayed off sick','Some army officers opposed Hitler\'s leadership – culminating in the July 1944 assassination attempt','Police state was too efficient and terror too severe for organised resistance to grow – opposition remained fragmented throughout']}
 ]},

{paper:'p3',type:'12mark',skill:'Explain why',
 q:'Explain why women\'s lives changed under the Nazis in the years 1933–39. (12 marks)\nHints: The "3 Ks" / Mother\'s Cross',
 content:[
  {h:'Para 1 – Ideology of the 3 Ks reversed Weimar gains',pts:['Nazis believed in Kinder, Kirche, Küche – hated the "new women" of 1920s Weimar who had entered male jobs','Professional women removed: banned from teaching, medicine, law and civil service; girls banned from grammar schools from 1937','The 3 Ks represented a dramatic reversal for professional women who had gained independence during the Weimar period']},
  {h:'Para 2 – Financial incentives changed women\'s decisions',pts:['Marriage loan of 1,000 marks if wife gave up work; a quarter cancelled per child – powerful economic incentive','Mother\'s Cross medal: bronze for 4 children, silver for 6, gold for 8 – motherhood elevated as patriotic service','These policies shaped the decisions of many women who might otherwise have continued working']},
  {h:'Para 3 – Economic necessity eventually reversed Nazi gender ideology',pts:['By late 1930s rearmament required more workers; 1937 marriage loans cancelled; women directed back into factories','The regime\'s own economic needs forced it to reverse its gender ideology – women returned to work in large numbers','Shows the limits of ideology when it conflicted with the demands of military rearmament and economic production']}
 ]},

{paper:'p3',type:'12mark',skill:'Explain why',
 q:'Explain why the Nazis tried to control young people in the years 1933–39. (12 marks)\nHints: Schools / Hitler Youth',
 content:[
  {h:'Para 1 – Future loyalty required indoctrination from childhood',pts:['Hitler wanted a "1,000 Year Reich" – children of Germany would carry his ideas long after he died','Boys trained in Hitler Youth for military service – over 1 million trained to shoot guns; physically and mentally prepared for war','Girls in League of German Maidens trained to be wives and mothers – producing the next generation of soldiers and workers']},
  {h:'Para 2 – Control of Schools ensured Nazi ideas shaped a generation',pts:['All teachers required to join the Nazi Teachers\' League; curriculum rewritten; "Heil Hitler" at start of every lesson','Anti-Semitism and racial hygiene taught as science; history emphasised German greatness and Nazi ideology','Control of Schools meant an entire generation understood Germany\'s history and its enemies through a Nazi lens']},
  {h:'Para 3 – Hitler Youth organisations extended Nazi control beyond school',pts:['1933: all youth groups banned except Nazi ones; Hitler Youth and League of German Maidens became compulsory in 1936','Only 25% attended voluntarily before 1936 – many needed to be compelled; genuine enthusiasm was more limited than it appeared','Compulsory membership ensured Nazi indoctrination continued outside school hours and away from parental influence']}
 ]},

{paper:'p3',type:'12mark',skill:'Explain why',
 q:'Explain why unemployment decreased in Germany in the years 1933–39. (12 marks)\nHints: Rearmament / RAD',
 content:[
  {h:'Para 1 – Rearmament was the most important factor',pts:['Conscription introduced 1935; army grew from 100,000 to 1.3 million by 1939 – hundreds of thousands of direct military jobs','Weapons factories, aircraft plants, shipyards – Rearmament created millions of industrial jobs across Germany','Secretly at first then openly from 1935; Hitler broke the Versailles military restrictions deliberately and publicly']},
  {h:'Para 2 – RAD and public works provided employment',pts:['RAD (National Labour Service): set up 1933; compulsory 6 months from 1935; built roads, planted trees; pay very low','Autobahn programme employed thousands in construction; also a propaganda showcase for German engineering achievement','These programmes genuinely reduced unemployment numbers, though conditions and pay were poor']},
  {h:'Para 3 – Statistics were manipulated to exaggerate the scale of recovery',pts:['Official fall from 6 million to 500,000 overstated the reality – women, Jews and concentration camp prisoners excluded from the count','KdF promised Volkswagen cars to workers who saved; money collected but cars never delivered','Real reduction in unemployment was genuine but the RAD statistics exaggerated how complete and beneficial the recovery was']}
 ]},

{paper:'p3',type:'12mark',skill:'Explain why',
 q:'Explain why the lives of Jewish people in Germany changed in the years 1933–39. (12 marks)\nHints: Nuremberg Laws / Kristallnacht',
 content:[
  {h:'Para 1 – Early discrimination from 1933 showed anti-Semitism was central to Nazism',pts:['April 1933: national boycott of Jewish shops; SA stood outside to intimidate customers; Jews banned from professions','This immediate discrimination showed anti-Semitism was central to Nazism from the very start – not a later development','Propaganda reinforced anti-Semitic stereotypes; books by Jewish authors publicly burned']},
  {h:'Para 2 – Nuremberg Laws 1935 removed legal status',pts:['Stripped Jews of German citizenship; banned from marrying non-Jews; classified as a separate race','Gave legal backing to discrimination that had previously been informal; Jews were now a legally defined inferior category','Clear escalation from social and economic discrimination to full legal persecution – a fundamental change']},
  {h:'Para 3 – Kristallnacht 1938 marked the shift to organised violence',pts:['9–10 November 1938: thousands of synagogues and Jewish businesses destroyed; over 100 killed; 30,000 arrested and sent to camps','Jews fined 1 billion marks for "the damage" – showed complete powerlessness of Jews in Nazi Germany by 1938','Marked shift from legal persecution to organised state violence; a major step on the road to the Holocaust']}
 ]},
