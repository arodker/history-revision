<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr Rodker's Revision Hub - GCSE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f8f7f4;color:#1a1a18;min-height:100vh}
.app{max-width:720px;margin:0 auto;padding:1.5rem 1rem 4rem}
h1{font-family:Arial,Helvetica,sans-serif;font-size:1.55rem;font-weight:600;margin-bottom:.2rem}
.subtitle{font-size:.82rem;color:#6b6b68;margin-bottom:1.75rem}

/* SCREENS */
.screen{display:none}.screen.active{display:block}

/* PAPER PICKER */
.paper-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
.paper-btn{padding:1.4rem 1rem;border:1.5px solid transparent;border-radius:14px;cursor:pointer;font-family:inherit;font-weight:600;font-size:.95rem;text-align:left;transition:all .15s;line-height:1.3}
.paper-btn .plabel{font-size:.72rem;font-weight:500;opacity:.75;display:block;margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.04em}
.pb-p1{background:#E1F5EE;color:#0F6E56;border-color:#1D9E75}
.pb-p2a{background:#E6F1FB;color:#185FA5;border-color:#378ADD}
.pb-p2b{background:#FAEEDA;color:#854F0B;border-color:#BA7517}
.pb-p3{background:#FBEAF0;color:#993556;border-color:#D4537E}
.pb-p1:hover{background:#c8edde}.pb-p2a:hover{background:#cde3f7}
.pb-p2b:hover{background:#f3dfc0}.pb-p3:hover{background:#f4d4e0}

/* MODE PICKER */
.mode-header{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem}
.back-btn{padding:6px 12px;font-size:.8rem;font-weight:500;border:1px solid #ddddd8;border-radius:8px;background:#fff;color:#6b6b68;cursor:pointer;font-family:inherit}
.back-btn:hover{background:#f4f3ef}
.paper-badge{font-size:.8rem;font-weight:600;padding:5px 12px;border-radius:20px}
.bg-p1{background:#E1F5EE;color:#0F6E56}.bg-p2a{background:#E6F1FB;color:#185FA5}
.bg-p2b{background:#FAEEDA;color:#854F0B}.bg-p3{background:#FBEAF0;color:#993556}
.mode-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:1.25rem}
.mode-btn{padding:1.2rem .75rem;border:1.5px solid #ddddd8;border-radius:12px;cursor:pointer;font-family:inherit;font-size:.85rem;font-weight:600;text-align:center;background:#fff;color:#1a1a18;transition:all .15s}
.mode-btn .icon{font-size:1.4rem;display:block;margin-bottom:.4rem}
.mode-btn:hover{border-color:#aaa;background:#fafaf8}
.mode-btn.sel{border-color:#1a1a18;background:#1a1a18;color:#fff}

/* FILTERS */
.filter-row{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
select{padding:8px 10px;font-size:.82rem;border:1px solid #ddddd8;border-radius:8px;background:#fff;color:#1a1a18;cursor:pointer;flex:1;min-width:140px;font-family:inherit}

/* GO BUTTON */
.btn-go{width:100%;padding:13px;font-size:.95rem;font-weight:600;border:none;border-radius:10px;cursor:pointer;margin-bottom:1.25rem;transition:opacity .15s;color:#fff;font-family:inherit}
.btn-go:hover{opacity:.9}
.c-p1{background:#1D9E75}.c-p2a{background:#378ADD}
.c-p2b{background:#BA7517}.c-p3{background:#D4537E}

/* CARD */
.card{background:#fff;border:1px solid #e8e7e2;border-radius:14px;padding:1.25rem;margin-bottom:.75rem;position:relative;overflow:hidden}
.stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
.s-p1{background:#1D9E75}.s-p2a{background:#378ADD}.s-p2b{background:#BA7517}.s-p3{background:#D4537E}
.inner{padding-left:.5rem}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:.6rem}
.tag{font-size:.7rem;font-weight:600;padding:3px 9px;border-radius:20px}
.t-grey{background:#eeede8;color:#5f5e5a}
.t-p1{background:#E1F5EE;color:#0F6E56}.t-p2a{background:#E6F1FB;color:#185FA5}
.t-p2b{background:#FAEEDA;color:#854F0B}.t-p3{background:#FBEAF0;color:#993556}
.card-heading{font-family:'DM Serif Display',serif;font-size:1.05rem;font-weight:400;margin-bottom:.5rem;line-height:1.3}
.card-q{font-size:.88rem;line-height:1.65;white-space:pre-wrap}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:.9rem}
.btn-sm{padding:7px 14px;font-size:.8rem;font-weight:500;border:1px solid #ddddd8;border-radius:8px;background:#fff;color:#1a1a18;cursor:pointer;transition:background .12s;font-family:inherit}
.btn-sm:hover{background:#f4f3ef}

/* REVEAL */
.reveal{display:none;border-top:1px solid #eeede8;margin-top:.9rem;padding-top:.9rem}
.reveal.open{display:block}
.rhead{font-size:.7rem;font-weight:700;color:#6b6b68;text-transform:uppercase;letter-spacing:.06em;margin:.7rem 0 .3rem}
.rhead:first-child{margin-top:0}
.rhead.agree{color:#3B6D11}.rhead.disagree{color:#A32D2D}
.reveal ul{padding-left:1.1rem}
.reveal li{font-size:.84rem;line-height:1.6;color:#1a1a18;margin-bottom:.2rem}
.hint-item{font-size:.82rem;color:#5f5e5a;padding:4px 0;border-bottom:1px solid #eeede8}
.hint-item:last-child{border-bottom:none}
.hint-kw{font-size:.7rem;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:.04em;margin-right:5px}

/* EMPTY */
.empty{padding:2rem;text-align:center;color:#aaa;font-size:.85rem;border:1px dashed #ddddd8;border-radius:12px}

/* QUIZ */
.quiz-prog{height:4px;background:#eeede8;border-radius:2px;margin-bottom:1rem;overflow:hidden}
.quiz-fill{height:100%;border-radius:2px;transition:width .3s}
.fill-p1{background:#1D9E75}.fill-p2a{background:#378ADD}.fill-p2b{background:#BA7517}.fill-p3{background:#D4537E}
.quiz-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem}
.quiz-hdr-l{font-size:.8rem;color:#6b6b68}
.sc-row{display:flex;gap:6px}
.sc{font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:20px}
.sc-c{background:#EAF3DE;color:#3B6D11}.sc-w{background:#FCEBEB;color:#A32D2D}
.quiz-card{background:#fff;border:1px solid #e8e7e2;border-radius:14px;padding:1.5rem;text-align:center;margin-bottom:.75rem}
.quiz-date{font-family:'DM Serif Display',serif;font-size:2.8rem;font-weight:400;margin-bottom:.3rem}
.quiz-prompt{font-size:.82rem;color:#6b6b68;margin-bottom:1.2rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:10px 8px;font-size:.8rem;font-weight:500;border:1.5px solid #ddddd8;border-radius:9px;background:#fff;color:#1a1a18;cursor:pointer;text-align:left;line-height:1.4;transition:all .15s;font-family:inherit}
.opt:hover:not(:disabled){background:#f4f3ef;border-color:#aaa}
.opt:disabled{cursor:default}
.opt.correct{background:#EAF3DE!important;border-color:#3B6D11!important;color:#3B6D11!important}
.opt.wrong{background:#FCEBEB!important;border-color:#A32D2D!important;color:#A32D2D!important}
.opt.show-c{background:#EAF3DE!important;border-color:#3B6D11!important;color:#3B6D11!important;opacity:.8}
.quiz-fb{font-size:.85rem;font-weight:600;padding:8px;border-radius:8px;margin-top:.75rem;display:none;text-align:center}
.fb-c{background:#EAF3DE;color:#3B6D11}.fb-w{background:#FCEBEB;color:#A32D2D}
.quiz-end{text-align:center;padding:2rem 1rem}
.end-score{font-family:'DM Serif Display',serif;font-size:3.5rem;font-weight:400}
.end-sub{font-size:.9rem;color:#6b6b68;margin:.3rem 0 1.2rem}
.end-grade{font-size:.9rem;font-weight:600;padding:8px 20px;border-radius:20px;display:inline-block;margin-bottom:1.2rem}
.grade-a{background:#EAF3DE;color:#3B6D11}.grade-b{background:#FAEEDA;color:#854F0B}.grade-c{background:#FCEBEB;color:#A32D2D}

/* RAPID FIRE QUIZ */
.rq-section{margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid #e8e7e2}
.rq-section-label{font-size:.72rem;font-weight:700;color:#6b6b68;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.6rem}
.rq-paper-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.9rem}
.rq-pill{padding:6px 12px;font-size:.78rem;font-weight:600;border:1.5px solid #ddddd8;border-radius:20px;cursor:pointer;background:#fff;color:#6b6b68;font-family:inherit;transition:all .15s}
.rq-pill.on-p1{background:#E1F5EE;color:#0F6E56;border-color:#1D9E75}
.rq-pill.on-p2a{background:#E6F1FB;color:#185FA5;border-color:#378ADD}
.rq-pill.on-p2b{background:#FAEEDA;color:#854F0B;border-color:#BA7517}
.rq-pill.on-p3{background:#FBEAF0;color:#993556;border-color:#D4537E}
.rq-stars{display:flex;gap:6px;margin-bottom:1rem}
.rq-star{padding:6px 14px;font-size:.82rem;font-weight:600;border:1.5px solid #ddddd8;border-radius:20px;cursor:pointer;background:#fff;color:#6b6b68;font-family:inherit;transition:all .15s}
.rq-star.sel{background:#1a1a18;color:#fff;border-color:#1a1a18}
.rq-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.rq-card{background:#fff;border:1.5px solid #e8e7e2;border-radius:12px;padding:.85rem;cursor:pointer;min-height:90px;display:flex;flex-direction:column;justify-content:space-between;transition:border-color .15s}
.rq-card:hover{border-color:#aaa}
.rq-card.revealed{border-color:#3B6D11;cursor:default}
.rq-q{font-size:.78rem;line-height:1.5;color:#1a1a18;font-weight:500}
.rq-a{display:none;margin-top:.55rem;padding:.45rem .55rem;background:#EAF3DE;border-radius:7px;font-size:.78rem;font-weight:700;color:#3B6D11;line-height:1.4}
.rq-card.revealed .rq-a{display:block}
.rq-tap{font-size:.68rem;color:#bbb;margin-top:.4rem}
.rq-card.revealed .rq-tap{display:none}
.rq-btn-row{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app">
<h1>GCSE History Revision</h1>
<p class="subtitle">Mr Rodker's Revision Hub &mdash; Edexcel GCSE</p>

<!-- SCREEN 1: PAPER PICKER -->
<div class="screen active" id="s-pick">
  <p style="font-size:.85rem;color:#6b6b68;margin-bottom:.9rem">Which paper are you revising?</p>
  <div class="paper-grid">
    <button class="paper-btn pb-p1" onclick="pickPaper('p1')"><span class="plabel">Paper 1</span>🚢 Migrants in Britain</button>
    <button class="paper-btn pb-p2a" onclick="pickPaper('p2a')"><span class="plabel">Paper 2a</span>🚀 Cold War 1941&ndash;91</button>
    <button class="paper-btn pb-p2b" onclick="pickPaper('p2b')"><span class="plabel">Paper 2b</span>👑 Early Elizabethan England</button>
    <button class="paper-btn pb-p3" onclick="pickPaper('p3')"><span class="plabel">Paper 3</span>🏛️ Weimar &amp; Nazi Germany</button>
  </div>
<!-- RAPID FIRE entry point -->
   <div class="rq-section">
    <button class="btn-go" style="background:linear-gradient(135deg,#f59e0b,#ef4444);font-size:1rem;letter-spacing:.01em;margin-bottom:0" onclick="showRapidSetup()">⚡ Rapid Fire — 10 quick-fire questions</button>
  </div>

<!-- SCREEN 2: MODE + CONTENT -->
<div class="screen" id="s-main">
  <div class="mode-header">
    <button class="back-btn" onclick="goBack()">&#8592; Papers</button>
    <span class="paper-badge" id="paper-badge"></span>
  </div>
  <div class="mode-grid">
    <button class="mode-btn" id="mb-knowledge" onclick="setMode('knowledge')"><span class="icon">🧠</span>Knowledge recall</button>
    <button class="mode-btn" id="mb-dates" onclick="setMode('dates')"><span class="icon">📅</span>Key dates quiz</button>
    <button class="mode-btn" id="mb-exam" onclick="setMode('exam')"><span class="icon">✏️</span>Exam practice</button>
  </div>

  <!-- KNOWLEDGE -->
  <div id="mode-knowledge" style="display:none">
    <div class="filter-row">
      <select id="k-unit" onchange="updateCardSelect()"><option value="all">All units</option></select>
      <select id="k-card"><option value="random">Random card</option></select>
    </div>
    <button class="btn-go" id="k-go" onclick="drawKnowledge()">Get a topic to recall</button>
    <div id="k-out"></div>
  </div>

  <!-- DATES -->
  <div id="mode-dates" style="display:none">
    <button class="btn-go" id="d-go" onclick="startQuiz()">Start key dates quiz</button>
    <div id="d-out"></div>
  </div>

  <!-- EXAM -->
  <div id="mode-exam" style="display:none">
    <div class="filter-row">
      <select id="e-type">
        <option value="all">All question types</option>
        <option value="2mark">2-mark describe</option>
        <option value="4mark">4-mark similarity/difference</option>
        <option value="4mark-consequence">4-mark consequence</option>
        <option value="8mark-narrative">8-mark narrative</option>
        <option value="8mark-importance">8-mark importance</option>
        <option value="12mark">12-mark explain why</option>
        <option value="16mark">16-mark debate</option>
      </select>
    </div>
    <button class="btn-go" id="e-go" onclick="drawExam()">Get a random question</button>
    <div id="e-out"></div>
  </div>
</div>

<!-- SCREEN 3: RAPID FIRE -->
<div class="screen" id="s-rapid">
  <div class="mode-header">
    <button class="back-btn" onclick="showScreen('s-pick')">&#8592; Home</button>
    <span style="font-size:.85rem;font-weight:600;color:#5a5a58">⚡ Rapid Fire Quiz</span>
  </div>
  <div id="rq-setup">
    <p class="rq-section-label">Which papers?</p>
    <div class="rq-paper-pills">
      <button class="rq-pill" id="rqp-p1" onclick="toggleRQPaper('p1')">🚢 Migration</button>
      <button class="rq-pill" id="rqp-p2a" onclick="toggleRQPaper('p2a')">🚀 Cold War</button>
      <button class="rq-pill" id="rqp-p2b" onclick="toggleRQPaper('p2b')">👑 Elizabeth I</button>
      <button class="rq-pill" id="rqp-p3" onclick="toggleRQPaper('p3')">🏛️ Weimar &amp; Nazi</button>
    </div>
    <p class="rq-section-label">Difficulty?</p>
        <div class="rq-stars">
      <button class="rq-star sel" id="rqs-1" onclick="setRQDiff(1)">⭐</button>
      <button class="rq-star" id="rqs-2" onclick="setRQDiff(2)">⭐⭐</button>
      <button class="rq-star" id="rqs-3" onclick="setRQDiff(3)">⭐⭐⭐</button>
    </div>
    <button class="btn-go" style="background:#5a5a58" onclick="generateRQ()">Generate 10 questions</button>
    <div id="rq-err" class="empty" style="display:none">Not enough questions match these filters. Try adding more papers or increasing difficulty.</div>
  </div>
  <div id="rq-out" style="display:none">
    <div class="rq-grid" id="rq-grid"></div>
    <div class="rq-btn-row">
      <button class="btn-sm" onclick="generateRQ()">🔄 New 10 questions</button>
      <button class="btn-sm" onclick="document.getElementById('rq-setup').style.display='block';document.getElementById('rq-out').style.display='none'">⚙️ Change settings</button>
    </div>
  </div>
</div>
</div>

<script>
// ═══════════════════════════════════════════
// PAPER CONFIG
// ═══════════════════════════════════════════
const P = {
  p1:  {label:'Paper 1 – Migration',       badge:'bg-p1',  go:'c-p1',  fill:'fill-p1',
        units:['Unit 1 – Medieval','Unit 2 – Early Modern','Unit 3 – 18th & 19th Centuries','Unit 4 – Modern','Unit 5 – Notting Hill'],
        qtypes:[['all','All question types'],['2mark','2-mark describe'],['4mark','4-mark similarity/difference'],['12mark','12-mark explain why'],['16mark','16-mark debate']]},
  p2a: {label:'Paper 2a – Cold War',        badge:'bg-p2a', go:'c-p2a', fill:'fill-p2a',
        units:['Unit 1 – Origins 1941–58','Unit 2 – Crises 1958–70','Unit 3 – End of Cold War 1970–91'],
        qtypes:[['all','All question types'],['4mark-consequence','4-mark consequence'],['8mark-narrative','8-mark narrative'],['8mark-importance','8-mark importance']]},
  p2b: {label:'Paper 2b – Elizabeth I',     badge:'bg-p2b', go:'c-p2b', fill:'fill-p2b',
        units:['Unit 1 – Queen & Religion','Unit 2 – Challenges 1569–88','Unit 3 – Elizabethan Society'],
        qtypes:[['all','All question types'],['2mark','2-mark describe'],['12mark','12-mark explain why'],['16mark','16-mark debate']]},
  p3:  {label:'Paper 3 – Weimar & Nazi',    badge:'bg-p3',  go:'c-p3',  fill:'fill-p3',
        units:['Unit 1 – Weimar Republic','Unit 2 – Hitler\'s Rise','Unit 3 – Nazi Control','Unit 4 – Life in Nazi Germany'],
        qtypes:[['all','All question types'],['12mark','12-mark explain why']]},
};

let currentPaper = 'p1';
let quizPool = [], quizIdx = 0, quizOK = 0, quizBad = 0;

// ═══════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════
function pickPaper(p) {
  currentPaper = p;
  const info = P[p];
  document.getElementById('paper-badge').textContent = info.label;
  document.getElementById('paper-badge').className = 'paper-badge ' + info.badge;
  ['k-go','d-go','e-go'].forEach(id => {
    document.getElementById(id).className = 'btn-go ' + info.go;
  });
  const sel = document.getElementById('k-unit');
  sel.innerHTML = '<option value="all">All units</option>' +
    info.units.map(u => `<option value="${u}">${u}</option>`).join('');
  updateCardSelect();
  const esel = document.getElementById('e-type');
  esel.innerHTML = info.qtypes.map(([v,l]) => `<option value="${v}">${l}</option>`).join('');
  showScreen('s-main');
  setMode('knowledge');
}

function goBack() {
  showScreen('s-pick');
  document.getElementById('d-out').innerHTML = '';
  document.getElementById('k-out').innerHTML = '';
  document.getElementById('e-out').innerHTML = '';
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setMode(m) {
  ['knowledge','dates','exam'].forEach(mode => {
    document.getElementById('mb-' + mode).classList.toggle('sel', mode === m);
    document.getElementById('mode-' + mode).style.display = mode === m ? 'block' : 'none';
  });
  // reset outputs when switching
  document.getElementById('k-out').innerHTML = '';
  document.getElementById('d-out').innerHTML = '';
  document.getElementById('e-out').innerHTML = '';
  document.getElementById('d-go').style.display = 'block';
}

// ═══════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════
function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(a) {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}
function tog(id) { const el = document.getElementById(id); if (el) el.classList.toggle('open'); }
function esc(s) { return s.replace(/'/g, "&#39;").replace(/"/g, "&quot;"); }

function paperTagClass(p) {
  return 't-' + p;
}

// ═══════════════════════════════════════════
// KNOWLEDGE RECALL
// ═══════════════════════════════════════════
function updateCardSelect() {
  const unit = document.getElementById('k-unit').value;
  let pool = KC.filter(c => c.paper === currentPaper);
  if (unit !== 'all') pool = pool.filter(c => c.unit === unit);
  const sel = document.getElementById('k-card');
  sel.innerHTML = '<option value="random">Random card</option>' +
    pool.map((c, i) => `<option value="${i}_${c.heading}">${c.heading}</option>`).join('');
}

function boldHints(text, hints) {
  let out = text;
  hints.forEach(h => {
    // escape special regex chars
    const escaped = h.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(' + escaped + ')', 'gi');
    out = out.replace(re, '<strong>$1</strong>');
  });
  return out;
}

function drawKnowledge() {
  const unit = document.getElementById('k-unit').value;
  const cardSel = document.getElementById('k-card').value;
  let pool = KC.filter(c => c.paper === currentPaper);
  if (unit !== 'all') pool = pool.filter(c => c.unit === unit);
  if (!pool.length) {
    document.getElementById('k-out').innerHTML = '<div class="empty">No cards match these filters.</div>';
    return;
  }
  let card;
  if (cardSel === 'random') {
    card = rand(pool);
  } else {
    const heading = cardSel.split('_').slice(1).join('_');
    card = pool.find(c => c.heading === heading) || rand(pool);
  }
  const hintsHtml = card.hints.map(h =>
    `<div class="hint-item"><span class="hint-kw">hint</span>${h}</div>`
  ).join('');
  const factsHtml = '<ul>' + card.facts.map(f =>
    `<li>${boldHints(f, card.hints)}</li>`
  ).join('') + '</ul>';
  document.getElementById('k-out').innerHTML = `
    <div class="card">
      <div class="stripe s-${card.paper}"></div>
      <div class="inner">
        <div class="meta">
          <span class="tag t-${card.paper}">${card.unit}</span>
        </div>
        <div class="card-heading">${card.heading}</div>
        <p style="font-size:.82rem;color:#6b6b68;margin-bottom:.75rem">Can you recall 3–5 key points about this topic?</p>
        <div class="btn-row">
          <button class="btn-sm" onclick="tog('kh')">Show hints</button>
          <button class="btn-sm" onclick="tog('kf')">Reveal key content</button>
        </div>
        <div class="reveal" id="kh">${hintsHtml}</div>
        <div class="reveal" id="kf">${factsHtml}</div>
      </div>
    </div>`;
}
// ═══════════════════════════════════════════
// RAPID FIRE DATA (sample — expand with full PDF data)

// ── Rapid Fire state ──
let rqPapers = {p1:false, p2a:false, p2b:false, p3:false};
let rqDiff = 1;

function showRapidSetup() {
  showScreen('s-rapid');
  document.getElementById('rq-setup').style.display = 'block';
  document.getElementById('rq-out').style.display = 'none';
  document.getElementById('rq-err').style.display = 'none';
}

function toggleRQPaper(p) {
  rqPapers[p] = !rqPapers[p];
  const btn = document.getElementById('rqp-' + p);
  if (rqPapers[p]) {
    btn.classList.add('on-' + p);
  } else {
    btn.classList.remove('on-' + p);
  }
}

function setRQDiff(n) {
  rqDiff = n;
  [1,2,3].forEach(i => {
    document.getElementById('rqs-' + i).classList.toggle('sel', i === n);
  });
}

function generateRQ() {
  const activePapers = Object.keys(rqPapers).filter(p => rqPapers[p]);
  if (!activePapers.length) {
    document.getElementById('rq-err').style.display = 'block';
    document.getElementById('rq-err').textContent = 'Please select at least one paper.';
    return;
  }
  const allowed = rqDiff === 1 ? ['easy'] : rqDiff === 2 ? ['easy','medium'] : ['easy','medium','hard'];
  let pool = RQ.filter(q => activePapers.includes(q.paper) && allowed.includes(q.d));
  if (pool.length < 10) {
    document.getElementById('rq-err').style.display = 'block';
    document.getElementById('rq-err').textContent = 'Not enough questions match these filters. Try adding more papers or increasing difficulty.';
    return;
  }
  document.getElementById('rq-err').style.display = 'none';
  const ten = shuffle(pool).slice(0, 10);
  const grid = document.getElementById('rq-grid');
  grid.innerHTML = ten.map((q, i) => `
    <div class="rq-card" id="rqc${i}" onclick="revealRQ(${i})">
      <div class="rq-q">${i+1}. ${q.q} <span style="font-size:.65rem;opacity:.5">${q.d==='easy'?'⭐':q.d==='medium'?'⭐⭐':'⭐⭐⭐'}</span></div>
      <div class="rq-a">${q.a}</div>
      <div class="rq-tap">Tap to reveal</div>
    </div>`).join('');
  document.getElementById('rq-setup').style.display = 'none';
  document.getElementById('rq-out').style.display = 'block';
}

function revealRQ(i) {
  document.getElementById('rqc' + i).classList.add('revealed');
}

function drawExam() {
  const type = document.getElementById('e-type').value;
  let pool = EQ.filter(q => q.paper === currentPaper);
  if (type !== 'all') pool = pool.filter(q => q.type === type);
  if (!pool.length) {
    document.getElementById('e-out').innerHTML = '<div class="empty">No questions match these filters.</div>';
    return;
  }
  const q = rand(pool);
  const typeLabel = {
    '2mark': '2-mark describe',
    '4mark': '4-mark similarity/difference',
    '4mark-consequence': '4-mark consequence',
    '8mark-narrative': '8-mark narrative',
    '8mark-importance': '8-mark importance',
    '12mark': '12-mark explain why',
    '16mark': '16-mark debate'
  }[q.type] || q.type;

  let contentHtml = '';
  if (q.type === '16mark') {
    const agreeItems = q.content.filter(p => p.agree === true);
    const disagreeItems = q.content.filter(p => p.agree === false);
    agreeItems.forEach(p => {
      contentHtml += `<div class="rhead agree">✓ Agree – ${p.h}</div><ul>${p.pts.map(pt => `<li>${pt}</li>`).join('')}</ul>`;
    });
    disagreeItems.forEach((p, i) => {
      contentHtml += `<div class="rhead disagree">✗ Disagree ${['A','B'][i]} – ${p.h}</div><ul>${p.pts.map(pt => `<li>${pt}</li>`).join('')}</ul>`;
    });
  } else {
    q.content.forEach(p => {
      contentHtml += `<div class="rhead">${p.h}</div><ul>${p.pts.map(pt => `<li>${pt}</li>`).join('')}</ul>`;
    });
  }

  document.getElementById('e-out').innerHTML = `
    <div class="card">
      <div class="stripe s-${q.paper}"></div>
      <div class="inner">
        <div class="meta">
          <span class="tag t-grey">${typeLabel}</span>
        </div>
        <div class="card-q">${q.q}</div>
        <div class="btn-row">
          <button class="btn-sm" onclick="tog('er')">Show indicative content</button>
        </div>
        <div class="reveal" id="er">${contentHtml}</div>
      </div>
    </div>`;
}

function startQuiz() {
  const pool = DATES.filter(d => d.paper === currentPaper);
  if (!pool.length) {
    document.getElementById('d-out').innerHTML = '<div class="empty">No dates for this paper.</div>';
    return;
  }
  quizPool = shuffle([...pool]).slice(0, Math.min(pool.length, 15));
  quizIdx = 0; quizOK = 0; quizBad = 0;
  document.getElementById('d-go').style.display = 'none';
  renderQ();
}

function renderQ() {
  if (quizIdx >= quizPool.length) { showQuizEnd(); return; }
  const item = quizPool[quizIdx];
  const total = quizPool.length;
  const pct = Math.round((quizIdx / total) * 100);
  const others = shuffle(DATES.filter(d => d.paper === currentPaper && d.event !== item.event)).slice(0, 3).map(d => d.event);
  const opts = shuffle([item.event, ...others]);
  const optsHtml = opts.map((o, i) =>
    `<button class="opt" id="opt${i}" data-val="${esc(o)}" data-correct="${esc(item.event)}" onclick="checkAns(this)">${o}</button>`
  ).join('');
  document.getElementById('d-out').innerHTML = `
    <div class="quiz-prog"><div class="quiz-fill ${P[currentPaper].fill}" style="width:${pct}%"></div></div>
    <div class="quiz-hdr">
      <span class="quiz-hdr-l">Question ${quizIdx + 1} of ${total}</span>
      <div class="sc-row"><span class="sc sc-c">✓ ${quizOK}</span><span class="sc sc-w">✗ ${quizBad}</span></div>
    </div>
    <div class="quiz-card">
      <div class="quiz-date">${item.date}</div>
      <div class="quiz-prompt">What happened?</div>
      <div class="opts">${optsHtml}</div>
      <div class="quiz-fb" id="qfb"></div>
    </div>`;
}

function checkAns(btn) {
  const chosen = btn.dataset.val;
  const correct = btn.dataset.correct;
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);
  const fb = document.getElementById('qfb');
  if (chosen === correct) {
    quizOK++;
    btn.classList.add('correct');
    fb.textContent = 'Correct!';
    fb.className = 'quiz-fb fb-c';
  } else {
    quizBad++;
    btn.classList.add('wrong');
    fb.textContent = 'Not quite , correct answer highlighted.';
    fb.className = 'quiz-fb fb-w';
    document.querySelectorAll('.opt').forEach(b => {
      if (b.dataset.val === correct) b.classList.add('show-c');
    });
  }
  fb.style.display = 'block';
  setTimeout(() => { quizIdx++; renderQ(); }, 1700);
}

function showQuizEnd() {
  const total = quizPool.length;
  const pct = Math.round((quizOK / total) * 100);
  const [grade, cls] = pct >= 80 ? ['Excellent work!', 'grade-a'] : pct >= 60 ? ['Good effort', 'grade-b'] : ['Keep revising', 'grade-c'];
  document.getElementById('d-out').innerHTML = `
    <div class="quiz-end">
      <div class="end-score">${quizOK}/${total}</div>
      <div class="end-sub">${pct}% correct</div>
      <div class="end-grade ${cls}">${grade}</div><br>
      <button class="btn-sm" style="margin:0 auto;display:block" onclick="document.getElementById('d-out').innerHTML=''">Try again</button>
    </div>`;
  const go = document.getElementById('d-go');
  go.style.display = 'block';
  go.textContent = 'New quiz';
}

{paper:'p1',unit:'Unit 1 – Medieval',heading:'Flemish weavers and Hansa merchants',
