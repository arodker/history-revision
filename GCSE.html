}


</script>
<!-- EXAM FULLSCREEN OVERLAY -->
<div id="exam-fullscreen" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:9999;padding:2rem max(1.5rem,calc((100vw - 46rem)/2));overflow-y:auto">
  <span id="fs-type" style="display:block;font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:1rem"></span>
  <div class="fs-timer" id="fs-timer">00:00</div>
  <div class="fs-bar"><div class="fs-bar-fill" id="fs-bar-fill" style="width:100%"></div></div>

  <!-- Pre-start state: blurred question + ready button -->
  <div id="fs-pre">
    <div class="fs-q fs-blurred" id="fs-q-blur" style="margin-top:1rem"></div>
    <div style="text-align:center;margin-top:1.5rem">
      <div style="font-size:.8rem;color:var(--muted);margin-bottom:.75rem">Question hidden — press to begin</div>
      <button id="fs-start-btn" style="padding:10px 28px;font-size:.85rem;font-weight:600;border:1.5px solid;border-radius:10px;cursor:pointer;font-family:inherit">I'm ready</button>
    </div>
  </div>

  <!-- Active state: clear question -->
  <div id="fs-active" style="display:none">
    <div class="fs-q" id="fs-q" style="margin-top:1rem"></div>
    <div class="fs-hints" id="fs-hints" style="margin-top:.5rem"></div>
  </div>

  <!-- Always-visible exit at bottom -->
  <div style="text-align:center;margin-top:2rem">
    <button id="fs-exit-btn" style="padding:10px 24px;font-size:.85rem;border:1px solid var(--border2);border-radius:8px;background:var(--surface);color:var(--muted);cursor:pointer;font-family:inherit">✕ Exit fullscreen</button>
  </div>
</div>
</body>
</html>
