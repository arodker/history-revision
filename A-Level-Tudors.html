<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Level Tudors – Mr Rodker's Revision Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>

/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Source Serif 4', Georgia, serif;
  background: #faf9f6;
  color: #1c1a16;
  min-height: 100vh;
}
.app {
  max-width: 740px;
  margin: 0 auto;
  padding: 1.5rem 1rem 5rem;
}

/* ── Typography ── */
h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.65rem;
  font-weight: 600;
  letter-spacing: -.01em;
  margin-bottom: .15rem;
}
.subtitle {
  font-size: .78rem;
  color: #7a7060;
  text-transform: uppercase;
  letter-spacing: .05em;
  margin-bottom: 1.75rem;
}

/* ── Screens ── */
.screen { display: none; }
.screen.active { display: block; }

/* ── Reign Colours ── */
/* Mid Tudor Crisis – purple, Edward – blue, Mary – red, Elizabeth – green */
.mtc-bg        { background: #F3EEFB; }
.mtc-col       { color: #5B1B9A; }
.mtc-bdr       { border-color: #A96BE8; }
.edward-bg     { background: #EEF3FB; }
.edward-col    { color: #1B4B9A; }
.edward-bdr    { border-color: #6B9DE8; }
.mary-bg       { background: #FBF0EE; }
.mary-col      { color: #9A1B1B; }
.mary-bdr      { border-color: #E87A6B; }
.elizabeth-bg  { background: #EEF8F2; }
.elizabeth-col { color: #1B6B3A; }
.elizabeth-bdr { border-color: #6BE8A0; }

/* ── Reign Picker ── */
.reign-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 1.2rem;
}
.reign-btn {
  padding: 1.4rem 1rem;
  border: 1.5px solid transparent;
  border-radius: 14px;
  cursor: pointer;
  font-family: 'Playfair Display', serif;
  font-size: .95rem;
  text-align: left;
  line-height: 1.35;
  transition: opacity .15s;
}
.reign-btn:hover { opacity: .85; }
.reign-btn .rlabel {
  font-family: 'Source Serif 4', serif;
  font-size: .67rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .06em;
  display: block;
  margin-bottom: .3rem;
  opacity: .65;
}
.reign-btn .reign-dots { margin-top: .4rem; display: flex; gap: 5px; }
.reign-dot-sm {
  width: 8px; height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.rb-mtc       { background: #F3EEFB; color: #5B1B9A; border-color: #A96BE8; }
.rb-elizabeth { background: #EEF8F2; color: #1B6B3A; border-color: #6BE8A0; }

/* ── Home extras ── */
.home-divider {
  border: none;
  border-top: 1px solid #e4e3dc;
  margin: 1.2rem 0;
}
.home-label {
  font-size: .7rem;
  font-weight: 700;
  color: #7a7060;
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: .6rem;
}

/* ── Mode header (back btn + badge) ── */
.mode-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 1.25rem;
}
.back-btn {
  padding: 6px 12px;
  font-size: .78rem;
  font-weight: 700;
  border: 1px solid #ddddd4;
  border-radius: 8px;
  background: #fff;
  color: #7a7060;
  cursor: pointer;
  font-family: inherit;
}
.back-btn:hover { background: #f4f3ef; }

.reign-badge {
  font-family: 'Source Serif 4', serif;
  font-size: .78rem;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 20px;
}

/* ── Mode picker tabs ── */
.mode-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 1.25rem;
}
.mode-btn {
  padding: 1.1rem .75rem;
  border: 1.5px solid #ddddd4;
  border-radius: 12px;
  cursor: pointer;
  font-family: inherit;
  font-size: .82rem;
  font-weight: 700;
  text-align: center;
  background: #fff;
  color: #1c1a16;
  transition: all .15s;
}
.mode-btn .icon { font-size: 1.3rem; display: block; margin-bottom: .35rem; }
.mode-btn:hover { border-color: #aaa9a0; background: #faf9f6; }
.mode-btn.sel   { border-color: #1c1a16; background: #1c1a16; color: #fff; }

/* ── Generic buttons ── */
.btn-go {
  width: 100%;
  padding: 12px;
  font-size: .92rem;
  font-weight: 700;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  margin-bottom: 1rem;
  color: #fff;
  font-family: inherit;
  transition: opacity .15s;
}
.btn-go:hover { opacity: .88; }
.btn-go.dark         { background: #1c1a16; }
.btn-go.mtc-go       { background: #7B3FC8; }
.btn-go.edward-go    { background: #2A6BC8; }
.btn-go.mary-go      { background: #C82A2A; }
.btn-go.elizabeth-go { background: #2A8C4A; }

.btn-sm {
  padding: 7px 13px;
  font-size: .78rem;
  font-weight: 700;
  border: 1px solid #ddddd4;
  border-radius: 8px;
  background: #fff;
  color: #1c1a16;
  cursor: pointer;
  font-family: inherit;
  transition: background .12s;
}
.btn-sm:hover { background: #f4f3ef; }
.btn-sm.muted { background: #eeede5; border-color: #ddddd4; }
.btn-sm.green { background: #e8f5e0; color: #2E6B0E; border-color: #2E6B0E; }

/* ── Tags ── */
.tag {
  font-size: .67rem;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 20px;
  letter-spacing: .03em;
  display: inline-block;
}
.tag-grey      { background: #eeede5; color: #6a6860; }
.tag-mtc       { background: #F3EEFB; color: #5B1B9A; }
.tag-edward    { background: #EEF3FB; color: #1B4B9A; }
.tag-mary      { background: #FBF0EE; color: #9A1B1B; }
.tag-elizabeth { background: #EEF8F2; color: #1B6B3A; }
.tag-amber     { background: #FEF9E7; color: #7a4e00; border: 1px solid #F0B429; }

/* ── Cards ── */
.card {
  background: #fff;
  border: 1px solid #e4e3dc;
  border-radius: 14px;
  padding: 1.25rem;
  margin-bottom: .75rem;
  position: relative;
  overflow: hidden;
}
.card-stripe {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  border-radius: 4px 0 0 4px;
}
.card-inner { padding-left: .5rem; }
.card-meta  { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: .6rem; }
.card-heading {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem;
  font-weight: 400;
  margin-bottom: .5rem;
  line-height: 1.35;
}
.card-prompt {
  font-size: .81rem;
  color: #7a7060;
  font-style: italic;
  margin-bottom: .75rem;
}
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: .9rem; }

/* ── Reveal panels ── */
.reveal {
  display: none;
  border-top: 1px solid #eeede5;
  margin-top: .9rem;
  padding-top: .9rem;
}
.reveal.open { display: block; }
.reveal ul   { padding-left: 1.1rem; }
.reveal li   { font-size: .84rem; line-height: 1.65; margin-bottom: .2rem; }
.hint-chips  { display: flex; flex-wrap: wrap; gap: 5px; padding: .4rem 0; }

/* ── Exam route picker ── */
.exam-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 1.25rem;
}
.exam-route-btn {
  padding: 1.2rem 1rem;
  border: 1.5px solid #ddddd4;
  border-radius: 12px;
  cursor: pointer;
  font-family: inherit;
  font-size: .84rem;
  font-weight: 700;
  text-align: left;
  background: #fff;
  color: #1c1a16;
  line-height: 1.4;
  transition: all .15s;
}
.exam-route-btn .er-label {
  font-size: .67rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .05em;
  display: block;
  margin-bottom: .3rem;
  opacity: .55;
}
.exam-route-btn:hover:not(.disabled) { border-color: #aaa; background: #faf9f6; }
.exam-route-btn.source { border-color: #B87020; color: #7a4e00; }
.exam-route-btn.essay  { border-color: #1B6B3A; color: #1B6B3A; }
.exam-route-btn.disabled { opacity: .35; cursor: default; pointer-events: none; }

/* ── Source sets ── */
.source-set-card {
  background: #fff;
  border: 1px solid #e4e3dc;
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: .75rem;
}
.source-set-header {
  padding: 1rem 1.25rem;
  border-bottom: 1px solid #e4e3dc;
  background: #faf9f6;
}
.source-set-q {
  font-family: 'Playfair Display', serif;
  font-size: 1rem;
  font-weight: 600;
  line-height: 1.4;
  margin-bottom: .4rem;
}
.source-set-meta { font-size: .74rem; color: #7a7060; }
.source-body     { padding: 1rem 1.25rem; }
.source-item {
  border: 1px solid #e4e3dc;
  border-radius: 9px;
  padding: .85rem 1rem;
  margin-bottom: .75rem;
  background: #fff;
}
.source-item-hdr  { font-size: .76rem; font-weight: 700; margin-bottom: .2rem; }
.source-item-prov { font-size: .72rem; color: #7a7060; font-style: italic; margin-bottom: .55rem; }
.source-item-text { font-size: .82rem; line-height: 1.7; }
.approach-box {
  background: #faf9f6;
  border: 1px solid #e4e3dc;
  border-radius: 9px;
  padding: .85rem 1rem;
  margin-top: .75rem;
  display: none;
}
.approach-box.open { display: block; }
.approach-title {
  font-size: .68rem;
  font-weight: 700;
  color: #7a7060;
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: .5rem;
}
.approach-list { list-style: none; padding: 0; }
.approach-list li {
  font-size: .8rem;
  line-height: 1.6;
  padding: .25rem 0;
  border-bottom: 1px solid #e4e3dc;
  display: flex;
  gap: .5rem;
}
.approach-list li:last-child { border-bottom: none; }
.approach-list li::before { content: '→'; color: #7a7060; flex-shrink: 0; font-weight: 700; }

/* ── Essay cards ── */
.essay-card {
  background: #fff;
  border: 1px solid #e4e3dc;
  border-radius: 14px;
  padding: 1.25rem;
  margin-bottom: .75rem;
}
.essay-q {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem;
  font-weight: 400;
  line-height: 1.45;
  margin-bottom: .6rem;
}
.essay-meta { font-size: .74rem; color: #7a7060; margin-bottom: .75rem; }
.essay-struct {
  background: #EEF8F2;
  border-radius: 8px;
  padding: .85rem 1rem;
  margin-top: .75rem;
  display: none;
}
.essay-struct.open { display: block; }
.essay-struct-title {
  font-size: .68rem;
  font-weight: 700;
  color: #1B6B3A;
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: .6rem;
}
.essay-struct table { width: 100%; border-collapse: collapse; font-size: .8rem; }
.essay-struct td { padding: .35rem .5rem; border-bottom: 1px solid #d4edde; vertical-align: top; }
.essay-struct td:first-child { font-weight: 700; color: #1B6B3A; white-space: nowrap; padding-right: .75rem; }
.essay-struct tr:last-child td { border-bottom: none; }

/* ── Date quiz ── */
.quiz-prog { height: 3px; background: #e4e3dc; border-radius: 2px; margin-bottom: 1rem; overflow: hidden; }
.quiz-fill { height: 100%; border-radius: 2px; transition: width .3s; }
.fill-mtc       { background: #7B3FC8; }
.fill-edward    { background: #2A6BC8; }
.fill-mary      { background: #C82A2A; }
.fill-elizabeth { background: #2A8C4A; }

.quiz-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: .75rem; }
.quiz-hdr-l { font-size: .78rem; color: #7a7060; }
.sc-row { display: flex; gap: 6px; }
.sc { font-size: .78rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
.sc-c { background: #e8f5e0; color: #2E6B0E; }
.sc-w { background: #fce8e8; color: #9A1B1B; }

.quiz-card {
  background: #fff;
  border: 1px solid #e4e3dc;
  border-radius: 14px;
  padding: 1.5rem;
  text-align: center;
  margin-bottom: .75rem;
}
.quiz-date {
  font-family: 'Playfair Display', serif;
  font-size: 2.8rem;
  font-weight: 400;
  margin-bottom: .3rem;
  letter-spacing: -.02em;
}
.quiz-prompt { font-size: .8rem; color: #7a7060; margin-bottom: 1.2rem; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt {
  padding: 10px 8px;
  font-size: .79rem;
  font-weight: 600;
  border: 1.5px solid #ddddd4;
  border-radius: 9px;
  background: #fff;
  color: #1c1a16;
  cursor: pointer;
  text-align: left;
  line-height: 1.4;
  font-family: inherit;
  transition: all .15s;
}
.opt:hover:not(:disabled) { background: #f4f3ef; border-color: #aaa; }
.opt:disabled { cursor: default; }
.opt.correct { background: #e8f5e0 !important; border-color: #2E6B0E !important; color: #2E6B0E !important; }
.opt.wrong   { background: #fce8e8 !important; border-color: #9A1B1B !important; color: #9A1B1B !important; }
.opt.show-c  { background: #e8f5e0 !important; border-color: #2E6B0E !important; color: #2E6B0E !important; opacity: .8; }
.quiz-fb {
  font-size: .84rem;
  font-weight: 700;
  padding: 8px;
  border-radius: 8px;
  margin-top: .75rem;
  display: none;
  text-align: center;
}
.fb-c { background: #e8f5e0; color: #2E6B0E; }
.fb-w { background: #fce8e8; color: #9A1B1B; }

.quiz-end { text-align: center; padding: 2rem 1rem; }
.end-score {
  font-family: 'Playfair Display', serif;
  font-size: 3.5rem;
  font-weight: 400;
}
.end-sub { font-size: .88rem; color: #7a7060; margin: .3rem 0 1.2rem; font-style: italic; }
.end-grade { font-size: .88rem; font-weight: 700; padding: 7px 18px; border-radius: 20px; display: inline-block; margin-bottom: 1.2rem; }
.grade-a { background: #e8f5e0; color: #2E6B0E; }
.grade-b { background: #fff4df; color: #7a4e00; }
.grade-c { background: #fce8e8; color: #9A1B1B; }

/* ── Rapid fire ── */
.rq-label { font-size: .7rem; font-weight: 700; color: #7a7060; text-transform: uppercase; letter-spacing: .06em; margin-bottom: .6rem; }
.pill-row  { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: .9rem; }
.pill {
  padding: 6px 12px;
  font-size: .76rem;
  font-weight: 700;
  border: 1.5px solid #ddddd4;
  border-radius: 20px;
  cursor: pointer;
  background: #fff;
  color: #7a7060;
  font-family: inherit;
  transition: all .15s;
}
.pill.on-edward    { background: #EEF3FB; color: #1B4B9A; border-color: #6B9DE8; }
.pill.on-mary      { background: #FBF0EE; color: #9A1B1B; border-color: #E87A6B; }
.pill.on-elizabeth { background: #EEF8F2; color: #1B6B3A; border-color: #6BE8A0; }
.pill.on           { background: #1c1a16; color: #fff; border-color: #1c1a16; }

/* ── Count selector (rapid fire) ── */
.count-row { display: flex; gap: 8px; margin-bottom: .9rem; }
.count-btn {
  flex: 1;
  padding: 10px 8px;
  font-size: .88rem;
  font-weight: 700;
  border: 1.5px solid #ddddd4;
  border-radius: 10px;
  cursor: pointer;
  background: #fff;
  color: #1c1a16;
  font-family: inherit;
  text-align: center;
  transition: all .15s;
}
.count-btn:hover { border-color: #aaa; background: #f4f3ef; }
.count-btn.sel   { background: #1c1a16; color: #fff; border-color: #1c1a16; }

.rq-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
.rq-card {
  background: #fff;
  border: 1.5px solid #e4e3dc;
  border-radius: 12px;
  padding: .85rem;
  cursor: pointer;
  min-height: 90px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: border-color .15s;
}
.rq-card:hover   { border-color: #aaa; }
.rq-card.revealed { border-color: #2E6B0E; cursor: default; }
.rq-q { font-size: .77rem; line-height: 1.5; font-weight: 600; }
.rq-a {
  display: none;
  margin-top: .5rem;
  padding: .4rem .5rem;
  background: #e8f5e0;
  border-radius: 7px;
  font-size: .77rem;
  font-weight: 700;
  color: #2E6B0E;
  line-height: 1.4;
}
.rq-card.revealed .rq-a  { display: block; }
.rq-tap { font-size: .66rem; color: #ccc; margin-top: .4rem; }
.rq-card.revealed .rq-tap { display: none; }
.rq-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 4px;
  vertical-align: middle;
  flex-shrink: 0;
}
.dot-edward    { background: #6B9DE8; }
.dot-mary      { background: #E87A6B; }
.dot-elizabeth { background: #6BE8A0; }

/* ── Progress bar ── */
.prog-wrap { margin-bottom: .75rem; display: none; }
.prog-text { font-size: .73rem; color: #7a7060; margin-bottom: 4px; }
.prog-bg   { background: #e5e4dc; border-radius: 99px; height: 5px; }
.prog-fill { height: 5px; border-radius: 99px; background: #2A8C4A; transition: width .3s; }

/* ── Flag bar ── */
.flag-bar { display: none; gap: 8px; align-items: center; margin-bottom: .75rem; }

/* ── Misc ── */
.empty {
  padding: 2rem;
  text-align: center;
  color: #aaa8a0;
  font-size: .85rem;
  border: 1px dashed #ddddd4;
  border-radius: 12px;
  font-style: italic;
}
.filter-row { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
select {
  padding: 8px 10px;
  font-size: .8rem;
  border: 1px solid #ddddd4;
  border-radius: 8px;
  background: #fff;
  color: #1c1a16;
  cursor: pointer;
  flex: 1;
  min-width: 140px;
  font-family: inherit;
}
.nav-row { display: flex; gap: 8px; margin-bottom: .75rem; margin-top: -.4rem; }
.nav-row .btn-sm { flex: 1; padding: 9px; text-align: center; font-size: .84rem; }
.nav-num { flex: 0 0 auto; align-self: center; font-size: .76rem; color: #7a7060; white-space: nowrap; min-width: 50px; text-align: center; }

</style>
</head>
<body>
<div class="app">

  <!-- ── Header ── -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.2rem">
    <h1>A Level History</h1>
    <a href="index.html" style="font-size:.74rem;font-weight:700;padding:6px 12px;border:1px solid #ddddd4;border-radius:8px;background:#fff;color:#7a7060;text-decoration:none;font-family:inherit">← Hub</a>
  </div>
  <p class="subtitle">Mr Rodker's Revision Hub &mdash; OCR Y107 · England 1547–1603</p>

  <!-- ══════════════════════════════════════════ -->
  <!-- SCREEN 1: HOME / REIGN PICKER             -->
  <!-- ══════════════════════════════════════════ -->
  <div class="screen active" id="s-home">
    <p style="font-size:.85rem;color:#7a7060;margin-bottom:.9rem;font-style:italic">Choose a section to revise:</p>
    <div class="reign-grid">
      <button class="reign-btn rb-mtc" onclick="pickReign('mtc')">
        <span class="rlabel">1547–1558</span>
        ⚔️ Mid Tudor Crisis
        <div class="reign-dots">
          <span class="reign-dot-sm" style="background:#6B9DE8"></span>
          <span class="reign-dot-sm" style="background:#E87A6B"></span>
        </div>
      </button>
      <button class="reign-btn rb-elizabeth" onclick="pickReign('elizabeth')">
        <span class="rlabel">1558–1603</span>
        ⚜️ Elizabeth I
      </button>
    </div>

    <hr class="home-divider">
    <p class="home-label">Or jump straight to:</p>
    <button class="btn-go dark" onclick="showRapid()">⚡ Rapid Fire — all reigns mixed</button>
    <button class="btn-go" id="home-flag-btn" style="background:#eeede5;color:#1c1a16;display:none"
            onclick="goFlagged()">🚩 Flagged cards (<span id="home-flag-num">0</span>)</button>
  </div>

  <!-- ══════════════════════════════════════════ -->
  <!-- SCREEN 2: REIGN → 3 MODE TABS             -->
  <!-- ══════════════════════════════════════════ -->
  <div class="screen" id="s-main">
    <div class="mode-header">
      <button class="back-btn" onclick="goHome()">🏠 Home</button>
      <span class="reign-badge" id="reign-badge"></span>
    </div>

    <div class="mode-grid">
      <button class="mode-btn" id="mb-knowledge" onclick="setMode('knowledge')">
        <span class="icon">🧠</span>Knowledge Builder
      </button>
      <button class="mode-btn" id="mb-dates" onclick="setMode('dates')">
        <span class="icon">📅</span>Key Dates
      </button>
      <button class="mode-btn" id="mb-exam" onclick="setMode('exam')">
        <span class="icon">✏️</span>Exam Practice
      </button>
    </div>

    <!-- Knowledge Builder panel -->
    <div id="panel-knowledge" style="display:none">
      <div class="filter-row">
        <select id="k-unit" onchange="onUnitChange()"><option value="all">All units</option></select>
        <select id="k-card-sel" onchange="jumpToCard()"></select>
      </div>
      <button class="btn-go" id="k-random-btn" onclick="drawRandom()">🔀 Random card</button>
      <div class="nav-row">
        <button class="btn-sm" onclick="stepCard(-1)">← Prev</button>
        <span class="nav-num" id="k-card-num"></span>
        <button class="btn-sm" onclick="stepCard(1)">Next →</button>
      </div>
      <div class="prog-wrap" id="k-prog-wrap">
        <div class="prog-text" id="k-prog-text"></div>
        <div class="prog-bg"><div class="prog-fill" id="k-prog-fill"></div></div>
      </div>
      <div class="flag-bar" id="k-flag-bar">
        <span style="font-size:.8rem;color:#7a7060">🚩 <span id="k-flag-num">0</span> flagged</span>
        <button class="btn-sm muted" onclick="showFlagged()">Review</button>
        <button class="btn-sm muted" onclick="clearFlagged()">Clear</button>
      </div>
      <div id="k-out"></div>
    </div>

    <!-- Key Dates panel -->
    <div id="panel-dates" style="display:none">
      <button class="btn-go" id="d-start-btn" onclick="startDateQuiz()">📅 Start key dates quiz</button>
      <div id="d-out"></div>
    </div>

    <!-- Exam Practice panel -->
    <div id="panel-exam" style="display:none">
      <div id="exam-pick">
        <p style="font-size:.84rem;color:#7a7060;margin-bottom:.9rem;font-style:italic" id="exam-intro"></p>
        <div class="exam-grid" id="exam-grid"></div>
      </div>
      <div id="exam-source" style="display:none">
        <div style="display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap">
          <button class="btn-go" style="margin-bottom:0;flex:1;background:#7a5c3a" onclick="drawSource()">🔀 New source set</button>
          <button class="btn-sm" onclick="stepSource(-1)" style="padding:10px 14px">←</button>
          <button class="btn-sm" onclick="stepSource(1)"  style="padding:10px 14px">→</button>
        </div>
        <div id="source-out"></div>
        <button class="btn-sm muted" style="margin-top:.5rem" onclick="backToExam()">← Back</button>
      </div>
      <div id="exam-essay" style="display:none">
        <button class="btn-go elizabeth-go" onclick="drawEssay()">🔀 Random 20-marker</button>
        <div id="essay-out"></div>
        <button class="btn-sm muted" style="margin-top:.5rem" onclick="backToExam()">← Back</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════ -->
  <!-- SCREEN 3: RAPID FIRE                      -->
  <!-- ══════════════════════════════════════════ -->
  <div class="screen" id="s-rapid">
    <div class="mode-header">
      <button class="back-btn" onclick="showScreen('s-home')">← Home</button>
      <span style="font-size:.84rem;font-weight:700;color:#5a584e">⚡ Rapid Fire</span>
    </div>
    <div id="rq-setup">
      <p class="rq-label">Which reigns?</p>
      <div class="pill-row">
        <button class="pill on-edward"    id="rqp-edward"    onclick="toggleReign('edward')">👑 Edward VI</button>
        <button class="pill on-mary"      id="rqp-mary"      onclick="toggleReign('mary')">🔥 Mary I</button>
        <button class="pill on-elizabeth" id="rqp-elizabeth" onclick="toggleReign('elizabeth')">⚜️ Elizabeth I</button>
      </div>
      <p class="rq-label">How many questions?</p>
      <div class="count-row">
        <button class="count-btn" id="cnt-5"  onclick="setCount(5)">5</button>
        <button class="count-btn sel" id="cnt-10" onclick="setCount(10)">10</button>
        <button class="count-btn" id="cnt-15" onclick="setCount(15)">15</button>
      </div>
      <button class="btn-go dark" onclick="generateRQ()">⚡ Generate questions</button>
    </div>
    <div id="rq-out" style="display:none">
      <div class="rq-grid" id="rq-grid"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn-sm muted" onclick="generateRQ()">🔄 New set</button>
        <button class="btn-sm muted" onclick="revealAll()">👁 Reveal all</button>
        <button class="btn-sm muted" onclick="backToRQSetup()">⚙️ Settings</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════ -->
  <!-- SCREEN 4: FLAGGED CARDS                   -->
  <!-- ══════════════════════════════════════════ -->
  <div class="screen" id="s-flagged">
    <div class="mode-header">
      <button class="back-btn" onclick="showScreen('s-home')">🏠 Home</button>
      <span style="font-size:.84rem;font-weight:700;color:#5a584e">🚩 Flagged for review</span>
    </div>
    <div id="flagged-out"></div>
  </div>

</div><!-- /app -->

<script>

// ═══════════════════════════════════════════════════════
// REIGN CONFIG
// ═══════════════════════════════════════════════════════
const REIGNS = {
  mtc: {
    label: 'Mid Tudor Crisis (1547–58)',
    badge: 'mtc-bg mtc-col',
    go:    'mtc-go',
    fill:  'fill-mtc',
    units: [
      'Unit 1 – Stability of the Monarchy',
      'Unit 2 – Religious Change',
      'Unit 3 – Rebellion and Unrest'
    ],
    hasSource: true,
    hasEssay:  false
  },
  elizabeth: {
    label: 'Elizabeth I (1558–1603)',
    badge: 'elizabeth-bg elizabeth-col',
    go:    'elizabeth-go',
    fill:  'fill-elizabeth',
    units: [
      'Unit 4 – Elizabeth I and Religion',
      'Unit 5 – Government and Parliament',
      'Unit 6 – Financial, Economic and Social Affairs',
      'Unit 7 – Later Years 1588–1603'
    ],
    hasSource: false,
    hasEssay:  true
  }
};

let currentReign = 'elizabeth';

// ═══════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function pickReign(r) {
  currentReign = r;
  const info = REIGNS[r];

  // Badge
  const badge = document.getElementById('reign-badge');
  badge.textContent = info.label;
  badge.className = 'reign-badge ' + info.badge;

  // Unit dropdown
  const unitSel = document.getElementById('k-unit');
  unitSel.innerHTML = '<option value="all">All units</option>' +
    info.units.map(u => `<option value="${u}">${u}</option>`).join('');

  // Random card button colour
  document.getElementById('k-random-btn').className = 'btn-go ' + info.go;

  // Date quiz button colour
  document.getElementById('d-start-btn').className = 'btn-go ' + info.go;

  // Exam routes
  buildExamRoutes(r);

  // Reset knowledge state
  flaggedCards = [];
  learntCards  = new Set();
  buildKPool();
  kPoolTotal = kPool.length;
  updateNavUI();
  updateProgress();
  if (kPool.length) renderKCard(kPool[0]);

  showScreen('s-main');
  setMode('knowledge');
}

function goHome() {
  showScreen('s-home');
  document.getElementById('k-out').innerHTML = '';
  document.getElementById('d-out').innerHTML = '';
}

function setMode(m) {
  ['knowledge', 'dates', 'exam'].forEach(mode => {
    document.getElementById('mb-' + mode).classList.toggle('sel', mode === m);
    document.getElementById('panel-' + mode).style.display = mode === m ? 'block' : 'none';
  });
  document.getElementById('k-out').innerHTML = '';
  document.getElementById('d-out').innerHTML = '';
  document.getElementById('d-start-btn').style.display = 'block';
  if (m === 'exam')      backToExam();
  if (m === 'knowledge') { buildKPool(); updateNavUI(); }
  updateFlagBar();
}

function buildExamRoutes(r) {
  const info = REIGNS[r];
  document.getElementById('exam-intro').textContent = 'Choose your exam practice route:';
  const grid = document.getElementById('exam-grid');
  let html = '';

  if (info.hasSource) {
    html += `<button class="exam-route-btn source" onclick="showSourceMode()">
      <span class="er-label">Question 1 · 30 marks</span>
      📜 Source Analysis<br>
      <small style="font-size:.73rem;opacity:.65">Four primary sources — Edward &amp; Mary</small>
    </button>`;
    html += `<button class="exam-route-btn disabled">
      <span class="er-label">Question 2 · 20 marks</span>
      ✏️ Essay<br>
      <small style="font-size:.73rem;opacity:.65">Not applicable for this reign</small>
    </button>`;
  } else {
    html += `<button class="exam-route-btn disabled">
      <span class="er-label">Question 1 · 30 marks</span>
      📜 Source Analysis<br>
      <small style="font-size:.73rem;opacity:.65">Source Q is Edward &amp; Mary only</small>
    </button>`;
    html += `<button class="exam-route-btn essay" onclick="showEssayMode()">
      <span class="er-label">Question 2 · 20 marks</span>
      ✏️ Essay Questions<br>
      <small style="font-size:.73rem;opacity:.65">Past &amp; practice 20-markers</small>
    </button>`;
  }
  grid.innerHTML = html;
}

function backToExam() {
  document.getElementById('exam-pick').style.display   = 'block';
  document.getElementById('exam-source').style.display = 'none';
  document.getElementById('exam-essay').style.display  = 'none';
}
function showSourceMode() {
  document.getElementById('exam-pick').style.display   = 'none';
  document.getElementById('exam-source').style.display = 'block';
  document.getElementById('exam-essay').style.display  = 'none';
  buildSourcePool();
  drawSource();
}
function showEssayMode() {
  document.getElementById('exam-pick').style.display   = 'none';
  document.getElementById('exam-source').style.display = 'none';
  document.getElementById('exam-essay').style.display  = 'block';
  drawEssay();
}

function showRapid() {
  rqReigns = new Set(['edward','mary','elizabeth']);
  ['edward','mary','elizabeth'].forEach(r => {
    document.getElementById('rqp-' + r).className = 'pill on-' + r;
  });
  rqCount = 10;
  setCount(10);
  document.getElementById('rq-setup').style.display = 'block';
  document.getElementById('rq-out').style.display   = 'none';
  showScreen('s-rapid');
}
function backToRQSetup() {
  document.getElementById('rq-setup').style.display = 'block';
  document.getElementById('rq-out').style.display   = 'none';
}

// ═══════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════
const rand = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = a => {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
};
const tog = id => {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
};
const boldHints = (text, hints) => {
  let out = text;
  hints.forEach(h => {
    const esc = h.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp(`(${esc})`, 'gi'), '<strong>$1</strong>');
  });
  return out;
};

// ═══════════════════════════════════════════════════════
// KNOWLEDGE BUILDER
// ═══════════════════════════════════════════════════════
let kPool = [], kIdx = 0, kPoolTotal = 0;
let learntCards = new Set();
let flaggedCards = [];

function buildKPool() {
  const unit  = document.getElementById('k-unit').value;
  const units = REIGNS[currentReign].units;
  // MTC covers both edward and mary cards
  let all = currentReign === 'mtc'
    ? KC.filter(c => c.reign === 'edward' || c.reign === 'mary')
    : KC.filter(c => c.reign === currentReign);
  all.sort((a, b) => {
    const ui = units.indexOf(a.unit), vi = units.indexOf(b.unit);
    if (ui !== vi) return ui - vi;
    return KC.indexOf(a) - KC.indexOf(b);
  });
  if (unit !== 'all') all = all.filter(c => c.unit === unit);
  const uc = {};
  kPool = all.map(c => {
    const uIdx = units.indexOf(c.unit) + 1;
    uc[uIdx] = (uc[uIdx] || 0) + 1;
    return { card: c, num: `${uIdx}.${uc[uIdx]}` };
  });
  const sel = document.getElementById('k-card-sel');
  sel.innerHTML = kPool.map((e, i) =>
    `<option value="${i}">${e.num} – ${e.card.heading}</option>`).join('');
  kPoolTotal = kPool.length;
}

function updateNavUI() {
  document.getElementById('k-card-num').textContent = kPool.length ? kPool[kIdx].num : '';
  const sel = document.getElementById('k-card-sel');
  if (sel) sel.value = kIdx;
}

function updateProgress() {
  const wrap  = document.getElementById('k-prog-wrap');
  const learnt = kPoolTotal - kPool.length;
  if (kPoolTotal && learnt > 0) {
    wrap.style.display = 'block';
    document.getElementById('k-prog-text').textContent = `${learnt} of ${kPoolTotal} cards learnt`;
    document.getElementById('k-prog-fill').style.width = ((learnt / kPoolTotal) * 100) + '%';
  } else {
    wrap.style.display = 'none';
  }
}

function updateFlagBar() {
  const bar     = document.getElementById('k-flag-bar');
  const homeBtn = document.getElementById('home-flag-btn');
  if (flaggedCards.length) {
    bar.style.display = 'flex';
    document.getElementById('k-flag-num').textContent = flaggedCards.length;
    if (homeBtn) {
      homeBtn.style.display = 'block';
      document.getElementById('home-flag-num').textContent = flaggedCards.length;
    }
  } else {
    bar.style.display = 'none';
    if (homeBtn) homeBtn.style.display = 'none';
  }
}

function drawRandom() {
  buildKPool();
  if (!kPool.length) { document.getElementById('k-out').innerHTML = '<div class="empty">No cards match.</div>'; return; }
  kIdx = Math.floor(Math.random() * kPool.length);
  renderKCard(kPool[kIdx]);
  updateNavUI();
}

function stepCard(dir) {
  if (!kPool.length) { drawRandom(); return; }
  kIdx = (kIdx + dir + kPool.length) % kPool.length;
  renderKCard(kPool[kIdx]);
  updateNavUI();
}

function jumpToCard() {
  const i = parseInt(document.getElementById('k-card-sel').value);
  if (isNaN(i)) return;
  kIdx = i;
  renderKCard(kPool[kIdx]);
  updateNavUI();
}

function onUnitChange() {
  learntCards = new Set();
  buildKPool();
  kPoolTotal = kPool.length;
  kIdx = 0;
  updateNavUI();
  updateProgress();
  if (kPool.length) renderKCard(kPool[0]);
}

function markLearnt() {
  const e = kPool[kIdx];
  learntCards.add(e.card.reign + '|' + e.card.heading);
  kPool.splice(kIdx, 1);
  if (!kPool.length) {
    document.getElementById('k-out').innerHTML = '<div class="empty">All cards learnt! 🎉</div>';
    updateNavUI(); updateProgress(); return;
  }
  kIdx = kIdx % kPool.length;
  renderKCard(kPool[kIdx]);
  updateNavUI();
  updateProgress();
}

function flagCard(btn) {
  const card    = btn.closest('.card');
  const reign   = card.dataset.reign;
  const heading = card.dataset.heading;
  if (!flaggedCards.find(c => c.reign === reign && c.heading === heading)) {
    flaggedCards.push({ reign, heading });
    updateFlagBar();
    btn.textContent = '🚩 Flagged';
    btn.disabled = true;
    btn.style.opacity = '.5';
  }
}

function unflagCard(btn) {
  const card = btn.closest('.card');
  flaggedCards = flaggedCards.filter(c =>
    !(c.reign === card.dataset.reign && c.heading === card.dataset.heading));
  updateFlagBar();
  if (document.getElementById('s-flagged').classList.contains('active')) showFlagged();
  else btn.outerHTML = `<button class="btn-sm" onclick="flagCard(this)">🚩 Flag to review</button>`;
}

function clearFlagged() { flaggedCards = []; updateFlagBar(); }
function goFlagged()    { if (flaggedCards.length) showFlagged(); }

function showFlagged() {
  showScreen('s-flagged');
  const out = document.getElementById('flagged-out');
  if (!flaggedCards.length) { out.innerHTML = '<div class="empty">No flagged cards yet.</div>'; return; }
  out.innerHTML = flaggedCards.map(fc => {
    const card = KC.find(c => c.reign === fc.reign && c.heading === fc.heading);
    if (!card) return '';
    return renderCardHTML(card, null, true);
  }).join('');
}

function renderKCard(entry) {
  document.getElementById('k-out').innerHTML = renderCardHTML(entry.card, entry.num, false);
}

function renderCardHTML(card, num, isFlagged) {
  const uid = 'kc_' + Math.random().toString(36).slice(2, 7);
  const hintsHTML = `<div class="hint-chips">${
    card.hints.map(h => `<span class="tag tag-${card.reign}">${h}</span>`).join('')
  }</div>`;
  const factsHTML = '<ul>' + card.facts.map(f =>
    `<li>${boldHints(f, card.hints)}</li>`).join('') + '</ul>';
  const prompts = [
    'Can you recall 3–5 key points about this topic?',
    'What are the key dates for this topic?',
    'Can you name the key figures involved?',
    'What were the causes and consequences?',
    'How would you explain this in a paragraph?'
  ];
  const alreadyFlagged = flaggedCards.find(c => c.reign === card.reign && c.heading === card.heading);
  const checklistTag = card.checklist
    ? `<span class="tag tag-amber" style="margin-bottom:.4rem">📋 ${card.checklist}</span><br>` : '';

  return `<div class="card" data-reign="${card.reign}" data-heading="${card.heading.replace(/"/g,'&quot;')}">
    <div class="card-stripe" style="background:${
      card.reign==='edward'?'#6B9DE8':card.reign==='mary'?'#E87A6B':'#6BE8A0'
    }"></div>
    <div class="card-inner">
      <div class="card-meta">
        ${num ? `<span class="tag tag-grey">${num}</span>` : ''}
        <span class="tag tag-${card.reign}">${card.unit}</span>
      </div>
      ${checklistTag}
      <div class="card-heading">${card.heading}</div>
      ${!isFlagged ? `<p class="card-prompt">${prompts[Math.floor(Math.random()*5)]}</p>` : ''}
      <div class="btn-row">
        <button class="btn-sm" onclick="tog('${uid}h');this.textContent=this.textContent==='Show hints'?'Hide hints':'Show hints'">Show hints</button>
        <button class="btn-sm" onclick="tog('${uid}f');this.textContent=this.textContent==='Reveal content'?'Hide content':'Reveal content'">Reveal content</button>
        ${isFlagged
          ? `<button class="btn-sm green" onclick="unflagCard(this)">✅ Done</button>`
          : alreadyFlagged
            ? `<button class="btn-sm green" onclick="unflagCard(this)">✅ Remove flag</button>`
            : `<button class="btn-sm" onclick="flagCard(this)">🚩 Flag to review</button>`
        }
        ${!isFlagged ? `<button class="btn-sm green" onclick="markLearnt()">✓ Learnt</button>` : ''}
      </div>
      <div class="reveal" id="${uid}h">${hintsHTML}</div>
      <div class="reveal" id="${uid}f">${factsHTML}</div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════
// DATE QUIZ
// ═══════════════════════════════════════════════════════
let quizPool = [], quizIdx = 0, quizOK = 0, quizBad = 0;

function startDateQuiz() {
  // MTC includes both edward and mary dates
  const pool = currentReign === 'mtc'
    ? DATES.filter(d => d.reign === 'edward' || d.reign === 'mary')
    : DATES.filter(d => d.reign === currentReign);
  if (!pool.length) { document.getElementById('d-out').innerHTML = '<div class="empty">No dates available.</div>'; return; }
  quizPool = shuffle(pool);
  quizIdx = 0; quizOK = 0; quizBad = 0;
  document.getElementById('d-start-btn').style.display = 'none';
  renderDateQ();
}

function renderDateQ() {
  const info = REIGNS[currentReign];
  const pct  = Math.round((quizIdx / quizPool.length) * 100);
  if (quizIdx >= quizPool.length) {
    const score = Math.round((quizOK / quizPool.length) * 100);
    const grade = score >= 80 ? 'grade-a' : score >= 50 ? 'grade-b' : 'grade-c';
    const label = score >= 80 ? 'Strong — well done!' : score >= 50 ? 'Getting there' : 'Keep revising';
    document.getElementById('d-out').innerHTML = `<div class="quiz-end">
      <div class="end-score">${quizOK}/${quizPool.length}</div>
      <div class="end-sub">${score}% correct</div>
      <div class="end-grade ${grade}">${label}</div>
      <button class="btn-go ${info.go}" onclick="startDateQuiz()">Try again</button>
      <button class="btn-go" style="background:#eeede5;color:#1c1a16"
        onclick="document.getElementById('d-start-btn').style.display='block';document.getElementById('d-out').innerHTML=''">← Back</button>
    </div>`;
    return;
  }
  const q       = quizPool[quizIdx];
  const distract = shuffle(DATES.filter(d => d.date !== q.date)).slice(0, 3);
  const opts     = shuffle([q, ...distract]);
  const uid      = 'dq' + quizIdx;
  document.getElementById('d-out').innerHTML = `
    <div class="quiz-prog"><div class="quiz-fill ${info.fill}" style="width:${pct}%"></div></div>
    <div class="quiz-hdr">
      <span class="quiz-hdr-l">Question ${quizIdx + 1} of ${quizPool.length}</span>
      <div class="sc-row"><span class="sc sc-c">✓ ${quizOK}</span><span class="sc sc-w">✗ ${quizBad}</span></div>
    </div>
    <div class="quiz-card">
      <div class="quiz-date">${q.date}</div>
      <div class="quiz-prompt">What happened on this date?</div>
      <div class="opts">${opts.map((o, i) =>
        `<button class="opt" id="${uid}_${i}"
          onclick="checkDate(this,'${uid}','${o===q?'c':'w'}','${uid}_${opts.findIndex(x=>x===q)}')"
         >${o.event}</button>`
      ).join('')}</div>
      <div class="quiz-fb" id="${uid}_fb"></div>
    </div>`;
}

function checkDate(btn, uid, res, cid) {
  document.querySelectorAll(`[id^="${uid}_"]`).forEach(b => { if (b.tagName === 'BUTTON') b.disabled = true; });
  const cb = document.getElementById(cid);
  if (cb) cb.classList.add('show-c');
  if (res === 'c') { btn.classList.add('correct'); quizOK++; }
  else { btn.classList.add('wrong'); if (cb) cb.classList.add('correct'); quizBad++; }
  const fb = document.getElementById(uid + '_fb');
  if (fb) { fb.style.display = 'block'; fb.className = 'quiz-fb ' + (res==='c'?'fb-c':'fb-w'); fb.textContent = res==='c' ? '✓ Correct!' : '✗ Incorrect'; }
  setTimeout(() => { quizIdx++; renderDateQ(); }, 1500);
}

let rqReigns = new Set(['edward','mary','elizabeth']);
let rqCount  = 10;

function setCount(n) {
  rqCount = n;
  [5, 10, 15].forEach(c => {
    document.getElementById('cnt-' + c).classList.toggle('sel', c === n);
  });
}

function toggleReign(r) {
  if (rqReigns.has(r)) { if (rqReigns.size > 1) rqReigns.delete(r); }
  else rqReigns.add(r);
  document.getElementById('rqp-' + r).className = 'pill ' + (rqReigns.has(r) ? 'on-' + r : '');
}

function generateRQ() {
  const pool = shuffle(RQ.filter(q => rqReigns.has(q.reign))).slice(0, rqCount);
  document.getElementById('rq-setup').style.display = 'none';
  document.getElementById('rq-out').style.display   = 'block';
  document.getElementById('rq-grid').innerHTML = pool.map((q, i) =>
    `<div class="rq-card" id="rqc${i}" onclick="revealRQ(${i})">
      <div class="rq-q"><span class="rq-dot dot-${q.reign}"></span>${q.q}</div>
      <div class="rq-a">${q.a}</div>
      <div class="rq-tap">Tap to reveal</div>
    </div>`
  ).join('');
}

function revealRQ(i) { document.getElementById('rqc' + i).classList.add('revealed'); }
function revealAll()  { document.querySelectorAll('.rq-card').forEach(c => c.classList.add('revealed')); }

// ═══════════════════════════════════════════════════════
// SOURCE SETS
// ═══════════════════════════════════════════════════════
let sourcePool = [], sourceIdx = 0;

function buildSourcePool() {
  // Source sets tagged as 'edward' or 'mary' — both shown under MTC
  sourcePool = currentReign === 'mtc'
    ? SOURCE_SETS.filter(s => s.reign === 'edward' || s.reign === 'mary')
    : SOURCE_SETS.filter(s => s.reign === currentReign);
  sourceIdx = 0;
}

function drawSource() {
  if (!sourcePool.length) buildSourcePool();
  if (!sourcePool.length) { document.getElementById('source-out').innerHTML = '<div class="empty">No source sets for this reign.</div>'; return; }
  sourceIdx = Math.floor(Math.random() * sourcePool.length);
  renderSourceSet(sourcePool[sourceIdx]);
}

function stepSource(dir) {
  if (!sourcePool.length) buildSourcePool();
  sourceIdx = (sourceIdx + dir + sourcePool.length) % sourcePool.length;
  renderSourceSet(sourcePool[sourceIdx]);
}

function renderSourceSet(ss) {
  const uid = 'ss_' + Math.random().toString(36).slice(2, 6);
  const sourcesHTML = ss.sources.map((s, i) => {
    const sid = `${uid}_s${i}`;
    const approachHTML = s.approach ? `
      <div class="approach-box" id="${sid}_ap">
        <div class="approach-title">Provenance considerations</div>
        <ul class="approach-list">${s.approach.map(a => `<li>${a}</li>`).join('')}</ul>
      </div>
      <button class="btn-sm muted" style="margin-top:.5rem;font-size:.74rem"
        onclick="tog('${sid}_ap');this.textContent=this.textContent.includes('Show')?'Hide provenance notes':'Show provenance notes'">
        Show provenance notes
      </button>` : '';
    return `<div class="source-item">
      <div class="source-item-hdr">Source ${String.fromCharCode(65 + i)}</div>
      <div class="source-item-prov">${s.prov}</div>
      <div class="source-item-text">${s.text}</div>
      ${approachHTML}
    </div>`;
  }).join('');

  document.getElementById('source-out').innerHTML = `
    <div class="source-set-card">
      <div class="source-set-header">
        <div class="source-set-q">${ss.question}</div>
        <div class="source-set-meta">30 marks · Edward &amp; Mary Source Analysis</div>
      </div>
      <div class="source-body">
        ${sourcesHTML}
        <div class="approach-box open">
          <div class="approach-title">Structure reminder</div>
          <ul class="approach-list">
            <li>Introduction: which sources agree / disagree on the surface? State your thesis.</li>
            <li>For each source: Agree or disagree? → 2 source details → Contextual knowledge → Provenance (Nature, Origin, Purpose) → Mini-conclusion on value.</li>
            <li>Conclusion: as a set of 4, do they support the view?</li>
            <li>You cannot reach L4+ using only provenance <strong>or</strong> only knowledge — you must use both.</li>
          </ul>
        </div>
      </div>
    </div>`;
}

function drawEssay() {
  const q   = rand(ESSAY_QS);
  const uid = 'eq_' + Math.random().toString(36).slice(2, 6);
  document.getElementById('essay-out').innerHTML = `
    <div class="essay-card">
      <div class="essay-q">${q.q}</div>
      <div class="essay-meta">${q.year} · ${q.topic}</div>
      <div class="btn-row">
        <button class="btn-sm" onclick="tog('${uid}_str');this.textContent=this.textContent.includes('Show')?'Hide essay structure':'Show essay structure'">
          Show essay structure
        </button>
      </div>
      <div class="essay-struct" id="${uid}_str">
        <div class="essay-struct-title">Structure: Factor – Yes – But – So (×3)</div>
        <table>
          <tr><td>Intro</td><td>Deconstruct question. Set criteria for analysis. State thesis.</td></tr>
          <tr><td>Factor 1</td><td><strong>Yes</strong> — specific knowledge showing this factor answers the question. <strong>But</strong> — limitations with specific knowledge. <strong>So</strong> — mini-judgement with relative significance.</td></tr>
          <tr><td>Factor 2</td><td>Repeat Factor–Yes–But–So.</td></tr>
          <tr><td>Factor 3</td><td>Repeat Factor–Yes–But–So.</td></tr>
          <tr><td>Conclusion</td><td>Sum up argument. Should not surprise the reader. Link back to thesis.</td></tr>
        </table>
      </div>
    </div>`;
}
